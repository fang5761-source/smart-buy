<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智能採買</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="智能採買">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&display=swap');
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .animate-slide-up { animation: slideUp 0.3s ease-out; }
    input:focus { font-size: 16px !important; }
    .font-serif-tc { font-family: 'Noto Serif TC', serif; }
    body { overflow-x: hidden; width: 100vw; background-color: #f5f5f5; -webkit-tap-highlight-color: transparent; }
    .no-select { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  </style>
</head>
<body class="bg-neutral-100 text-neutral-800 antialiased font-sans min-h-screen flex justify-center">
  <div id="root" class="w-full flex justify-center"></div>

  <script type="text/babel" data-type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, setDoc, query, orderBy, writeBatch, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    const { useState, useEffect, useRef } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyC36SqZOaZR3iYfMMDg5NQlADKdwEaZ5bk",
      authDomain: "smart-buy-dbaae.firebaseapp.com",
      projectId: "smart-buy-dbaae",
      storageBucket: "smart-buy-dbaae.firebasestorage.app",
      messagingSenderId: "176643347488",
      appId: "1:176643347488:web:182ef57838ae4358e4d845",
      measurementId: "G-7E04LF7E9P"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = "smart-buy-final";

    // --- 圖示庫加固：確保所有被呼叫的圖示都存在且支援 size 屬性 ---
    const Icons = {
      Cart: ({size = 22}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>,
      Plus: ({size = 20}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
      Trash: ({size = 20}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>,
      Check: ({size = 20}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><polyline points="20 6 9 17 4 12"/></svg>,
      Clock: ({size = 18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
      Dollar: ({size = 14}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>,
      Share: ({size = 18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8m-4-6-4-4-4 4m4-4v13"/></svg>,
      User: ({size = 16}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
      Settings: ({size = 18}) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor">
          <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.21.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
        </svg>
      ),
      X: ({size = 18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
      ChevronDown: ({size = 18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="m6 9 6 6 6-6"/></svg>,
      ChevronUp: ({size = 18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="m18 15-6-6-6 6"/></svg>,
      GripVertical: ({size = 18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><circle cx="9" cy="12" r="1.5"></circle><circle cx="9" cy="6" r="1.5"></circle><circle cx="9" cy="18" r="1.5"></circle><circle cx="15" cy="12" r="1.5"></circle><circle cx="15" cy="6" r="1.5"></circle><circle cx="15" cy="18" r="1.5"></circle></svg>,
      MapPin: ({size = 14}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
    };

    const DEFAULT_TAGS = ['全聯', '菜市場'];
    const DEFAULT_QUICK = [{n:'雞蛋',t:'全聯'}];

    const App = () => {
      const [user, setUser] = useState(null);
      const [items, setItems] = useState([]);
      const [history, setHistory] = useState({});
      const [customTags, setCustomTags] = useState(DEFAULT_TAGS);
      const [quickItems, setQuickItems] = useState(DEFAULT_QUICK);
      
      const [inputValue, setInputValue] = useState('');
      const [qtyValue, setQtyValue] = useState('');
      const [activeTag, setActiveTag] = useState('');
      const [filterTag, setFilterTag] = useState('全部');
      const [isShoppingMode, setIsShoppingMode] = useState(false);
      const [roomCode, setRoomCode] = useState(() => localStorage.getItem('smart_buy_room') || '');
      
      const [modalState, setModalState] = useState({ type: null, data: null });
      const [msg, setMsg] = useState('');
      
      // 彈窗狀態暫存
      const [modalInput, setModalInput] = useState('');
      const [modalSelect, setModalSelect] = useState('');

      const [hDragIdx, setHDragIdx] = useState(null);
      const [hDragOverIdx, setHDragOverIdx] = useState(null);
      const [hDragType, setHDragType] = useState(null); 
      const dragDidHappen = useRef(false);
      const touchTimer = useRef(null);

      const [vDragIdx, setVDragIdx] = useState(null);
      const [vDragOverIdx, setVDragOverIdx] = useState(null);

      const inputRef = useRef(null);

      useEffect(() => {
        const preventScroll = (e) => { if (hDragIdx !== null || vDragIdx !== null) e.preventDefault(); };
        document.addEventListener('touchmove', preventScroll, { passive: false });
        return () => document.removeEventListener('touchmove', preventScroll);
      }, [hDragIdx, vDragIdx]);

      useEffect(() => {
        onAuthStateChanged(auth, u => { if (u) setUser(u); else signInAnonymously(auth).catch(console.error); });
      }, []);

      useEffect(() => {
        if (!user) return;
        const pathPrefix = roomCode ? `room_${roomCode}` : `user_${user.uid}`;
        
        const unsubItems = onSnapshot(query(collection(db, 'artifacts', appId, 'public', 'data', `list_${pathPrefix}`), orderBy('createdAt', 'desc')), snap => {
          setItems(snap.docs.map(d => ({ id: d.id, ...d.data() })));
        }, err => console.error("Firebase Items error:", err));

        const unsubHist = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', `hist_${pathPrefix}`), snap => {
          const h = {}; snap.docs.forEach(d => { const data = d.data(); h[data.name] = data; }); setHistory(h);
        });

        const unsubConfig = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', `config_${pathPrefix}`, 'settings'), snap => {
          if (snap.exists()) {
            const data = snap.data();
            if (data.tags) setCustomTags(data.tags);
            if (data.quick) setQuickItems(data.quick.filter(q => q && (q.n || q.name)));
          } else {
            setDoc(snap.ref, { tags: DEFAULT_TAGS, quick: DEFAULT_QUICK });
          }
        });
        return () => { unsubItems(); unsubHist(); unsubConfig(); };
      }, [user, roomCode]);

      const getConfigRef = () => doc(db, 'artifacts', appId, 'public', 'data', `config_${roomCode ? `room_${roomCode}` : `user_${user.uid}`}`, 'settings');
      const getItemRef = (id) => doc(db, 'artifacts', appId, 'public', 'data', `list_${roomCode ? `room_${roomCode}` : `user_${user.uid}`}`, id);

      const handleAdd = async (e) => {
        if (e) e.preventDefault();
        if (!inputValue.trim() || !user) return;
        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', `list_${roomCode ? `room_${roomCode}` : `user_${user.uid}`}`), {
          name: inputValue.trim(), qty: qtyValue.trim(), tag: activeTag || '', completed: false, postponed: false, createdAt: Date.now()
        });
        setInputValue(''); setQtyValue('');
      };

      const handleQuickSelect = (qa) => {
        setInputValue(qa.n || qa.name || '');
        setActiveTag(qa.t || qa.tag || '');
      };

      const handleComplete = async (item) => { await updateDoc(getItemRef(item.id), { completed: !item.completed, postponed: false }); };
      const handlePostpone = async (e, item) => { e.stopPropagation(); await updateDoc(getItemRef(item.id), { postponed: !item.postponed, completed: false }); };

      const savePrice = async (itemName, price, itemTag, itemId) => {
        if (!price) return;
        const pathPrefix = roomCode ? `room_${roomCode}` : `user_${user.uid}`;
        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', `hist_${pathPrefix}`, itemName), { name: itemName, price, tag: itemTag || '', updatedAt: Date.now() });
        if (itemId) await updateDoc(getItemRef(itemId), { currentPrice: price });
      };

      const handleAddNewTag = async (tagName) => {
        if (!tagName || !tagName.trim()) return;
        const next = [...customTags, tagName.trim()];
        await updateDoc(getConfigRef(), { tags: next });
        setMsg('地點新增成功'); setTimeout(() => setMsg(''), 1000);
      };

      const handleAddNewQuick = async (name, tag) => {
        if (!name || !name.trim()) return;
        const next = [...quickItems.map(q => ({n: q.n || q.name, t: q.t || q.tag || ''})), { n: name.trim(), t: tag || '' }];
        await updateDoc(getConfigRef(), { quick: next });
        setMsg('品項新增成功'); setTimeout(() => setMsg(''), 1000);
      };

      const delTag = async (t) => {
        const next = customTags.filter(tag => tag !== t);
        await updateDoc(getConfigRef(), { tags: next });
      };

      const delQuick = async (idx) => {
        const next = quickItems.filter((_, i) => i !== idx).map(q => ({n: q.n || q.name, t: q.t || q.tag || ''}));
        await updateDoc(getConfigRef(), { quick: next });
      };

      const onHStart = (idx, type) => {
        dragDidHappen.current = false;
        touchTimer.current = setTimeout(() => {
          setHDragIdx(idx); setHDragType(type); dragDidHappen.current = true;
          if (navigator.vibrate) navigator.vibrate(50);
        }, 400);
      };
      const onHMove = (e, attr) => {
        if (hDragIdx === null) { clearTimeout(touchTimer.current); return; }
        e.preventDefault();
        const touch = e.touches[0];
        const target = document.elementFromPoint(touch.clientX, touch.clientY);
        const dropElem = target?.closest(`[${attr}]`);
        if (dropElem) {
          const overIdx = parseInt(dropElem.getAttribute(attr), 10);
          if (overIdx !== hDragOverIdx && overIdx !== hDragIdx) setHDragOverIdx(overIdx);
        }
      };
      const onHEnd = async () => {
        clearTimeout(touchTimer.current);
        if (hDragIdx !== null) {
          if (hDragOverIdx !== null && hDragIdx !== hDragOverIdx) {
            if (hDragType === 'tag') {
              const next = [...customTags]; const [moved] = next.splice(hDragIdx, 1); next.splice(hDragOverIdx, 0, moved);
              setCustomTags(next); await updateDoc(getConfigRef(), { tags: next });
            } else {
              const next = [...quickItems]; const [moved] = next.splice(hDragIdx, 1); next.splice(hDragOverIdx, 0, moved);
              setQuickItems(next); const serialized = next.map(q => ({n: q.n || q.name, t: q.t || q.tag || ''})); await updateDoc(getConfigRef(), { quick: serialized });
            }
          }
          setHDragIdx(null); setHDragOverIdx(null); setHDragType(null);
        }
      };

      const onVStart = (idx) => { setVDragIdx(idx); if (navigator.vibrate) navigator.vibrate(30); };
      const onVMove = (e, attr) => {
        if (vDragIdx === null) return;
        const touch = e.touches[0];
        const target = document.elementFromPoint(touch.clientX, touch.clientY);
        const dropElem = target?.closest(`[${attr}]`);
        if (dropElem) {
          const hoverIdx = parseInt(dropElem.getAttribute(attr), 10);
          if (hoverIdx !== vDragOverIdx) setVDragOverIdx(hoverIdx);
        }
      };
      const onVEnd = async (type) => {
        if (vDragIdx !== null && vDragOverIdx !== null && vDragIdx !== vDragOverIdx) {
          if (type === 'tag') {
            const next = [...customTags]; const [moved] = next.splice(vDragIdx, 1); next.splice(vDragOverIdx, 0, moved);
            setCustomTags(next); await updateDoc(getConfigRef(), { tags: next });
          } else {
            const next = [...quickItems]; const [moved] = next.splice(vDragIdx, 1); next.splice(vDragOverIdx, 0, moved);
            setQuickItems(next); const serialized = next.map(q => ({n: q.n || q.name, t: q.t || q.tag || ''})); await updateDoc(getConfigRef(), { quick: serialized });
          }
        }
        setVDragIdx(null); setVDragOverIdx(null);
      };

      const handleTuneRoom = (v) => {
        const code = v.trim();
        if (!code) { setRoomCode(''); localStorage.removeItem('smart_buy_room'); return; }
        setRoomCode(code); localStorage.setItem('smart_buy_room', code);
        setMsg(`頻道 ${code} 已連線`); setTimeout(() => setMsg(''), 1500);
      };

      // --- 核心修正：讓地點分頁永遠顯示所有自訂地點 ---
      const filterListTags = ['全部', ...customTags]; 
      const filteredItems = (items || []).filter(item => filterTag === '全部' ? true : item.tag === filterTag);

      return (
        <div className="min-h-screen bg-neutral-100 flex justify-center items-start sm:pt-8 font-sans w-full no-select">
          <div className="w-full max-w-md bg-white h-fit min-h-[100vh] sm:min-h-[500px] flex flex-col relative shadow-2xl overflow-hidden sm:rounded-3xl mb-8">
            
            <header className="bg-emerald-700 text-white px-3 py-4 flex justify-between items-center shrink-0 shadow-lg z-20">
              <div className="flex items-center gap-2 font-bold"><Icons.Cart /><h1 className="text-xl sm:text-2xl tracking-tight font-serif-tc">智能採買</h1></div>
              <button onClick={() => setModalState({ type: 'room' })} className={`px-2.5 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition-all active:scale-95 ${roomCode ? 'bg-amber-400 text-amber-900 shadow-inner' : 'bg-emerald-600 text-white border border-emerald-500'}`}>{roomCode ? `頻道 ${roomCode}` : '進入頻道'}</button>
            </header>

            <div className={`transition-all duration-300 origin-top overflow-hidden bg-emerald-50 shrink-0 shadow-sm ${isShoppingMode ? 'max-h-0 opacity-0' : 'max-h-[450px] opacity-100 border-b border-emerald-100'}`}>
              <div className="p-3 space-y-3">
                <form onSubmit={handleAdd} className="flex gap-2 items-center">
                  <input type="text" value={inputValue} onChange={e => setInputValue(e.target.value)} placeholder="例如：雞蛋" className="flex-1 min-w-0 p-3 rounded-xl border-none shadow-inner focus:ring-2 focus:ring-emerald-600 outline-none text-lg bg-white" />
                  <input type="text" value={qtyValue} onChange={e => setQtyValue(e.target.value)} placeholder="數量" className="w-14 sm:w-16 p-3 rounded-xl border-none shadow-inner text-center outline-none text-base bg-white" />
                  <button type="submit" className="bg-emerald-700 text-white p-3 rounded-xl shadow-lg active:scale-95 shrink-0"><Icons.Plus /></button>
                </form>
                
                <div className={`flex items-center gap-2 pb-1 relative ${hDragType === 'quick' ? 'overflow-hidden' : 'overflow-x-auto scrollbar-hide'}`} onTouchMove={(e) => onHMove(e, 'data-h-quick-index')}>
                  <button type="button" onClick={() => setModalState({ type: 'manageQuick' })} className="shrink-0 text-emerald-600 flex items-center justify-center p-1.5 bg-emerald-100 rounded-full active:scale-95 shadow-sm"><Icons.Settings size={18}/></button>
                  {(quickItems || []).map((qa, i) => (
                    <button key={i} data-h-quick-index={i} onTouchStart={() => onHStart(i, 'quick')} onTouchEnd={onHEnd} onTouchCancel={onHEnd} onClick={() => { if (!dragDidHappen.current) handleQuickSelect(qa); }} className={`whitespace-nowrap px-3 py-1.5 rounded-full text-xs font-bold active:scale-90 transition-all no-select ${hDragIdx === i && hDragType === 'quick' ? 'scale-110 opacity-80 shadow-xl bg-amber-500 text-white z-50' : hDragOverIdx === i && hDragType === 'quick' ? 'border-2 border-dashed border-amber-500' : 'bg-amber-50 border border-amber-200 text-amber-700'}`}>+ {qa.n || qa.name}</button>
                  ))}
                  <button type="button" onClick={() => { setModalInput(''); setModalState({ type: 'addQuick' }); }} className="shrink-0 px-3 py-1.5 rounded-full text-xs font-bold text-amber-600 bg-amber-50 border border-amber-200 border-dashed flex items-center justify-center"><Icons.Plus size={14} /></button>
                </div>

                <div className={`flex items-center gap-2 pt-2 border-t border-emerald-100/50 mt-1 relative ${hDragType === 'tag' ? 'overflow-hidden' : 'overflow-x-auto scrollbar-hide'}`} onTouchMove={(e) => onHMove(e, 'data-h-tag-index')}>
                  <button type="button" onClick={() => setModalState({ type: 'manageTag' })} className="shrink-0 text-emerald-600 flex items-center justify-center p-1.5 bg-emerald-100 rounded-full active:scale-95 shadow-sm"><Icons.Settings size={18}/></button>
                  {(customTags || []).map((t, idx) => (
                    <button key={t} data-h-tag-index={idx} onTouchStart={() => onHStart(idx, 'tag')} onTouchEnd={onHEnd} onTouchCancel={onHEnd} onClick={() => { if (!dragDidHappen.current) setActiveTag(activeTag === t ? '' : t); }} className={`shrink-0 px-3 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-all no-select ${hDragIdx === idx && hDragType === 'tag' ? 'scale-110 opacity-80 shadow-xl bg-emerald-500 text-white z-50' : hDragOverIdx === idx && hDragType === 'tag' ? 'border-2 border-dashed border-emerald-500' : activeTag === t ? 'bg-emerald-700 text-white shadow-md' : 'bg-white text-emerald-700 border border-emerald-200'}`}>{t}</button>
                  ))}
                  <button type="button" onClick={() => { setModalInput(''); setModalState({ type: 'addTag' }); }} className="shrink-0 px-3 py-1.5 rounded-full text-xs font-bold text-emerald-600 bg-emerald-50 border border-emerald-200 border-dashed flex items-center justify-center"><Icons.Plus size={14} /></button>
                </div>
              </div>
            </div>

            <button onClick={() => setIsShoppingMode(!isShoppingMode)} className={`shrink-0 w-full py-3 flex items-center justify-center gap-2 text-sm font-bold border-b transition-colors ${isShoppingMode ? 'bg-emerald-100 text-emerald-700 border-emerald-200' : 'bg-neutral-50 text-neutral-500'}`}>
              {isShoppingMode ? <><Icons.ChevronDown size={18} /> ➕ 展開備戰區</> : <><Icons.Cart size={18} /> 🛒 收起並開始採買</>}
            </button>

            {filterListTags.length > 1 && (
              <div className="bg-white border-b border-neutral-100 flex overflow-x-auto scrollbar-hide shrink-0 shadow-sm">
                {filterListTags.map(tag => (<button key={`filter-${tag}`} onClick={() => setFilterTag(tag)} className={`flex-1 min-w-[70px] py-3 text-sm font-bold transition-colors relative whitespace-nowrap px-2 ${filterTag === tag ? 'text-emerald-700 font-bold' : 'text-neutral-400 bg-neutral-50/20'}`}>{tag}{filterTag === tag && <div className="absolute bottom-0 left-0 right-0 h-0.5 bg-emerald-700" />}</button>))}
              </div>
            )}

            <main className="p-3 space-y-3 bg-neutral-50/50 flex-1 overflow-y-auto">
              {(filteredItems || []).map(item => (
                <div key={item.id} className={`flex items-start gap-3 p-3 rounded-2xl border transition-all ${item.completed ? 'bg-neutral-100 border-neutral-200 opacity-60' : item.postponed ? 'bg-amber-50/50 border-amber-200 shadow-inner' : 'bg-white border-emerald-100 shadow-sm'}`}>
                  <div className="flex flex-col items-center gap-2 shrink-0 mt-0.5">
                    <div onClick={() => handleComplete(item)} className={`w-8 h-8 rounded-full border-2 flex items-center justify-center transition-colors cursor-pointer ${item.completed ? 'bg-emerald-600 border-emerald-600 text-white shadow-inner' : 'border-neutral-300 bg-white'}`}>{item.completed && <Icons.Check size={18} />}</div>
                    {!item.completed && <button onClick={(e) => handlePostpone(e, item)} className={`p-1.5 rounded-lg transition-colors active:scale-75 ${item.postponed ? 'text-amber-500 bg-amber-100' : 'text-neutral-400 bg-neutral-50'}`}><Icons.Clock size={18} /></button>}
                  </div>
                  <div className="flex flex-col min-w-0 flex-1 gap-2 w-full py-0.5">
                    <div className="flex items-center justify-between gap-2 w-full">
                      <div className="flex items-center gap-2 min-w-0 flex-1">
                        <span onClick={() => handleComplete(item)} className={`text-lg font-bold truncate cursor-pointer ${item.completed ? 'line-through text-neutral-400' : item.postponed ? 'text-amber-800' : 'text-neutral-800'}`}>{item.name}</span>
                        {item.qty ? <button onClick={(e) => { e.stopPropagation(); setModalInput(item.qty); setModalState({ type: 'editQty', data: item }); }} disabled={item.completed} className={`text-[10px] px-1.5 py-0.5 rounded font-bold whitespace-nowrap shrink-0 ${item.completed ? 'text-neutral-400' : 'bg-neutral-100 text-neutral-600 shadow-sm'}`}>{item.qty}</button> : !item.completed && <button onClick={(e) => { e.stopPropagation(); setModalInput(''); setModalState({ type: 'editQty', data: item }); }} className="text-[10px] px-1.5 py-0.5 rounded border border-dashed border-neutral-300 text-neutral-400 font-bold whitespace-nowrap active:scale-90">+數量</button>}
                      </div>
                      {!item.completed && <button onClick={(e) => { e.stopPropagation(); setModalInput(''); setModalState({ type: 'recordingPrice', data: item }); }} className={`px-2.5 py-1 rounded-lg text-xs font-bold active:scale-90 shrink-0 whitespace-nowrap ${item.currentPrice ? 'bg-emerald-100 text-emerald-700 border border-emerald-200 shadow-sm' : 'bg-amber-100 text-amber-700 shadow-sm'}`}>{item.currentPrice ? `現價 $${item.currentPrice}` : '記 $'}</button>}
                    </div>
                    <div className="flex items-center justify-between gap-2 mt-1 w-full">
                      <div className="flex items-center gap-2 min-w-0 flex-1">
                        <button onClick={(e) => { e.stopPropagation(); setModalState({ type: 'editingTag', data: item }); }} className={`shrink-0 text-[10px] px-2 py-0.5 rounded font-bold active:scale-95 transition-transform flex items-center gap-1 ${item.completed ? 'bg-neutral-200 text-neutral-400' : item.tag && item.tag !== '無' ? 'bg-[#e6f4ea] text-[#1e8e3e] border border-emerald-100' : 'bg-neutral-100 text-neutral-400 border border-dashed border-neutral-300'}`}>{item.tag && item.tag !== '無' ? item.tag : '+地點'}</button>
                        {history[item.name] && !item.completed && <span className="text-[10px] text-amber-600 font-bold truncate text-right whitespace-nowrap">上次買：${history[item.name].price} ({history[item.name].tag || '無'})</span>}
                      </div>
                      <button onClick={() => deleteDoc(getItemRef(item.id))} className="p-1.5 text-neutral-300 hover:text-red-500 active:scale-75 shrink-0"><Icons.Trash size={18} /></button>
                    </div>
                  </div>
                </div>
              ))}
            </main>

            {/* 彈窗系統：加裝防白裝甲，確保數據物件存在才渲染 */}
            {modalState.type && (
              <div className="fixed inset-0 bg-black/60 z-[120] flex items-end sm:items-center justify-center p-4 backdrop-blur-sm" onClick={() => setModalState({ type: null, data: null })}>
                <div className="bg-white w-full max-w-sm rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl animate-slide-up flex flex-col" onClick={e => e.stopPropagation()}>
                  <div className="flex justify-between items-center mb-4 border-b border-neutral-100 pb-2">
                    <h3 className="text-lg font-bold text-emerald-700 font-serif-tc">設定中心</h3>
                    <button onClick={() => setModalState({ type: null, data: null })}><Icons.X /></button>
                  </div>
                  
                  {modalState.type === 'addTag' && <div className="space-y-4"><input type="text" value={modalInput} onChange={e => setModalInput(e.target.value)} placeholder="輸入新地點..." className="w-full p-4 rounded-xl border-2 border-emerald-100 outline-none text-xl font-bold text-center" autoFocus /><button onClick={async () => { await handleAddNewTag(modalInput); setModalState({ type: null }); }} className="w-full bg-emerald-700 text-white py-4 rounded-xl font-bold text-lg">新增地點</button></div>}
                  {modalState.type === 'addQuick' && <div className="space-y-4"><input type="text" value={modalInput} onChange={e => setModalInput(e.target.value)} placeholder="品項名稱..." className="w-full p-4 rounded-xl border-2 border-amber-100 outline-none text-xl font-bold text-center" autoFocus /><select value={modalSelect} onChange={e => setModalSelect(e.target.value)} className="w-full p-3 bg-neutral-50 rounded-xl border font-bold"><option value="">無預設地點</option>{customTags.map(t => <option key={t} value={t}>{t}</option>)}</select><button onClick={async () => { await handleAddNewQuick(modalInput, modalSelect); setModalState({ type: null }); }} className="w-full bg-amber-600 text-white py-4 rounded-xl font-bold text-lg shadow-lg">新增品項</button></div>}
                  {modalState.type === 'editingTag' && modalState.data && <div className="grid grid-cols-2 gap-2 overflow-y-auto max-h-[50vh]">{Array.from(new Set(customTags)).map(t => <button key={t} onClick={async () => { await updateDoc(getItemRef(modalState.data.id), { tag: t }); setModalState({ type: null }); }} className={`py-3 rounded-xl font-bold text-sm border ${modalState.data.tag === t ? 'bg-emerald-600 text-white' : 'bg-neutral-50 text-neutral-600'}`}>{t}</button>)}<button onClick={async () => { await updateDoc(getItemRef(modalState.data.id), { tag: '' }); setModalState({ type: null }); }} className="col-span-2 py-3 bg-neutral-100 text-neutral-400 font-bold rounded-xl border-dashed border-2">清除地點</button></div>}
                  {modalState.type === 'editQty' && modalState.data && <div className="space-y-4"><input type="text" value={modalInput} onChange={e => setModalInput(e.target.value)} placeholder="數量..." className="w-full p-4 rounded-xl border-2 border-emerald-100 outline-none text-xl font-bold text-center" autoFocus /><div className="flex gap-2"><button onClick={async () => { await updateDoc(getItemRef(modalState.data.id), { qty: '' }); setModalState({ type: null }); }} className="flex-1 bg-neutral-100 text-neutral-500 py-3 rounded-xl font-bold">清除</button><button onClick={async () => { await updateDoc(getItemRef(modalState.data.id), { qty: modalInput }); setModalState({ type: null }); }} className="flex-[2] bg-emerald-600 text-white py-3 rounded-xl font-bold text-lg">更新</button></div></div>}
                  {modalState.type === 'recordingPrice' && modalState.data && <div className="space-y-4"><div className="text-xs text-amber-600 font-bold bg-amber-50 p-2 rounded-lg italic text-center">{history[modalState.data.name] ? `上次買：$${history[modalState.data.name].price}` : '目前無紀錄'}</div><input type="number" value={modalInput} onChange={e => setModalInput(e.target.value)} placeholder="金額..." className="w-full p-4 rounded-xl border-2 border-emerald-100 outline-none text-xl font-bold text-center" autoFocus /><button onClick={async () => { await savePrice(modalState.data.name, modalInput, modalState.data.tag, modalState.data.id); setModalState({ type: null }); }} className="w-full bg-emerald-600 text-white py-4 rounded-xl font-bold">確定紀錄</button></div>}
                  {(modalState.type === 'manageTag' || modalState.type === 'manageQuick') && (
                    <div className="overflow-y-auto max-h-[60vh] space-y-2 no-select" onTouchMove={(e) => onVMove(e, modalState.type === 'manageTag' ? 'data-v-tag-index' : 'data-v-quick-index')}>
                      <p className="text-xs text-neutral-400 mb-2 font-bold flex justify-center items-center gap-1"><Icons.GripVertical size={12}/> 拖曳手把自由排序</p>
                      {(modalState.type === 'manageTag' ? customTags : quickItems).map((item, idx) => (
                        <div key={idx} data-v-tag-index={modalState.type === 'manageTag' ? idx : undefined} data-v-quick-index={modalState.type === 'manageQuick' ? idx : undefined} className={`flex justify-between items-center bg-neutral-50 p-2 rounded-xl border transition-all ${vDragIdx === idx ? 'opacity-40 border-emerald-500 scale-95' : 'border-neutral-100'}`}>
                          <div className="flex items-center gap-2 flex-1"><div className="p-2 text-neutral-300 cursor-move touch-none" onTouchStart={() => onVStart(idx)} onTouchEnd={() => onVEnd(modalState.type === 'manageTag' ? 'tag' : 'quick')}><Icons.GripVertical /></div><span className="font-bold text-neutral-700">{modalState.type === 'manageTag' ? item : (item.n || item.name)}</span></div>
                          <button onClick={() => modalState.type === 'manageTag' ? delTag(item) : delQuick(idx)} className="text-red-400 p-2 active:scale-75"><Icons.Trash size={18}/></button>
                        </div>
                      ))}
                    </div>
                  )}
                  {modalState.type === 'room' && (
                    <div className="space-y-6">
                      <div className="pt-2"><h3 className="text-xs font-bold text-neutral-500 mb-2">對頻設定</h3><div className="space-y-3 mb-4"><input type="text" value={roomCode} onChange={e => setRoomCode(e.target.value)} placeholder="代號 (如 888)" className="w-full p-3 bg-neutral-100 rounded-xl outline-none border-2 border-emerald-100 text-xl text-center font-bold" /><button onClick={() => handleTuneRoom(roomCode)} className="w-full bg-emerald-700 text-white py-3 rounded-xl font-bold shadow-lg">對頻連線</button></div></div>
                      {roomCode && <button onClick={() => handleTuneRoom('')} className="w-full py-3 text-sm text-red-400 font-bold border-t border-neutral-100 mt-2 text-center">退出目前頻道</button>}
                    </div>
                  )}
                </div>
              </div>
            )}
            
            {msg && <div className="fixed top-24 left-1/2 -translate-x-1/2 bg-neutral-800/90 text-white px-6 py-2 rounded-full text-sm font-bold shadow-2xl z-[150] animate-bounce">{msg}</div>}
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
