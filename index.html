<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智能採買</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="智能採買">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&display=swap');
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .animate-slide-up { animation: slideUp 0.3s ease-out; }
    input:focus { font-size: 16px !important; }
    .font-serif-tc { font-family: 'Noto Serif TC', serif; }
    body { overflow-x: hidden; width: 100vw; background-color: #f5f5f5; }
    .no-select { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  </style>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</head>
<body class="bg-neutral-100 text-neutral-800 antialiased font-sans min-h-screen flex justify-center">
  <div id="root" class="w-full flex justify-center"></div>

  <script type="text/babel" data-type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, setDoc, query, orderBy, writeBatch, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    const { useState, useEffect, useRef } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyC36SqZOaZR3iYfMMDg5NQlADKdwEaZ5bk",
      authDomain: "smart-buy-dbaae.firebaseapp.com",
      projectId: "smart-buy-dbaae",
      storageBucket: "smart-buy-dbaae.firebasestorage.app",
      messagingSenderId: "176643347488",
      appId: "1:176643347488:web:182ef57838ae4358e4d845",
      measurementId: "G-7E04LF7E9P"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = "smart-buy-final";

    const Icons = {
      Cart: () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>,
      Plus: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
      Trash: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>,
      Check: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><polyline points="20 6 9 17 4 12"/></svg>,
      Clock: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
      Dollar: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>,
      Share: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8m-4-6-4-4-4 4m4-4v13"/></svg>,
      User: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
      Settings: ({size = 18}) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor">
          <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.21.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
        </svg>
      ),
      X: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
      ShoppingBag: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>,
      Refresh: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>,
      Download: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>,
      ChevronDown: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="m6 9 6 6 6-6"/></svg>,
      MapPin: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>,
      GripVertical: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="9" cy="12" r="1"></circle><circle cx="9" cy="5" r="1"></circle><circle cx="9" cy="19" r="1"></circle><circle cx="15" cy="12" r="1"></circle><circle cx="15" cy="5" r="1"></circle><circle cx="15" cy="19" r="1"></circle></svg>
    };

    const DEFAULT_TAGS = ['全聯'];
    const DEFAULT_QUICK = [{n:'雞蛋',t:'全聯'}];

    const App = () => {
      const [user, setUser] = useState(null);
      const [items, setItems] = useState([]);
      const [history, setHistory] = useState({});
      const [customTags, setCustomTags] = useState(DEFAULT_TAGS);
      const [quickItems, setQuickItems] = useState(DEFAULT_QUICK);
      const [inputValue, setInputValue] = useState('');
      const [qtyValue, setQtyValue] = useState('');
      const [activeTag, setActiveTag] = useState('');
      const [filterTag, setFilterTag] = useState('全部');
      const [isShoppingMode, setIsShoppingMode] = useState(false);
      const [roomCode, setRoomCode] = useState('');
      
      const [isRoomOpen, setIsRoomOpen] = useState(false);
      const [isTagAddOpen, setIsTagAddOpen] = useState(false);
      const [isTagManageOpen, setIsTagManageOpen] = useState(false);
      const [isQuickAddOpen, setIsQuickAddOpen] = useState(false);
      const [isQuickManageOpen, setIsQuickManageOpen] = useState(false);
      
      const [editingLocationItem, setEditingLocationItem] = useState(null);
      const [recordingPriceItem, setRecordingPriceItem] = useState(null);
      const [editingQtyItem, setEditingQtyItem] = useState(null);

      const [msg, setMsg] = useState('');
      const [confirmModal, setConfirmModal] = useState({ isOpen: false, title: '', message: '', onConfirm: null });
      const [deferredPrompt, setDeferredPrompt] = useState(null);

      // --- 主畫面：標籤拖曳 ---
      const dragDidHappenTag = useRef(false);
      const touchTimerTag = useRef(null);
      const [hDragTagIdx, setHDragTagIdx] = useState(null);
      const [hDragOverTagIdx, setHDragOverTagIdx] = useState(null);

      const dragDidHappenQuick = useRef(false);
      const touchTimerQuick = useRef(null);
      const [hDragQuickIdx, setHDragQuickIdx] = useState(null);
      const [hDragOverQuickIdx, setHDragOverQuickIdx] = useState(null);

      // --- 管理視窗：垂直拖曳狀態 ---
      const [vDraggedIdx, setVDraggedIdx] = useState(null);
      const [vDragOverIdx, setVDragOverIdx] = useState(null);

      const [savedRooms, setSavedRooms] = useState(() => {
        const saved = localStorage.getItem('smart_buy_saved_rooms');
        return saved ? JSON.parse(saved).map(r => typeof r === 'string' ? { code: r, note: '' } : r) : [];
      });

      const [allTimeRooms, setAllTimeRooms] = useState(() => {
        const history = localStorage.getItem('smart_buy_room_history');
        return history ? JSON.parse(history) : [];
      });

      const inputRef = useRef(null);

      useEffect(() => {
        const preventScroll = (e) => {
          if (hDragTagIdx !== null || hDragQuickIdx !== null || vDraggedIdx !== null) e.preventDefault();
        };
        document.addEventListener('touchmove', preventScroll, { passive: false });
        return () => document.removeEventListener('touchmove', preventScroll);
      }, [hDragTagIdx, hDragQuickIdx, vDraggedIdx]);

      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const urlRoom = params.get('room');
        const savedRoom = localStorage.getItem('smart_buy_room') || '';
        const finalRoom = urlRoom || savedRoom;
        if (finalRoom) {
          setRoomCode(finalRoom);
          localStorage.setItem('smart_buy_room', finalRoom);
          if (urlRoom) window.history.replaceState({}, document.title, window.location.pathname);
        }
        onAuthStateChanged(auth, u => { if (u) setUser(u); else signInAnonymously(auth).catch(console.error); });
        window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); setDeferredPrompt(e); });
      }, []);

      useEffect(() => {
        if (!user) return;
        const pathPrefix = roomCode ? `room_${roomCode}` : `user_${user.uid}`;
        const itemsCol = collection(db, 'artifacts', appId, 'public', 'data', `list_${pathPrefix}`);
        const histCol = collection(db, 'artifacts', appId, 'public', 'data', `hist_${pathPrefix}`);
        const configDoc = doc(db, 'artifacts', appId, 'public', 'data', `config_${pathPrefix}`, 'settings');

        const unsubItems = onSnapshot(query(itemsCol, orderBy('createdAt', 'desc')), snap => {
          setItems(snap.docs.map(d => ({ id: d.id, ...d.data() })));
        });
        const unsubHist = onSnapshot(histCol, snap => {
          const h = {}; snap.docs.forEach(d => h[d.data().name] = d.data()); setHistory(h);
        });
        const unsubConfig = onSnapshot(configDoc, (docSnap) => {
          if (docSnap.exists()) {
            const data = docSnap.data();
            if (data.tags) setCustomTags(data.tags);
            if (data.quick) setQuickItems(data.quick.filter(q => q && (q.n || q.name)));
          } else {
            setDoc(configDoc, { tags: DEFAULT_TAGS, quick: DEFAULT_QUICK });
          }
        });
        return () => { unsubItems(); unsubHist(); unsubConfig(); };
      }, [user, roomCode]);

      const getConfigRef = () => doc(db, 'artifacts', appId, 'public', 'data', `config_${roomCode ? `room_${roomCode}` : `user_${user.uid}`}`, 'settings');
      const getItemRef = (id) => doc(db, 'artifacts', appId, 'public', 'data', `list_${roomCode ? `room_${roomCode}` : `user_${user.uid}`}`, id);

      const handleAdd = async (e) => {
        if (e) e.preventDefault();
        if (!inputValue.trim() || !user) return;
        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', `list_${roomCode ? `room_${roomCode}` : `user_${user.uid}`}`), {
          name: inputValue.trim(), qty: qtyValue.trim(), tag: activeTag || '', completed: false, postponed: false, createdAt: Date.now()
        });
        setInputValue(''); setQtyValue('');
      };

      const handleQuickSelect = (qa) => {
        setInputValue(qa.n || qa.name);
        setActiveTag(qa.t || qa.tag || '');
        inputRef.current?.focus();
      };

      const handleComplete = async (item) => { await updateDoc(getItemRef(item.id), { completed: !item.completed, postponed: false }); };
      const handlePostpone = async (e, item) => { e.stopPropagation(); await updateDoc(getItemRef(item.id), { postponed: !item.postponed, completed: false }); };

      const savePrice = async (itemName, price, itemTag, itemId) => {
        if (!price) return;
        const pathPrefix = roomCode ? `room_${roomCode}` : `user_${user.uid}`;
        const histDoc = doc(db, 'artifacts', appId, 'public', 'data', `hist_${pathPrefix}`, itemName);
        await setDoc(histDoc, { name: itemName, price, tag: itemTag || '', updatedAt: Date.now() });
        if (itemId) await updateDoc(getItemRef(itemId), { currentPrice: price });
      };

      const clearCompleted = async () => {
        if (!user) return;
        for (const item of items.filter(i => i.completed)) await deleteDoc(getItemRef(item.id));
      };

      // --- 核心修復：新增功能銲接 ---
      const handleAddNewTag = async (tagName) => {
        if (!tagName.trim()) return;
        const newTags = [...customTags, tagName.trim()];
        await setDoc(getConfigRef(), { tags: newTags }, { merge: true });
        setMsg('地點新增成功'); setTimeout(() => setMsg(''), 1500);
      };

      const handleAddNewQuick = async (name, tag) => {
        if (!name.trim()) return;
        const newQ = [...quickItems.map(q => ({n: q.n || q.name, t: q.t || q.tag || ''})), { n: name.trim(), t: tag || '' }];
        await setDoc(getConfigRef(), { quick: newQ }, { merge: true });
        setMsg('品項新增成功'); setTimeout(() => setMsg(''), 1500);
      };

      const delTag = async (t) => {
        const newTags = customTags.filter(tag => tag !== t);
        await setDoc(getConfigRef(), { tags: newTags }, { merge: true });
      };

      const delQuick = async (idx) => {
        const newQ = quickItems.filter((_, i) => i !== idx).map(q => ({n: q.n || q.name, t: q.t || q.tag || ''}));
        await setDoc(getConfigRef(), { quick: newQ }, { merge: true });
      };

      // --- 拖曳排序通訊兵 ---
      const handleVDragStart = (idx) => {
        setVDraggedIdx(idx);
        if (navigator.vibrate) navigator.vibrate(30);
      };

      const handleVDragEnd = async (type) => {
        if (vDraggedIdx !== null && vDragOverIdx !== null && vDraggedIdx !== vDragOverIdx) {
          if (type === 'tag') {
            const newTags = [...customTags];
            const [moved] = newTags.splice(vDraggedIdx, 1);
            newTags.splice(vDragOverIdx, 0, moved);
            setCustomTags(newTags);
            await setDoc(getConfigRef(), { tags: newTags }, { merge: true });
          } else {
            const newQ = [...quickItems];
            const [moved] = newQ.splice(vDraggedIdx, 1);
            newQ.splice(vDragOverIdx, 0, moved);
            setQuickItems(newQ);
            const serialized = newQ.map(q => ({n: q.n || q.name, t: q.t || q.tag || ''}));
            await setDoc(getConfigRef(), { quick: serialized }, { merge: true });
          }
        }
        setVDraggedIdx(null); setVDragOverIdx(null);
      };

      const handleVTouchMove = (e, attr) => {
        if (vDraggedIdx === null) return;
        const touch = e.touches[0];
        const target = document.elementFromPoint(touch.clientX, touch.clientY);
        const dropElem = target?.closest(`[${attr}]`);
        if (dropElem) {
          const hoverIdx = parseInt(dropElem.getAttribute(attr), 10);
          if (hoverIdx !== vDragOverIdx) setVDragOverIdx(hoverIdx);
        }
      };

      const onTouchStartHTag = (idx) => {
        dragDidHappenTag.current = false;
        touchTimerTag.current = setTimeout(() => {
          setHDragTagIdx(idx);
          dragDidHappenTag.current = true;
          if (navigator.vibrate) navigator.vibrate(50);
        }, 400);
      };
      const onTouchMoveHTag = (e) => {
        if (hDragTagIdx === null) { clearTimeout(touchTimerTag.current); return; }
        e.preventDefault();
        const touch = e.touches[0];
        const target = document.elementFromPoint(touch.clientX, touch.clientY);
        const dropElem = target?.closest('[data-h-tag-index]');
        if (dropElem) {
          const overIdx = parseInt(dropElem.getAttribute('data-h-tag-index'), 10);
          if (overIdx !== hDragOverTagIdx && overIdx !== hDragTagIdx) setHDragOverTagIdx(overIdx);
        }
      };
      const onTouchEndHTag = async () => {
        clearTimeout(touchTimerTag.current);
        if (hDragTagIdx !== null) {
          if (hDragOverTagIdx !== null && hDragTagIdx !== hDragOverTagIdx) {
            const newTags = [...customTags];
            const [moved] = newTags.splice(hDragTagIdx, 1);
            newTags.splice(hDragOverTagIdx, 0, moved);
            setCustomTags(newTags);
            await setDoc(getConfigRef(), { tags: newTags }, { merge: true });
          }
          setHDragTagIdx(null); setHDragOverTagIdx(null);
        }
      };

      const onTouchStartHQuick = (idx) => {
        dragDidHappenQuick.current = false;
        touchTimerQuick.current = setTimeout(() => {
          setHDragQuickIdx(idx);
          dragDidHappenQuick.current = true;
          if (navigator.vibrate) navigator.vibrate(50);
        }, 400);
      };
      const onTouchMoveHQuick = (e) => {
        if (hDragQuickIdx === null) { clearTimeout(touchTimerQuick.current); return; }
        e.preventDefault();
        const touch = e.touches[0];
        const target = document.elementFromPoint(touch.clientX, touch.clientY);
        const dropElem = target?.closest('[data-h-quick-index]');
        if (dropElem) {
          const overIdx = parseInt(dropElem.getAttribute('data-h-quick-index'), 10);
          if (overIdx !== hDragOverQuickIdx && overIdx !== hDragQuickIdx) setHDragOverQuickIdx(overIdx);
        }
      };
      const onTouchEndHQuick = async () => {
        clearTimeout(touchTimerQuick.current);
        if (hDragQuickIdx !== null) {
          if (hDragOverQuickIdx !== null && hDragQuickIdx !== hDragOverQuickIdx) {
            const newQ = [...quickItems];
            const [moved] = newQ.splice(hDragQuickIdx, 1);
            newQ.splice(hDragOverQuickIdx, 0, moved);
            setQuickItems(newQ);
            const serialized = newQ.map(q => ({n: q.n || q.name, t: q.t || q.tag || ''}));
            await setDoc(getConfigRef(), { quick: serialized }, { merge: true });
          }
          setHDragQuickIdx(null); setHDragOverQuickIdx(null);
        }
      };

      const activeTagsInList = Array.from(new Set(items.map(item => item.tag))).filter(t => t);
      const displayFilterTags = ['全部', ...customTags.filter(tag => activeTagsInList.includes(tag))];
      const filteredItems = items.filter(item => filterTag === '全部' ? true : item.tag === filterTag);

      const handleTuneRoom = (v, note = '', force = false) => {
        const code = v.trim();
        if (!code) { setRoomCode(''); localStorage.setItem('smart_buy_room', ''); setIsRoomOpen(false); return; }
        const executeJoin = () => {
          setRoomCode(code); localStorage.setItem('smart_buy_room', code);
          const existingIdx = savedRooms.findIndex(r => r.code === code);
          let newSaved = existingIdx > -1 ? [...savedRooms] : [{ code, note }, ...savedRooms];
          if (existingIdx > -1 && note) newSaved[existingIdx].note = note;
          setSavedRooms(newSaved); localStorage.setItem('smart_buy_saved_rooms', JSON.stringify(newSaved));
          if (!allTimeRooms.includes(code)) { const h = [...allTimeRooms, code]; setAllTimeRooms(h); localStorage.setItem('smart_buy_room_history', JSON.stringify(h)); }
          setIsRoomOpen(false); setMsg(`頻道 ${code} 已連線`); setTimeout(() => setMsg(''), 1500); setConfirmModal({ isOpen: false });
        };
        if (!force && allTimeRooms.includes(code) && code !== roomCode) { setConfirmModal({ isOpen: true, title: '偵測到舊頻道', message: `代號 ${code} 之前已使用過，要切換並繼續連線嗎？`, onConfirm: executeJoin }); }
        else executeJoin();
      };

      const handleInstallApp = async () => { if (!deferredPrompt) return; deferredPrompt.prompt(); const { outcome } = await deferredPrompt.userChoice; if (outcome === 'accepted') setDeferredPrompt(null); };

      return (
        <div className="min-h-screen bg-neutral-100 flex justify-center items-start sm:pt-8 font-sans w-full">
          <div className="w-full max-w-md bg-white h-fit min-h-[100vh] sm:min-h-[500px] flex flex-col relative shadow-2xl overflow-hidden sm:rounded-3xl mb-8">
            
            <header className="bg-emerald-700 text-white px-3 py-4 flex justify-between items-center shrink-0 shadow-lg z-20">
              <div className="flex items-center gap-2 font-bold"><Icons.Cart /><h1 className="text-xl sm:text-2xl tracking-tight font-serif-tc">智能採買</h1></div>
              <div className="flex gap-2 shrink-0">
                {roomCode && <button onClick={copyLink} className="bg-white/20 p-2 rounded-lg active:scale-90 text-white"><Icons.Share /></button>}
                {deferredPrompt && <button onClick={handleInstallApp} className="p-2 bg-white/20 rounded-lg active:scale-90 text-white"><Icons.Download /></button>}
                <button onClick={() => setIsRoomOpen(true)} className={`px-2.5 py-1.5 rounded-lg text-xs sm:text-sm font-bold flex items-center gap-1 transition-all ${roomCode ? 'bg-amber-400 text-amber-900 shadow-inner' : 'bg-emerald-600 text-white border border-emerald-500'}`}>{roomCode ? `頻道 ${roomCode}` : <><Icons.User size={14}/> 進入頻道</>}</button>
              </div>
            </header>

            <div className={`transition-all duration-300 origin-top overflow-hidden bg-emerald-50 shrink-0 shadow-sm ${isShoppingMode ? 'max-h-0 opacity-0' : 'max-h-[450px] opacity-100 border-b border-emerald-100'}`}>
              <div className="p-3 space-y-3">
                <form onSubmit={handleAdd} className="flex gap-2 items-center">
                  <input ref={inputRef} type="text" value={inputValue} onChange={e => setInputValue(e.target.value)} placeholder="例如：雞蛋" className="flex-1 min-w-0 p-3 rounded-xl border-none shadow-inner focus:ring-2 focus:ring-emerald-600 outline-none text-lg bg-white" />
                  <input type="text" value={qtyValue} onChange={e => setQtyValue(e.target.value)} placeholder="數量" className="w-14 sm:w-16 p-3 rounded-xl border-none shadow-inner text-center outline-none text-base bg-white" />
                  <button type="submit" className="bg-emerald-700 text-white p-3 rounded-xl shadow-lg active:scale-95 shrink-0"><Icons.Plus /></button>
                </form>
                
                <div className={`flex items-center gap-2 pb-1 relative ${hDragQuickIdx !== null ? 'overflow-hidden' : 'overflow-x-auto scrollbar-hide'}`} style={{ touchAction: hDragQuickIdx !== null ? 'none' : 'pan-x pan-y' }}>
                  <button type="button" onClick={() => setIsQuickManageOpen(true)} className="shrink-0 text-emerald-600 flex items-center justify-center p-1.5 bg-emerald-100 rounded-full active:scale-95 shadow-sm"><Icons.Settings /></button>
                  {quickItems.map((qa, i) => (<button key={i} type="button" data-h-quick-index={i} onTouchStart={() => onTouchStartHQuick(i)} onTouchMove={onTouchMoveHQuick} onTouchEnd={onTouchEndHQuick} onClick={() => { if (!dragDidHappenQuick.current) handleQuickSelect(qa); }} className={`whitespace-nowrap px-3 py-1.5 rounded-full text-xs font-bold active:scale-90 transition-all no-select ${hDragQuickIdx === i ? 'scale-110 opacity-80 shadow-xl bg-amber-500 text-white z-50' : hDragOverQuickIdx === i && hDragQuickIdx !== i ? 'border-2 border-dashed border-amber-500' : 'bg-amber-50 border border-amber-200 text-amber-700'}`}>+ {qa.n || qa.name}</button>))}
                  <button type="button" onClick={() => setIsQuickAddOpen(true)} className="shrink-0 px-3 py-1.5 rounded-full text-xs font-bold text-amber-600 bg-amber-50 border border-amber-200 border-dashed flex items-center justify-center"><Icons.Plus size={14} /></button>
                </div>

                <div className={`flex items-center gap-2 pt-2 border-t border-emerald-100/50 mt-1 relative ${hDragTagIdx !== null ? 'overflow-hidden' : 'overflow-x-auto scrollbar-hide'}`} style={{ touchAction: hDragTagIdx !== null ? 'none' : 'pan-x pan-y' }}>
                  <button type="button" onClick={() => setIsTagManageOpen(true)} className="shrink-0 text-emerald-600 flex items-center justify-center p-1.5 bg-emerald-100 rounded-full active:scale-95 shadow-sm"><Icons.Settings /></button>
                  {customTags.map((t, idx) => (<button key={t} type="button" data-h-tag-index={idx} onTouchStart={() => onTouchStartHTag(idx)} onTouchMove={onTouchMoveHTag} onTouchEnd={onTouchEndHTag} onClick={() => { if (!dragDidHappenTag.current) setActiveTag(activeTag === t ? '' : t); }} className={`shrink-0 px-3 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-all no-select ${hDragTagIdx === idx ? 'scale-110 opacity-80 shadow-xl bg-emerald-500 text-white z-50' : hDragOverTagIdx === idx && hDragTagIdx !== idx ? 'border-2 border-dashed border-emerald-500' : activeTag === t ? 'bg-emerald-700 text-white shadow-md' : 'bg-white text-emerald-700 border border-emerald-200'}`}>{t}</button>))}
                  <button type="button" onClick={() => setIsTagAddOpen(true)} className="shrink-0 px-3 py-1.5 rounded-full text-xs font-bold text-emerald-600 bg-emerald-50 border border-emerald-200 border-dashed flex items-center justify-center"><Icons.Plus size={14} /></button>
                </div>
              </div>
            </div>

            <button onClick={() => setIsShoppingMode(!isShoppingMode)} className={`shrink-0 w-full py-3 flex items-center justify-center gap-2 text-sm font-bold border-b ${isShoppingMode ? 'bg-emerald-100 text-emerald-700' : 'bg-neutral-50 text-neutral-500'}`}>{isShoppingMode ? <><Icons.ChevronDown size={18} /> ➕ 展開備戰區</> : <><Icons.ShoppingBag size={18} /> 🛒 收起並開始採買</>}</button>

            <main className="p-3 space-y-3 bg-neutral-50/50 flex-1">
              {filteredItems.length === 0 ? (<div className="py-20 flex flex-col items-center justify-center opacity-20 grayscale"><Icons.Cart size={64} /><p className="mt-4 font-bold tracking-widest text-lg text-neutral-400 font-serif-tc">目前沒有採買任務</p></div>) : filteredItems.map(item => (
                <div key={item.id} className={`flex items-start gap-3 p-3 rounded-2xl border transition-all ${item.completed ? 'bg-neutral-100 border-neutral-200 opacity-60' : item.postponed ? 'bg-amber-50/50 border-amber-200 shadow-inner' : 'bg-white border-emerald-100 shadow-sm'}`}>
                  <div className="flex flex-col items-center gap-2 shrink-0 mt-0.5">
                    <div onClick={() => handleComplete(item)} className={`w-8 h-8 rounded-full border-2 flex items-center justify-center transition-colors cursor-pointer ${item.completed ? 'bg-emerald-600 border-emerald-600 text-white shadow-inner' : 'border-neutral-300 bg-white'}`}>{item.completed && <Icons.Check size={18} />}</div>
                    {!item.completed && <button onClick={(e) => handlePostpone(e, item)} className={`p-1.5 rounded-lg transition-colors active:scale-75 ${item.postponed ? 'text-amber-500 bg-amber-100' : 'text-neutral-400 bg-neutral-50'}`}><Icons.Clock size={18} /></button>}
                  </div>
                  <div className="flex flex-col min-w-0 flex-1 gap-2 w-full py-0.5">
                    <div className="flex items-center justify-between gap-2 w-full">
                      <div className="flex items-center gap-2 min-w-0 flex-1">
                        <span onClick={() => handleComplete(item)} className={`text-lg font-bold truncate cursor-pointer ${item.completed ? 'line-through text-neutral-400' : item.postponed ? 'text-amber-800' : 'text-neutral-800'}`}>{item.name}</span>
                        {item.qty ? <button onClick={(e) => { e.stopPropagation(); if(!item.completed) setEditingQtyItem(item); }} disabled={item.completed} className={`text-[10px] px-1.5 py-0.5 rounded font-bold whitespace-nowrap shrink-0 ${item.completed ? 'text-neutral-400' : 'bg-neutral-100 text-neutral-600 active:scale-90 shadow-sm'}`}>{item.qty}</button> : !item.completed && <button onClick={(e) => { e.stopPropagation(); setEditingQtyItem(item); }} className="text-[10px] px-1.5 py-0.5 rounded border border-dashed border-neutral-300 text-neutral-400 font-bold whitespace-nowrap active:scale-90">+數量</button>}
                      </div>
                      {!item.completed && <button onClick={(e) => { e.stopPropagation(); setRecordingPriceItem(item); }} className={`px-2.5 py-1 rounded-lg text-xs font-bold active:scale-90 shrink-0 whitespace-nowrap ${item.currentPrice ? 'bg-emerald-100 text-emerald-700 border border-emerald-200 shadow-sm' : 'bg-amber-100 text-amber-700 shadow-sm'}`}>{item.currentPrice ? `現價 $${item.currentPrice}` : '記 $'}</button>}
                    </div>
                    <div className="flex items-center justify-between gap-2 mt-1 w-full">
                      <div className="flex items-center gap-2 min-w-0 flex-1">
                        <button onClick={(e) => { e.stopPropagation(); setEditingLocationItem(item); }} className={`shrink-0 text-[10px] px-2 py-0.5 rounded font-bold active:scale-95 transition-transform ${item.completed ? 'bg-neutral-200 text-neutral-400' : item.tag && item.tag !== '無' ? 'bg-[#e6f4ea] text-[#1e8e3e] border border-emerald-100' : 'bg-neutral-100 text-neutral-400 border border-dashed border-neutral-300'}`}>{item.tag && item.tag !== '無' ? item.tag : '+地點'}</button>
                        {history[item.name] && !item.completed && <span className="text-[10px] text-amber-600 font-bold truncate text-right whitespace-nowrap">上次買：${history[item.name].price} ({history[item.name].tag})</span>}
                      </div>
                      <button onClick={() => deleteDoc(getItemRef(item.id))} className="p-1.5 text-neutral-300 hover:text-red-500 active:scale-75 shrink-0"><Icons.Trash size={18} /></button>
                    </div>
                  </div>
                </div>
              ))}
              <div className="pt-6 flex flex-col gap-4 items-center mb-10">
                {items.some(i => i.completed) && <button onClick={clearCompleted} className="flex items-center gap-1.5 px-6 py-3 text-red-500 bg-white border border-red-100 rounded-full font-bold active:scale-95 shadow-sm text-sm"><Icons.Trash size={18} /> 清除畫面中已買</button>}
                {items.length > 0 && <button onClick={resetAllItems} className="flex items-center gap-1.5 px-4 py-2 text-neutral-400 hover:text-red-400 rounded-full font-bold active:scale-95 text-xs opacity-60"><Icons.Refresh /> 重設清單 (全刪)</button>}
              </div>
            </main>

            {/* 統一彈窗邏輯：垂直佈局優化 */}
            {(editingLocationItem || editingQtyItem || recordingPriceItem || isTagAddOpen || isTagManageOpen || isQuickAddOpen || isQuickManageOpen) && (
              <div className="fixed inset-0 bg-black/60 z-[110] flex items-end sm:items-center justify-center p-4 backdrop-blur-sm" onClick={() => { setEditingLocationItem(null); setEditingQtyItem(null); setRecordingPriceItem(null); setIsTagAddOpen(false); setIsTagManageOpen(false); setIsQuickAddOpen(false); setIsQuickManageOpen(false); }}>
                <div className="bg-white w-full max-w-sm rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl animate-slide-up flex flex-col" onClick={e => e.stopPropagation()}>
                  <div className="flex justify-between items-center mb-4 border-b border-neutral-100 pb-2">
                    <h3 className="text-lg font-bold flex items-center gap-2 text-emerald-700 font-serif-tc">
                      {isTagAddOpen && <><Icons.Plus size={18}/>新增地點</>}
                      {isQuickAddOpen && <><Icons.Plus size={18}/>新增品項</>}
                      {editingLocationItem && <><Icons.MapPin size={18}/>更換採買地點</>}
                      {recordingPriceItem && <><Icons.Dollar size={18}/>紀錄現場價錢</>}
                      {(isTagManageOpen || isQuickManageOpen) && <><Icons.Settings size={18}/>管理中心</>}
                    </h3>
                    <button onClick={() => { setEditingLocationItem(null); setEditingQtyItem(null); setRecordingPriceItem(null); setIsTagAddOpen(false); setIsTagManageOpen(false); setIsQuickAddOpen(false); setIsQuickManageOpen(false); }} className="text-neutral-300"><Icons.X /></button>
                  </div>

                  {isTagAddOpen && <div className="space-y-4"><input type="text" id="nTagIn" placeholder="輸入新地點..." className="w-full p-4 rounded-xl border-2 border-emerald-100 outline-none text-xl font-bold text-center" autoFocus /><button onClick={() => { const v = document.getElementById('nTagIn').value; if(v){ handleAddNewTag(v); setIsTagAddOpen(false); } }} className="w-full bg-emerald-700 text-white py-4 rounded-xl font-bold text-lg shadow-lg">新增地點</button></div>}
                  {isQuickAddOpen && <div className="space-y-4"><input type="text" id="nQuickIn" placeholder="品項名稱..." className="w-full p-4 rounded-xl border-2 border-amber-100 outline-none text-xl font-bold text-center" autoFocus /><select id="nQuickTag" className="w-full p-3 bg-neutral-50 rounded-xl border border-neutral-200 font-bold"><option value="">無地點</option>{customTags.map(t => <option key={t} value={t}>{t}</option>)}</select><button onClick={() => { const n = document.getElementById('nQuickIn').value; const t = document.getElementById('nQuickTag').value; if(n){ handleAddNewQuick(n, t); setIsQuickAddOpen(false); } }} className="w-full bg-amber-600 text-white py-4 rounded-xl font-bold text-lg shadow-lg">新增品項</button></div>}
                  {editingLocationItem && <div className="grid grid-cols-2 gap-2 overflow-y-auto max-h-[50vh]">{Array.from(new Set(customTags)).map(t => <button key={t} onClick={async () => { await updateDoc(getItemRef(editingLocationItem.id), { tag: t }); setEditingLocationItem(null); }} className={`py-3 rounded-xl font-bold text-sm border ${editingLocationItem.tag === t ? 'bg-emerald-600 text-white' : 'bg-neutral-50 text-neutral-600'}`}>{t}</button>)}<button onClick={async () => { await updateDoc(getItemRef(editingLocationItem.id), { tag: '' }); setEditingLocationItem(null); }} className="col-span-2 py-3 bg-neutral-100 text-neutral-400 font-bold rounded-xl border-dashed border-2">清除地點</button></div>}
                  {editingQtyItem && <div className="space-y-4"><input type="text" id="editQtyIn" defaultValue={editingQtyItem.qty} autoFocus className="w-full p-4 rounded-xl border-2 border-emerald-100 outline-none text-xl font-bold text-center" /><div className="flex gap-2"><button onClick={() => { updateDoc(getItemRef(editingQtyItem.id), { qty: '' }); setEditingQtyItem(null); }} className="flex-1 bg-neutral-100 text-neutral-500 py-3 rounded-xl font-bold text-center">清除</button><button onClick={() => { const v = document.getElementById('editQtyIn').value; updateDoc(getItemRef(editingQtyItem.id), { qty: v }); setEditingQtyItem(null); }} className="flex-[2] bg-emerald-600 text-white py-3 rounded-xl font-bold">更新</button></div></div>}
                  {recordingPriceItem && <div className="space-y-4"><div className="text-xs text-amber-600 font-bold bg-amber-50 p-2 rounded-lg italic">{history[recordingPriceItem.name] ? `上次買：$${history[recordingPriceItem.name].price} (${history[recordingPriceItem.name].tag})` : '目前無紀錄'}</div><input type="number" id="quickP" autoFocus placeholder="金額..." className="w-full p-4 rounded-xl border-2 border-emerald-100 outline-none text-xl font-bold text-center" /><button onClick={() => { const v = document.getElementById('quickP').value; savePrice(recordingPriceItem.name, v, recordingPriceItem.tag, recordingPriceItem.id); setRecordingPriceItem(null); }} className="w-full bg-emerald-600 text-white py-4 rounded-xl font-bold shadow-lg">確定紀錄</button></div>}
                  
                  {/* 管理視窗：垂直拖曳銲接完畢 */}
                  {(isTagManageOpen || isQuickManageOpen) && (
                    <div className="overflow-y-auto max-h-[60vh] space-y-2 no-select" onTouchMove={(e) => handleVTouchMove(e, isTagManageOpen ? 'data-v-tag-index' : 'data-v-quick-index')}>
                      <p className="text-xs text-neutral-400 mb-2 font-bold flex justify-center items-center gap-1"><Icons.GripVertical size={12}/> 拖曳手把可自由排序</p>
                      {(isTagManageOpen ? customTags : quickItems).map((item, idx) => (
                        <div key={idx} 
                          data-v-tag-index={isTagManageOpen ? idx : undefined} 
                          data-v-quick-index={!isTagManageOpen ? idx : undefined}
                          className={`flex justify-between items-center bg-neutral-50 p-2 rounded-xl border transition-all ${vDraggedIdx === idx ? 'opacity-40 scale-95 border-emerald-500' : vDragOverIdx === idx ? 'border-emerald-400 bg-emerald-50' : 'border-neutral-100'}`}
                        >
                          <div className="flex items-center gap-2 flex-1">
                            <div className="p-2 text-neutral-300 cursor-move touch-none" onTouchStart={() => handleVDragStart(idx)} onTouchEnd={() => handleVDragEnd(isTagManageOpen ? 'tag' : 'quick')}>
                              <Icons.GripVertical />
                            </div>
                            <span className="font-bold text-neutral-700">{isTagManageOpen ? item : item.n}</span>
                          </div>
                          <button onClick={() => isTagManageOpen ? delTag(item) : delQuick(idx)} className="text-red-400 p-2 active:scale-75"><Icons.Trash size={18}/></button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}

            {isRoomOpen && (
              <div className="fixed inset-0 bg-black/60 z-[150] flex items-center justify-center p-4 backdrop-blur-sm">
                <div className="bg-white w-full max-w-sm rounded-3xl p-5 shadow-2xl animate-slide-up flex flex-col max-h-[85vh]">
                  <div className="flex justify-between items-center mb-4 shrink-0 font-bold text-emerald-800 font-serif-tc"><h2 className="text-lg flex items-center gap-2"><Icons.User size={20}/>共享頻道管理</h2><button onClick={() => setIsRoomOpen(false)} className="text-neutral-300"><Icons.X /></button></div>
                  <div className="overflow-y-auto space-y-6 pr-1 scrollbar-hide font-bold">
                    {savedRooms.length > 0 && <div><h3 className="text-xs font-bold text-neutral-500 mb-3 flex items-center gap-1.5"><Icons.History size={14}/> 快速調頻 (記憶清單)</h3><div className="space-y-2">{savedRooms.map(room => (<div key={room.code} onClick={() => handleTuneRoom(room.code, room.note, true)} className={`flex justify-between items-center p-3 rounded-2xl border transition-all cursor-pointer ${roomCode === room.code ? 'bg-amber-50 border-amber-300 shadow-sm scale-[1.02]' : 'bg-white border-neutral-200'}`}><div className="flex flex-col"><span className={`font-bold ${roomCode === room.code ? 'text-amber-700' : 'text-neutral-700'}`}>{room.code}</span>{room.note && <span className="text-[10px] text-neutral-400 font-bold italic">{room.note}</span>}</div><button onClick={(e) => handleForgetRoom(e, room.code)} className="p-1 text-neutral-300 hover:text-red-500 active:scale-75 transition-all"><Icons.X /></button></div>))}</div></div>}
                    <div className={savedRooms.length > 0 ? "pt-4 border-t border-dashed border-neutral-200" : ""}><h3 className="text-xs font-bold text-neutral-500 mb-3 flex items-center gap-1.5"><Icons.Plus size={14}/> 輸入新頻道代號與備註</h3><div className="space-y-3 mb-4"><input type="text" id="rIn" placeholder="代號 (如 888)..." className="w-full p-3 bg-neutral-100 rounded-xl outline-none border-2 border-emerald-100 focus:border-emerald-600 font-bold text-xl text-center tracking-widest text-emerald-800" /><div className="flex gap-2"><input type="text" id="rNote" placeholder="加個備註 (如：家裡用)" className="flex-1 min-w-0 p-3 bg-neutral-100 rounded-xl outline-none border-2 border-neutral-100 focus:border-emerald-500 font-bold text-sm" /><button onClick={() => handleTuneRoom(document.getElementById('rIn').value, document.getElementById('rNote').value)} className="bg-emerald-700 text-white px-5 rounded-xl font-bold shadow-lg active:scale-95 transition-all text-white shrink-0">對頻</button></div></div></div>
                    {roomCode && <button onClick={() => handleTuneRoom('')} className="w-full py-3 text-sm text-red-400 font-bold border-t border-neutral-100 mt-2 text-center">退出目前的共享頻道</button>}
                  </div>
                </div>
              </div>
            )}
            
            {msg && <div className="absolute top-24 left-1/2 -translate-x-1/2 bg-neutral-800/90 text-white px-6 py-2 rounded-full text-sm font-bold shadow-2xl z-50 animate-bounce">{msg}</div>}
            
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
