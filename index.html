    .drag-handle{cursor:move;touch-action:none;}
    
    /* 配色導航系統 */
    .tag-emerald { background-color: #ecfdf5; color: #065f46; border-color: #10b981; }

    };

    const DEFAULT_TAGS = ['全聯', '郵局', '菜市場', '其它'];
    const DEFAULT_QUICK = [{ n: '雞蛋', t: '全聯' }];

    const getTagStyles = (tagName) => {
      if (!tagName || tagName === '無' || tagName === '') return 'tag-neutral';
      const colors = ['tag-emerald', 'tag-blue', 'tag-purple', 'tag-amber', 'tag-rose', 'tag-cyan'];
      const name = tagName.trim();
      if (name.includes('全聯')) return 'tag-blue';
      if (name.includes('郵局') || name.includes('郵政')) return 'tag-emerald';
      if (name.includes('市場')) return 'tag-purple';
      if (name.includes('藥') || name.includes('所') || name.includes('醫院')) return 'tag-rose';
      if (name.includes('好市多')) return 'tag-rose';
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
      return colors[Math.abs(hash) % colors.length];
    };

    const getTagBorderColor = (tagName) => {
      if (!tagName || tagName === '無' || tagName === '') return '#d1d5db';
      const name = tagName.trim();
      if (name.includes('全聯')) return '#3b82f6';
      if (name.includes('郵局') || name.includes('郵政')) return '#10b981';
      if (name.includes('市場')) return '#8b5cf6';
      if (name.includes('藥') || name.includes('所') || name.includes('醫院')) return '#f43f5e';
      if (name.includes('好市多')) return '#f43f5e';
      const colorMap = ['#10b981','#3b82f6','#8b5cf6','#f59e0b','#f43f5e','#06b6d4'];
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
      return colorMap[Math.abs(hash) % colorMap.length];
    };
      const [user, setUser] = useState(null);
      const [items, setItems] = useState([]);
      const [history, setHistory] = useState({});
      const [customTags, setCustomTags] = useState(DEFAULT_TAGS);
      const [quickItems, setQuickItems] = useState(DEFAULT_QUICK);
      const [personalBaseId, setPersonalBaseId] = useState(() => localStorage.getItem('smart_buy_base_id') || generateId());
      const [inputValue, setInputValue] = useState('');
      const [qtyValue, setQtyValue] = useState('');
      const [activeTag, setActiveTag] = useState('');
      const [filterTag, setFilterTag] = useState('全部');
      const [isShoppingMode, setIsShoppingMode] = useState(false);
      const [roomPath, setRoomPath] = useState(() => localStorage.getItem('smart_buy_room') || '');
      const [modalState, setModalState] = useState({ type: null, data: null });
      const [msg, setMsg] = useState('');
      const [isLoading, setIsLoading] = useState(true);
      const [expandedSection, setExpandedSection] = useState('');
      const [modalInput, setModalInput] = useState('');
      const [modalSelect, setModalSelect] = useState('');
      const [baseIdEditValue, setBaseIdEditValue] = useState(personalBaseId);
      const [isEditingBaseId, setIsEditingBaseId] = useState(false);
      const [vDragIdx, setVDragIdx] = useState(null);
      const [vDragOverIdx, setVDragOverIdx] = useState(null);
      const [hDragType, setHDragType] = useState(null);
      const [hDragIdx, setHDragIdx] = useState(null);
      const [hDragOverIdx, setHDragOverIdx] = useState(null);
      
      const dragDidHappenTag = useRef(false);
      const touchTimerTag = useRef(null);
      const touchStartTag = useRef({ x: 0, y: 0 });
      const isScrollingTag = useRef(false);
      
      const dragDidHappenQuick = useRef(false);
      const touchTimerQuick = useRef(null);
      const touchStartQuick = useRef({ x: 0, y: 0 });
      const isScrollingQuick = useRef(false);
      
      const [savedRooms, setSavedRooms] = useState(() => {
        const raw = localStorage.getItem('smart_buy_saved_rooms');
        if (!raw) return [];
        try {
          const parsed = JSON.parse(raw);
          return parsed.map(r => (typeof r === 'string' ? { code: r, note: '' } : r)).filter(r => r && r.code);
        } catch (e) { return []; }
      });
      
      const getFriendlyName = (path) => {
        if (!path) return '';
        const saved = savedRooms.find(r => r.code === path);
        if (saved && saved.note) return saved.note;
        const parts = path.split('-');
        return parts.length > 1 ? parts[1] : path;
      };
      
      const headerRoomTitle = useMemo(() => {
        if (!roomPath) return '進入頻道';
        return getFriendlyName(roomPath);
      }, [roomPath, savedRooms]);
      
      const dynamicFilterTags = useMemo(() => {
        const tagsInUse = Array.from(new Set(items.map(item => item.tag))).filter(t => t && t !== '');
        return ['全部', ...customTags.filter(tag => tagsInUse.includes(tag))];
      }, [items, customTags]);
      
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const urlRoom = params.get('room');
        const syncDataRaw = params.get('sync');
        if (syncDataRaw) {
          try {
            const decoded = JSON.parse(decodeURIComponent(atob(syncDataRaw)));
            setModalState({ type: 'syncDevice', data: decoded });
          } catch (e) {}
          window.history.replaceState({}, document.title, window.location.pathname);
        } else if (urlRoom) {
          setRoomPath(urlRoom);
          localStorage.setItem('smart_buy_room', urlRoom);
          setSavedRooms(prev => {
            if (prev.find(r => r && r.code === urlRoom)) return prev;
            const next = [{ code: urlRoom, note: '分享進入' }, ...prev];
            localStorage.setItem('smart_buy_saved_rooms', JSON.stringify(next));
            return next;
          });
          window.history.replaceState({}, document.title, window.location.pathname);
        }
        onAuthStateChanged(auth, u => {
          if (u) {
            setUser(u);
            const loader = document.getElementById('app-loader');
            if (loader) { loader.classList.add('animate-fade-out'); setTimeout(() => loader.remove(), 500); }
          }
          else signInAnonymously(auth).catch(console.error);
        });
        localStorage.setItem('smart_buy_base_id', personalBaseId);
      }, [personalBaseId]);
      
      useEffect(() => {
        const url = new URL(window.location);
        if (roomPath) url.searchParams.set('room', roomPath);
        else url.searchParams.delete('room');
        window.history.replaceState({}, '', url);
      }, [roomPath]);

      useEffect(() => {
        if (!user) return;
        setIsLoading(true);
        const prefix = roomPath ? `room_${roomPath}` : `user_${user.uid}`;
        const unsubItems = onSnapshot(query(collection(db, 'artifacts', APP_ID_PATH, 'public', 'data', `list_${prefix}`), orderBy('createdAt', 'desc')), snap => {
          setItems(snap.docs.map(d => ({ id: d.id, ...d.data() })));
          setIsLoading(false);
        }, (err) => setIsLoading(false));
        const unsubHist = onSnapshot(collection(db, 'artifacts', APP_ID_PATH, 'public', 'data', `hist_${prefix}`), snap => {
          const h = {};
          snap.docs.forEach(d => { const data = d.data(); h[data.name] = data; });
          setHistory(h);
        });
        const unsubConfig = onSnapshot(doc(db, 'artifacts', APP_ID_PATH, 'public', 'data', `config_${prefix}`, 'settings'), snap => {
          if (snap.exists()) {
            const data = snap.data();
            if (data.tags) setCustomTags(data.tags);
            if (data.quick) setQuickItems(data.quick.filter(q => q && (q.n || q.name)));
          } else {
            setDoc(snap.ref, { tags: DEFAULT_TAGS, quick: DEFAULT_QUICK });
          }
        });
        return () => { unsubItems(); unsubHist(); unsubConfig(); };
      }, [user, roomPath]);
      
      const getConfigRef = () => doc(db, 'artifacts', APP_ID_PATH, 'public', 'data', `config_${roomPath ? `room_${roomPath}` : `user_${user.uid}`}`, 'settings');
      const getItemRef = (id) => doc(db, 'artifacts', APP_ID_PATH, 'public', 'data', `list_${roomPath ? `room_${roomPath}` : `user_${user.uid}`}`, id);
      const handleAdd = async (e) => {
        if (e) e.preventDefault();
        if (!inputValue.trim() || !user) return;
        await addDoc(collection(db, 'artifacts', APP_ID_PATH, 'public', 'data', `list_${roomPath ? `room_${roomPath}` : `user_${user.uid}`}`), { name: inputValue.trim(), qty: qtyValue.trim(), tag: activeTag || '', completed: false, postponed: false, createdAt: Date.now() });
        setInputValue(''); setQtyValue('');
      };
      const handleQuickSelect = (qa) => { setInputValue(qa.n || qa.name || ''); setActiveTag(qa.t || qa.tag || ''); };
      const handleComplete = async (item) => { await updateDoc(getItemRef(item.id), { completed: !item.completed, postponed: false }); };
      const handlePostpone = async (e, item) => { e.stopPropagation(); await updateDoc(getItemRef(item.id), { postponed: !item.postponed, completed: false }); };
      const savePrice = async (itemName, price, itemTag, itemId) => {
        const prefix = roomPath ? `room_${roomPath}` : `user_${user.uid}`;
        await setDoc(doc(db, 'artifacts', APP_ID_PATH, 'public', 'data', `hist_${prefix}`, itemName), { name: itemName, price: price || '', tag: itemTag || '', updatedAt: Date.now() });
        if (itemId) await updateDoc(getItemRef(itemId), { currentPrice: price || '' });
      };
      const handleAddNewTag = async (tagName, shouldClose = false) => {
        const name = tagName.trim(); if (!name) return;
        if (customTags.includes(name)) { setMsg('地點已存在！'); setTimeout(() => setMsg(''), 1000); return; }
        const next = [...customTags, name]; await setDoc(getConfigRef(), { tags: next }, { merge: true });
        if (shouldClose) setModalState({ type: null });
        setMsg('新增成功'); setTimeout(() => setMsg(''), 1000);
      };
      const handleAddNewQuick = async (name, tag, shouldClose = false) => {
        const qName = name.trim(); if (!qName) return;
        const next = [...quickItems.map(q => ({ n: q.n || q.name, t: q.t || q.tag || '' })), { n: qName, t: tag || '' }];
        await setDoc(getConfigRef(), { quick: next }, { merge: true });
        if (shouldClose) setModalState({ type: null });
        setMsg('新增成功'); setTimeout(() => setMsg(''), 1000);
      };
      const delTag = async (t) => { const next = customTags.filter(tag => tag !== t); await setDoc(getConfigRef(), { tags: next }, { merge: true }); };
      const delQuick = async (idx) => { const next = quickItems.filter((_, i) => i !== idx).map(q => ({ n: q.n || q.name, t: q.t || q.tag || '' })); await setDoc(getConfigRef(), { quick: next }, { merge: true }); };
      const handleTuneRoom = (friendlyInput, note = '') => {
        const code = friendlyInput.trim(); if (!code) { setRoomPath(''); localStorage.removeItem('smart_buy_room'); setModalState({ type: null }); return; }
        const finalPath = code.includes('-') ? code : `${personalBaseId}-${code}`;
        setRoomPath(finalPath); localStorage.setItem('smart_buy_room', finalPath);
        const nextSaved = savedRooms.filter(r => r && r.code !== finalPath);
        const finalSaved = [{ code: finalPath, note: note || '' }, ...nextSaved];
        setSavedRooms(finalSaved); localStorage.setItem('smart_buy_saved_rooms', JSON.stringify(finalSaved));
        setModalState({ type: null }); setMsg(`連線成功`); setTimeout(() => setMsg(''), 1000);
      };
      const handleUpdateBaseId = (newVal) => {
        const val = newVal.trim(); if (!val) return;
        setPersonalBaseId(val); setBaseIdEditValue(val); localStorage.setItem('smart_buy_base_id', val);
        setMsg('ID 已固定'); setTimeout(() => setMsg(''), 1000);
      };

                    {modalState.type === 'addQuick' && (
                      <div className="space-y-4 py-2">
                        <input type="text" value={modalInput} onChange={e => setModalInput(e.target.value)} placeholder="輸入品項名稱 (如: 衛生紙)..." className="w-full p-4 rounded-xl border-2 border-amber-100 outline-none text-xl font-bold text-center" />
                        <select value={modalSelect} onChange={e => setModalSelect(e.target.value)} className="w-full p-3 bg-neutral-50 rounded-xl border border-neutral-200 font-bold text-neutral-700 outline-none">
                          <option value="">無預設地點</option>
                          {customTags.map(t => <option key={t} value={t}>{t}</option>)}
                        </select>
                        <button onClick={() => handleAddNewQuick(modalInput, modalSelect, true)} className="w-full bg-amber-600 text-white py-4 rounded-xl font-bold text-lg shadow-lg active:scale-95 transition-transform">確認新增</button>
                      </div>
                    )}
                    {modalState.type === 'editQty' && modalState.data && (
                      <div className="space-y-4 py-2">
                        <div className="text-center mb-1"><span className="text-base font-bold text-emerald-800 bg-emerald-100 px-4 py-1.5 rounded-full tracking-wide shadow-sm">📝 {modalState.data.name}</span></div>
                        <input type="text" value={modalInput} onChange={e => setModalInput(e.target.value)} placeholder="輸入數量與單位..." className="w-full p-4 rounded-xl border-2 border-emerald-100 outline-none text-xl font-bold text-center" />
                        <div className="flex gap-2">
                          <button onClick={async () => { await updateDoc(getItemRef(modalState.data.id), { qty: '' }); setModalState({ type: null }); }} className="flex-1 bg-neutral-100 text-neutral-500 py-3 rounded-xl font-bold active:scale-95 transition-transform">清除</button>
                          <button onClick={async () => { await updateDoc(getItemRef(modalState.data.id), { qty: modalInput }); setModalState({ type: null }); }} className="flex-[2] bg-emerald-600 text-white py-3 rounded-xl font-bold text-lg shadow-lg active:scale-95 transition-transform">確定更新</button>
                        </div>
                      </div>
                    )}
                    {modalState.type === 'recordingPrice' && modalState.data && (
                      <div className="space-y-4 py-2">
                        <div className="text-center mb-1"><span className="text-base font-bold text-amber-900 bg-[#FFDD00] px-4 py-1.5 rounded-full tracking-wide shadow-sm">💰 {modalState.data.name}</span></div>
                        <div className="text-xs text-amber-600 font-bold bg-amber-50 p-2 rounded-lg italic text-center">{history[modalState.data.name] ? `上次買：$${history[modalState.data.name].price}` : '目前尚無紀錄'}</div>
                        <input type="number" value={modalInput} onChange={e => setModalInput(e.target.value)} placeholder="輸入購買金額..." className="w-full p-4 rounded-xl border-2 border-emerald-100 outline-none text-xl font-bold text-center" />
                        <button onClick={async () => { await savePrice(modalState.data.name, modalInput, modalState.data.tag, modalState.data.id); setModalState({ type: null }); }} className="w-full bg-emerald-700 text-white py-4 rounded-xl font-bold shadow-lg active:scale-95 transition-transform">確定紀錄</button>
                      </div>
                    )}
                    {modalState.type === 'about' && (
                      <div className="space-y-4 py-2">
                        <div className="bg-emerald-50 p-4 rounded-2xl border border-emerald-100 text-center relative">
                          <h4 className="font-bold text-emerald-800 text-lg tracking-widest font-serif-tc">智能採買</h4>
                          <p className="text-xs text-emerald-600 mt-1 font-bold">版本 v1.0.9 (佩蓉溫馨版)</p>
                          <p className="text-[10px] text-emerald-500/70 mt-2 font-bold">Developed with ❤️ by 朵朵</p>
                          <button onClick={handleForceUpdate} className="mt-4 bg-emerald-200/50 hover:bg-emerald-200 text-emerald-700 text-[10px] px-3 py-1.5 rounded-full font-bold flex items-center justify-center gap-1 mx-auto active:scale-95 transition-all border border-emerald-300/50"><Icons.Refresh size={12} /> 檢查並載入新版本</button>
                        </div>
                        <button onClick={copyAppUrl} className="w-full bg-white border-2 border-emerald-500 text-emerald-700 py-3 rounded-xl font-bold active:scale-95 transition-all flex items-center justify-center gap-2 shadow-sm">分享此 APP</button>
                        <div className="bg-white border-2 border-neutral-100 rounded-xl overflow-hidden">
                          <button onClick={() => setExpandedSection(expandedSection === 'install' ? '' : 'install')} className="w-full px-4 py-3 flex justify-between items-center font-bold text-neutral-700 active:bg-neutral-50"><span className="flex items-center gap-2"><Icons.Smartphone size={18} className="text-blue-500" /> 加入手機主畫面</span><Icons.ChevronDown size={16} className={`transition-transform ${expandedSection === 'install' ? 'rotate-180' : ''}`} /></button>
                          {expandedSection === 'install' && ( <div className="px-4 pb-4 pt-2 text-sm text-neutral-600 space-y-3 border-t border-neutral-50 bg-neutral-50/30"><p className="leading-relaxed"><strong>🍎 Apple (iOS)：</strong><br />1. 用 Safari 瀏覽器打開本網頁。<br />2. 點擊下方工具列的「分享 📤」按鈕。<br />3. 選擇「加入主畫面 ➕」。</p><div className="w-full h-px bg-neutral-200"></div><p className="leading-relaxed"><strong>🤖 Android (安卓)：</strong><br />1. 用 Chrome 瀏覽器打開本網頁。<br />2. 點擊右上角的「選單 ⋮」。<br />3. 選擇「加到主畫面」或「安裝應用程式」。</p></div> )}
                        </div>
                        <div className="bg-white border-2 border-neutral-100 rounded-xl overflow-hidden">
                          <button onClick={() => setExpandedSection(expandedSection === 'manual' ? '' : 'manual')} className="w-full px-4 py-3 flex justify-between items-center font-bold text-neutral-700 active:bg-neutral-50"><span className="flex items-center gap-2"><Icons.BookOpen size={18} className="text-amber-500" /> 使用說明書</span><Icons.ChevronDown size={16} className={`transition-transform ${expandedSection === 'manual' ? 'rotate-180' : ''}`} /></button>
                          {expandedSection === 'manual' && ( <div className="px-4 pb-4 pt-2 text-sm text-neutral-600 space-y-4 border-t border-neutral-50 bg-neutral-50/30 leading-relaxed"><div><p className="font-bold text-emerald-700 mb-1">🛒 基礎操作</p><p>上方輸入框打字，按「+」或鍵盤的 Enter 即可新增。點擊清單項目可打勾完成；點擊「時鐘」可延後下次再買。</p></div><div className="w-full h-px bg-neutral-200/60"></div><div><p className="font-bold text-emerald-700 mb-1">🪪 個人專屬 ID</p><p>進入「頻道設定」，會看到一組英文亂碼，這是您的專屬身分。<strong>建議點擊修改，改成妳好記的代碼(如 family 01)！</strong></p><p className="text-xs text-neutral-500 mt-1.5 bg-neutral-100 p-2 rounded-lg">💡 未來換手機時，只要把 ID 改回同一個，資料就會自動連線回來喔！</p></div></div> )}
                        </div>
                        <button onClick={() => window.open('https://forms.gle/UVFSXsidHYMMtZwR9', '_blank')} className="w-full bg-white border-2 border-blue-200 text-blue-700 py-3 rounded-xl font-bold active:scale-95 transition-all flex items-center justify-center gap-2 shadow-sm mt-4">💬 想跟朵朵說些什麼？</button>
                        <button onClick={() => { setModalState({ type: 'donate' }); }} className="w-full bg-[#FFDD00] text-amber-900 py-2.5 px-4 rounded-xl active:scale-95 transition-all flex flex-col items-center justify-center gap-0.5 shadow-sm mt-4 mb-2"><div className="flex items-center gap-2 font-bold text-base"><Icons.Coffee size={18} /><span>喜歡這 APP 嗎？</span></div><span className="text-sm font-bold opacity-80">歡迎請我喝杯咖啡</span></button>
                      </div>
                    )}
                    {modalState.type === 'donate' && (
                      <div className="space-y-4 py-2 text-center">
                        <div className="bg-amber-50 p-4 rounded-2xl border border-amber-100">
                          <p className="text-sm text-amber-800 font-bold mb-2 leading-relaxed">謝謝妳的心意！ 🥰<br /></p>
                          <div className="inline-block bg-amber-500 text-white text-xs px-3 py-1 rounded-full font-bold mb-2 shadow-sm">☕ 一杯咖啡 $50(杯數隨喜)</div>
                        </div>
                        <div className="bg-neutral-50 p-3 rounded-xl border border-neutral-100 space-y-2">
                          <p className="text-xs font-bold text-neutral-500">也可複製帳號轉帳</p>
                          <p className="text-sm font-bold text-neutral-700 tracking-wider">永豐銀行 (807)<br />204-018-0025253-1</p>
                          <button onClick={() => { const temp = document.createElement('input'); temp.value = '20401800252531'; document.body.appendChild(temp); temp.select(); document.execCommand('copy'); document.body.removeChild(temp); setMsg('帳號已複製！'); setTimeout(() => setMsg(''), 2000); }} className="w-full mt-3 bg-amber-500 text-white py-4 rounded-xl text-base font-bold active:scale-95 transition-all shadow-lg flex justify-center items-center gap-2 mb-2">📋 一鍵複製帳號</button>
                        </div>
                      </div>
                    )}
                    {modalState.type === 'room' && (
                      <div className="space-y-6 py-2">
                        {/* iOS 同步教學 */}
                        <div className="bg-blue-50 p-4 rounded-2xl border border-blue-200">
                          <p className="text-sm font-bold text-blue-800 mb-2 flex items-center gap-1.5">📱 iPhone 同步清單 — 1-2-3-4 步驟</p>
                          <ol className="text-sm text-blue-700 font-bold space-y-1 list-decimal list-inside leading-relaxed">
                            <li>在此頁面複製「頻道代號」(見下方黃色區塊)</li>
                            <li>回到 iPhone 主畫面，開啟桌面上的「智能採買」APP</li>
                            <li>點「頻道設定」→ 按「📋 貼上」按鈕</li>
                            <li>按「連線」，完成！全家清單瞬間同步 ✅</li>
                          </ol>
                        </div>
                        {roomPath && (
                          <div className="bg-amber-50 p-4 rounded-2xl border border-amber-200">
                            <p className="text-xs text-amber-700 font-bold mb-2">📍 目前所在頻道 (複製代號專用)</p>
                            <div className="flex items-center justify-between bg-yellow-100 p-3 rounded-xl border-2 border-yellow-400 shadow-sm">
                              <span className="font-mono font-bold text-amber-900 break-all text-base pl-1">{roomPath}</span>
                              <button onClick={() => { const temp = document.createElement('input'); temp.value = roomPath; document.body.appendChild(temp); temp.select(); document.execCommand('copy'); document.body.removeChild(temp); setMsg('代號已複製！'); setTimeout(() => setMsg(''), 2000); }} className="ml-2 shrink-0 bg-amber-500 text-white px-4 py-2 rounded-lg text-sm font-bold active:scale-95 transition-transform shadow-md">📋 複製</button>
                            </div>
                            <p className="text-[11px] text-amber-600 mt-2 leading-relaxed">💡 iOS Safari 限制，請複製此代號後，回到桌面 APP 貼上即可。</p>
                          </div>
                        )}
                        <div className="bg-emerald-50 p-4 rounded-2xl border border-emerald-100">
                          <div className="flex justify-between items-center mb-1"><p className="text-xs text-emerald-700 font-bold tracking-tight">個人專屬 ID</p><button onClick={() => { setIsEditingBaseId(!isEditingBaseId); setBaseIdEditValue(personalBaseId); }} className="text-emerald-500 flex items-center gap-1 text-[10px] bg-white px-2 py-0.5 rounded shadow-sm font-bold active:scale-95"><Icons.Edit size={10} />修改</button></div>
                          {isEditingBaseId ? (
                            <div className="flex flex-col gap-2 mt-2"><input type="text" value={baseIdEditValue} onChange={e => setBaseIdEditValue(e.target.value)} className="w-full p-3 bg-white rounded-xl border-2 border-emerald-200 outline-none font-bold text-center tracking-widest text-emerald-800" /><button onClick={() => { handleUpdateBaseId(baseIdEditValue); setIsEditingBaseId(false); }} className="w-full bg-emerald-600 text-white py-3 rounded-xl shadow-md active:scale-95 flex items-center justify-center gap-1 text-sm font-bold"><Icons.CheckCircle size={16} /> 確定修改並鎖定</button></div>
                          ) : (
                            <><p className="text-xl font-bold tracking-[0.2em] text-emerald-800 break-all">{personalBaseId}</p><button onClick={copySyncLink} className="w-full mt-3 bg-white border border-emerald-200 text-emerald-600 py-2 rounded-lg text-xs font-bold active:scale-95 transition-all shadow-sm flex justify-center items-center gap-1 hover:bg-emerald-50">產出同步連結 (換機用)</button></>
                          )}
                        </div>
                        {savedRooms.length > 0 && (
                          <div>
                            <h3 className="text-xs font-bold text-neutral-500 mb-3 flex items-center gap-1.5"><Icons.History size={14} /> 歷史頻道</h3>
                            <div className="space-y-2">{savedRooms.map((room, idx) => ( <div key={idx} onClick={() => handleTuneRoom(room.code, room.note)} className={`flex justify-between items-center p-3 rounded-xl border cursor-pointer transition-all active:scale-95 ${roomPath === room.code ? 'bg-amber-50 border-amber-300 shadow-sm' : 'bg-white border-neutral-200'}`}><div className="flex flex-col"><span className={`font-bold ${roomPath === room.code ? 'text-amber-700' : 'text-neutral-700'}`}>{room.note || '未命名'}</span><span className="text-[10px] text-neutral-400 font-mono italic">{room.code}</span></div><button onClick={(e) => { e.stopPropagation(); const n = savedRooms.filter(r => r.code !== room.code); setSavedRooms(n); localStorage.setItem('smart_buy_saved_rooms', JSON.stringify(n)); if (roomPath === room.code) { setRoomPath(''); localStorage.removeItem('smart_buy_room'); } }} className="p-3 text-neutral-300 hover:text-red-500 active:scale-75 bg-neutral-50 rounded-xl border border-neutral-100"><Icons.Trash size={18} /></button></div> ))}</div>
                          </div>
                        )}
                        <div className="pt-4 border-t border-dashed border-neutral-200">
                          <h3 className="text-xs font-bold text-neutral-500 mb-3">輸入新頻道與備註</h3>
                          <div className="space-y-3">
                            <input type="text" id="mRoomCode" placeholder="頻道代號" className="w-full p-3 bg-neutral-100 rounded-xl border-2 border-emerald-100 text-xl text-center font-bold tracking-widest text-emerald-800" />
                            <input type="text" id="mRoomNote" placeholder="加個備註 (如：家人用)" className="w-full p-3 bg-neutral-100 rounded-xl border-2 border-emerald-100 text-sm font-bold" />
                            <div className="flex gap-2">
                              <button onClick={async () => { try { const text = await navigator.clipboard.readText(); if (text) { document.getElementById('mRoomCode').value = text.trim(); setMsg('已貼上代號！'); setTimeout(() => setMsg(''), 2000); } } catch (err) { setMsg('請手動貼上'); setTimeout(() => setMsg(''), 2000); } }} className="w-1/3 bg-emerald-50 text-emerald-700 py-3 rounded-xl font-bold border border-emerald-200 active:scale-95 shadow-sm flex justify-center items-center gap-1">貼上</button>
                              <button onClick={() => { handleTuneRoom(document.getElementById('mRoomCode').value, document.getElementById('mRoomNote').value); }} className="w-2/3 bg-emerald-700 text-white py-3 rounded-xl font-bold active:scale-95 shadow-lg">連線</button>
                            </div>
                          </div>
                        </div>
                      </div>
                    )}
                    {modalState.type === 'editingTag' && modalState.data && (
                      <div className="flex flex-col gap-3 py-2">
                        <div className="text-center mb-1"><span className="text-base font-bold text-emerald-800 bg-emerald-100 px-4 py-1.5 rounded-full tracking-wide shadow-sm">📍 {modalState.data.name}</span></div>
                        <div className="grid grid-cols-2 gap-2">{customTags.map(t => ( <button key={t} onClick={async () => { await updateDoc(getItemRef(modalState.data.id), { tag: t }); setModalState({ type: null }); }} className={`py-3 rounded-xl font-bold text-sm border ${modalState.data.tag === t ? 'bg-emerald-600 text-white shadow-md' : 'bg-neutral-50 text-neutral-600'}`}>{t}</button> ))}</div>
                      </div>
                    )}
                    {(modalState.type === 'manageTag' || modalState.type === 'manageQuick') && (
                      <div className="flex flex-col h-full">
                        {modalState.type === 'manageTag' ? (
                          <div className="flex flex-col gap-3 mb-4 shrink-0 bg-emerald-50 p-3 rounded-xl border border-emerald-100"><p className="text-xs font-bold text-emerald-700">快速新增地點</p><div className="flex gap-2"><input type="text" id="mAddTag" placeholder="地點名稱..." className="flex-1 p-3 rounded-lg border border-emerald-200 outline-none text-base font-bold bg-white min-w-0" /><button onClick={() => { const v = document.getElementById('mAddTag').value; if (v) { handleAddNewTag(v, false); document.getElementById('mAddTag').value = ''; } }} className="shrink-0 bg-emerald-600 text-white px-5 rounded-lg font-bold active:scale-95 shadow-md flex items-center gap-1 transition-transform">新增</button></div></div>
                        ) : (
                          <div className="flex flex-col gap-3 mb-4 shrink-0 bg-amber-50 p-3 rounded-xl border border-amber-100"><p className="text-xs font-bold text-amber-700">快速新增常用項</p><input type="text" id="mAddQuick" placeholder="物品名稱..." className="w-full p-3 rounded-lg border border-amber-200 outline-none text-base font-bold bg-white" /><div className="flex gap-2"><select id="mAddQuickTag" className="flex-1 min-w-0 p-3 bg-white rounded-lg border border-amber-200 font-bold text-base outline-none text-neutral-700"><option value="">無預設地點</option>{customTags.map(t => <option key={t} value={t}>{t}</option>)}</select><button onClick={() => { const n = document.getElementById('mAddQuick').value; const t = document.getElementById('mAddQuickTag').value; if (n) { handleAddNewQuick(n, t, false); document.getElementById('mAddQuick').value = ''; } }} className="shrink-0 bg-amber-600 text-white px-5 rounded-lg font-bold active:scale-95 shadow-md flex items-center gap-1 transition-transform">新增</button></div></div>
                        )}
                        <div className="overflow-y-auto space-y-2 py-2 flex-1 scrollbar-hide" onTouchMove={(e) => onVMove(e, modalState.type === 'manageTag' ? 'data-v-tag-index' : 'data-v-quick-index')}>
                          {(modalState.type === 'manageTag' ? customTags : quickItems).map((item, idx) => {
                            const name = modalState.type === 'manageTag' ? item : (item.n || item.name);
                            return (
                              <div key={idx} data-v-tag-index={modalState.type === 'manageTag' ? idx : undefined} data-v-quick-index={modalState.type === 'manageQuick' ? idx : undefined} className={`flex justify-between items-center bg-neutral-50 p-2 rounded-xl border transition-all ${vDragIdx === idx ? 'opacity-40 border-emerald-500 scale-95 shadow-inner' : 'border-neutral-100'}`}><div className="flex items-center gap-2 flex-1"><div className="p-3 text-neutral-400 drag-handle" onTouchStart={() => onVStart(idx)} onTouchEnd={() => onVEnd(modalState.type === 'manageTag' ? 'tag' : 'quick')} onTouchCancel={() => onVEnd(modalState.type === 'manageTag' ? 'tag' : 'quick')}><Icons.GripVertical /></div><span className="font-bold text-neutral-700 text-sm">{name}</span></div><button onClick={() => modalState.type === 'manageTag' ? delTag(item) : delQuick(idx)} className="text-red-400 p-3 active:scale-75"><Icons.Trash size={18} /></button></div>
                            );
                          })}
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    };
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
