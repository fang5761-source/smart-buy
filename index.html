    };

    const DEFAULT_TAGS = ['全聯', '其它'];
    const DEFAULT_QUICK = [{ n: '雞蛋', t: '全聯' }];

    const App = () => {
      const [user, setUser] = useState(null);
      const [items, setItems] = useState([]);
      const [history, setHistory] = useState({});
      const [customTags, setCustomTags] = useState(DEFAULT_TAGS);
      const [quickItems, setQuickItems] = useState(DEFAULT_QUICK);
      const [personalBaseId, setPersonalBaseId] = useState(() => localStorage.getItem('smart_buy_base_id') || generateId());
      const [inputValue, setInputValue] = useState('');
      const [qtyValue, setQtyValue] = useState('');
      const [activeTag, setActiveTag] = useState('');
      const [filterTag, setFilterTag] = useState('全部');
      const [isShoppingMode, setIsShoppingMode] = useState(false);
      const [roomPath, setRoomPath] = useState(() => localStorage.getItem('smart_buy_room') || '');
      const [modalState, setModalState] = useState({ type: null, data: null });
      const [msg, setMsg] = useState('');
      const [expandedSection, setExpandedSection] = useState('');
      const [modalInput, setModalInput] = useState('');
      const [modalSelect, setModalSelect] = useState('');
      const [baseIdEditValue, setBaseIdEditValue] = useState(personalBaseId);
      const [isEditingBaseId, setIsEditingBaseId] = useState(false);
      const [vDragIdx, setVDragIdx] = useState(null);
      const [vDragOverIdx, setVDragOverIdx] = useState(null);
      const [hDragType, setHDragType] = useState(null);
      const [hDragIdx, setHDragIdx] = useState(null);
      const [hDragOverIdx, setHDragOverIdx] = useState(null);
      
      const dragDidHappenTag = useRef(false);
      const touchTimerTag = useRef(null);
      const touchStartTag = useRef({ x: 0, y: 0 });
      const isScrollingTag = useRef(false);
      
      const dragDidHappenQuick = useRef(false);
      const touchTimerQuick = useRef(null);
      const touchStartQuick = useRef({ x: 0, y: 0 });
      const isScrollingQuick = useRef(false);
      
      const [savedRooms, setSavedRooms] = useState(() => {
        const raw = localStorage.getItem('smart_buy_saved_rooms');
        if (!raw) return [];
        try {
          const parsed = JSON.parse(raw);
          return parsed.map(r => (typeof r === 'string' ? { code: r, note: '' } : r)).filter(r => r && r.code);
        } catch (e) {
          return [];
        }
      });
      
      const getFriendlyName = (path) => {
        if (!path) return '';
        const saved = savedRooms.find(r => r.code === path);
        if (saved && saved.note) return saved.note;
        const parts = path.split('-');
        return parts.length > 1 ? parts[1] : path;
      };
      
      const headerRoomTitle = useMemo(() => {
        if (!roomPath) return '進入頻道';
        return getFriendlyName(roomPath);
      }, [roomPath, savedRooms]);
      
      const dynamicFilterTags = useMemo(() => {
        const tagsInUse = Array.from(new Set(items.map(item => item.tag))).filter(t => t && t !== '');
        return ['全部', ...customTags.filter(tag => tagsInUse.includes(tag))];
      }, [items, customTags]);
      
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const urlRoom = params.get('room');
        if (urlRoom) {
          setRoomPath(urlRoom);
          localStorage.setItem('smart_buy_room', urlRoom);
          setSavedRooms(prev => {
            if (prev.find(r => r && r.code === urlRoom)) return prev;
            const next = [{ code: urlRoom, note: '分享進入' }, ...prev];
            localStorage.setItem('smart_buy_saved_rooms', JSON.stringify(next));
            return next;
          });
          window.history.replaceState({}, document.title, window.location.pathname);
        }
        onAuthStateChanged(auth, u => {
          if (u) setUser(u);
          else signInAnonymously(auth).catch(console.error);
        });
        localStorage.setItem('smart_buy_base_id', personalBaseId);
      }, [personalBaseId]);
      
      useEffect(() => {
        if (!user) return;
        const prefix = roomPath ? `room_${roomPath}` : `user_${user.uid}`;
        const unsubItems = onSnapshot(query(collection(db, 'artifacts', APP_ID_PATH, 'public', 'data', `list_${prefix}`), orderBy('createdAt', 'desc')), snap => {
          setItems(snap.docs.map(d => ({ id: d.id, ...d.data() })));
        });
        const unsubHist = onSnapshot(collection(db, 'artifacts', APP_ID_PATH, 'public', 'data', `hist_${prefix}`), snap => {
          const h = {};
          snap.docs.forEach(d => {
            const data = d.data();
            h[data.name] = data;
          });
          setHistory(h);
        });
        const unsubConfig = onSnapshot(doc(db, 'artifacts', APP_ID_PATH, 'public', 'data', `config_${prefix}`, 'settings'), snap => {
          if (snap.exists()) {
            const data = snap.data();
            if (data.tags) setCustomTags(data.tags);
            if (data.quick) setQuickItems(data.quick.filter(q => q && (q.n || q.name)));
          } else {
            setDoc(snap.ref, { tags: DEFAULT_TAGS, quick: DEFAULT_QUICK });
          }
        });
        return () => {
          unsubItems();
          unsubHist();
          unsubConfig();
        };
      }, [user, roomPath]);
      
      const getConfigRef = () => doc(db, 'artifacts', APP_ID_PATH, 'public', 'data', `config_${roomPath ? `room_${roomPath}` : `user_${user.uid}`}`, 'settings');
      const getItemRef = (id) => doc(db, 'artifacts', APP_ID_PATH, 'public', 'data', `list_${roomPath ? `room_${roomPath}` : `user_${user.uid}`}`, id);
      
      const handleAdd = async (e) => {
        if (e) e.preventDefault();
        if (!inputValue.trim() || !user) return;
        await addDoc(collection(db, 'artifacts', APP_ID_PATH, 'public', 'data', `list_${roomPath ? `room_${roomPath}` : `user_${user.uid}`}`), { name: inputValue.trim(), qty: qtyValue.trim(), tag: activeTag || '', completed: false, postponed: false, createdAt: Date.now() });
        setInputValue('');
        setQtyValue('');
      };
      
      const handleQuickSelect = (qa) => {
        setInputValue(qa.n || qa.name || '');
        setActiveTag(qa.t || qa.tag || '');
      };
      
      const handleComplete = async (item) => {
        await updateDoc(getItemRef(item.id), { completed: !item.completed, postponed: false });
      };
      
      const handlePostpone = async (e, item) => {
        e.stopPropagation();
        await updateDoc(getItemRef(item.id), { postponed: !item.postponed, completed: false });
      };
      
      const savePrice = async (itemName, price, itemTag, itemId) => {
        const prefix = roomPath ? `room_${roomPath}` : `user_${user.uid}`;
        await setDoc(doc(db, 'artifacts', APP_ID_PATH, 'public', 'data', `hist_${prefix}`, itemName), { name: itemName, price: price || '', tag: itemTag || '', updatedAt: Date.now() });
        if (itemId) await updateDoc(getItemRef(itemId), { currentPrice: price || '' });
      };
      
      const handleAddNewTag = async (tagName, shouldClose = false) => {
        const name = tagName.trim();
        if (!name) return;
        if (customTags.includes(name)) {
          setMsg('地點已存在！');
          setTimeout(() => setMsg(''), 1000);
          return;
        }
        const next = [...customTags, name];
        await setDoc(getConfigRef(), { tags: next }, { merge: true });
        if (shouldClose) setModalState({ type: null });
        setMsg('地點新增成功');
        setTimeout(() => setMsg(''), 1000);
      };
      
      const handleAddNewQuick = async (name, tag, shouldClose = false) => {
        const qName = name.trim();
        if (!qName) return;
        const next = [...quickItems.map(q => ({ n: q.n || q.name, t: q.t || q.tag || '' })), { n: qName, t: tag || '' }];
        await setDoc(getConfigRef(), { quick: next }, { merge: true });
        if (shouldClose) setModalState({ type: null });
        setMsg('品項新增成功');
        setTimeout(() => setMsg(''), 1000);
      };
      
      const delTag = async (t) => {
        const next = customTags.filter(tag => tag !== t);
        await setDoc(getConfigRef(), { tags: next }, { merge: true });
      };
      
      const delQuick = async (idx) => {
        const next = quickItems.filter((_, i) => i !== idx).map(q => ({ n: q.n || q.name, t: q.t || q.tag || '' }));
        await setDoc(getConfigRef(), { quick: next }, { merge: true });
      };
      
      const handleTuneRoom = (friendlyInput, note = '') => {
        const code = friendlyInput.trim();
        if (!code) {
          setRoomPath('');
          localStorage.removeItem('smart_buy_room');
          setModalState({ type: null });
          return;
        }
        const finalPath = code.includes('-') ? code : `${personalBaseId}-${code}`;
        setRoomPath(finalPath);
        localStorage.setItem('smart_buy_room', finalPath);
        const nextSaved = savedRooms.filter(r => r && r.code !== finalPath);
        const finalSaved = [{ code: finalPath, note: note || '' }, ...nextSaved];
        setSavedRooms(finalSaved);
        localStorage.setItem('smart_buy_saved_rooms', JSON.stringify(finalSaved));
        setModalState({ type: null });
        setMsg(`頻道連線成功`);
        setTimeout(() => setMsg(''), 1000);
      };
      
      const handleUpdateBaseId = (newVal) => {
        const val = newVal.trim();
        if (!val) return;
        setPersonalBaseId(val);
        setBaseIdEditValue(val);
        localStorage.setItem('smart_buy_base_id', val);
        setMsg('基地碼已固定');
        setTimeout(() => setMsg(''), 1000);
      };
      
      const clearCompleted = async () => {
        if (!user) return;
        const toDelete = items.filter(i => i.completed);
        for (const item of toDelete) {
          await deleteDoc(getItemRef(item.id));
        }
        setMsg('已清除完成項目');
        setTimeout(() => setMsg(''), 1000);
      };
      
      const copyAppUrl = async () => {
        const url = `${window.location.origin}${window.location.pathname}`;
        if (navigator.share) {
          try {
            await navigator.share({ title: '智能採買', text: '這是我超愛用的智能採買 APP，推薦給你！', url: url });
            return;
          } catch (err) {
            console.log('分享被取消或失敗', err);
          }
        }
        const tempIn = document.createElement('input');
        tempIn.value = url;
        document.body.appendChild(tempIn);
        tempIn.select();
        document.execCommand('copy');
        document.body.removeChild(tempIn);
        setMsg('APP 網址已複製！快去分享吧');
        setTimeout(() => setMsg(''), 2000);
      };
      
      const copyShareLink = async () => {
        if (!roomPath) return;
        const url = `${window.location.origin}${window.location.pathname}?room=${roomPath}`;
        if (navigator.share) {
          try {
            await navigator.share({ title: '智能採買 - 頻道分享', text: `點擊連結加入我的採買頻道，一起同步購物清單！`, url: url });
            return;
          } catch (err) {
            console.log('分享被取消或失敗', err);
          }
        }
        const tempIn = document.createElement('input');
        tempIn.value = url;
        document.body.appendChild(tempIn);
        tempIn.select();
        document.execCommand('copy');
        document.body.removeChild(tempIn);
        setMsg('對頻網址已複製！');
        setTimeout(() => setMsg(''), 2000);
      };
      
      const handleForceUpdate = () => {
        setMsg('正在為你重整並載入最新裝備...');
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            for (let registration of registrations) {
              registration.unregister();
            }
          });
        }
        if ('caches' in window) {
          caches.keys().then((keyList) => {
            return Promise.all(keyList.map((key) => {
              return caches.delete(key);
            }));
          });
        }
        setTimeout(() => {
          window.location.reload(true);
        }, 1500);
      };
      
      const onTouchStartHTag = (e, idx) => {
        touchStartTag.current = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        isScrollingTag.current = false;
        dragDidHappenTag.current = false;
        touchTimerTag.current = setTimeout(() => {
          if (!isScrollingTag.current) {
            setHDragIdx(idx);
            setHDragType('tag');
            dragDidHappenTag.current = true;
            if (navigator.vibrate) navigator.vibrate(50);
          }
        }, 350);
      };
      
      const onTouchMoveHTag = (e) => {
        const dx = Math.abs(e.touches[0].clientX - touchStartTag.current.x);
        const dy = Math.abs(e.touches[0].clientY - touchStartTag.current.y);
        if (hDragIdx === null || hDragType !== 'tag') {
          if (dx > 10 || dy > 10) {
            isScrollingTag.current = true;
            clearTimeout(touchTimerTag.current);
          }
          return;
        }
        e.preventDefault();
        const target = document.elementFromPoint(e.touches[0].clientX, e.touches[0].clientY);
        const dropElem = target?.closest('[data-h-tag-index]');
        if (dropElem) {
          const overIdx = parseInt(dropElem.getAttribute('data-h-tag-index'), 10);
          if (overIdx !== hDragOverIdx && overIdx !== hDragIdx) setHDragOverIdx(overIdx);
        }
      };
      
      const onTouchEndHTag = async () => {
        clearTimeout(touchTimerTag.current);
        if (hDragIdx !== null && hDragType === 'tag') {
          if (hDragOverIdx !== null && hDragIdx !== hDragOverIdx) {
            const next = [...customTags];
            const [moved] = next.splice(hDragIdx, 1);
            next.splice(hDragOverIdx, 0, moved);
            setCustomTags(next);
            await setDoc(getConfigRef(), { tags: next }, { merge: true });
          }
          setHDragIdx(null);
          setHDragOverIdx(null);
          setHDragType(null);
        }
      };
      
      const onTouchStartHQuick = (e, idx) => {
        touchStartQuick.current = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        isScrollingQuick.current = false;
        dragDidHappenQuick.current = false;
        touchTimerQuick.current = setTimeout(() => {
          if (!isScrollingQuick.current) {
            setHDragIdx(idx);
            setHDragType('quick');
            dragDidHappenQuick.current = true;
            if (navigator.vibrate) navigator.vibrate(50);
          }
        }, 350);
      };
      
      const onTouchMoveHQuick = (e) => {
        const dx = Math.abs(e.touches[0].clientX - touchStartQuick.current.x);
        const dy = Math.abs(e.touches[0].clientY - touchStartQuick.current.y);
        if (hDragIdx === null || hDragType !== 'quick') {
          if (dx > 10 || dy > 10) {
            isScrollingQuick.current = true;
            clearTimeout(touchTimerQuick.current);
          }
          return;
        }
        e.preventDefault();
        const target = document.elementFromPoint(e.touches[0].clientX, e.touches[0].clientY);
        const dropElem = target?.closest('[data-h-quick-index]');
        if (dropElem) {
          const overIdx = parseInt(dropElem.getAttribute('data-h-quick-index'), 10);
          if (overIdx !== hDragOverIdx && overIdx !== hDragIdx) setHDragOverIdx(overIdx);
        }
      };
      
      const onTouchEndHQuick = async () => {
        clearTimeout(touchTimerQuick.current);
        if (hDragIdx !== null && hDragType === 'quick') {
          if (hDragOverIdx !== null && hDragIdx !== hDragOverIdx) {
            const next = [...quickItems];
            const [moved] = next.splice(hDragIdx, 1);
            next.splice(hDragOverIdx, 0, moved);
            setQuickItems(next);
            const serialized = next.map(q => ({ n: q.n || q.name, t: q.t || q.tag || '' }));
            await setDoc(getConfigRef(), { quick: serialized }, { merge: true });
          }
          setHDragIdx(null);
          setHDragOverIdx(null);
          setHDragType(null);
        }
      };
      
      const onVStart = (idx) => {
        setVDragIdx(idx);
        if (navigator.vibrate) navigator.vibrate(30);
      };
      
      const onVMove = (e, attr) => {
        if (vDragIdx === null) return;
        e.preventDefault();
        const touch = e.touches[0];
        const target = document.elementFromPoint(touch.clientX, touch.clientY);
        const dropElem = target?.closest(`[${attr}]`);
        if (dropElem) {
          const hoverIdx = parseInt(dropElem.getAttribute(attr), 10);
          if (hoverIdx !== vDragOverIdx) setVDragOverIdx(hoverIdx);
        }
      };
      
      const onVEnd = async (type) => {
        if (vDragIdx !== null && vDragOverIdx !== null && vDragIdx !== vDragOverIdx) {
          if (type === 'tag') {
            const next = [...customTags];
            const [moved] = next.splice(vDragIdx, 1);
            next.splice(vDragOverIdx, 0, moved);
            setCustomTags(next);
            await setDoc(getConfigRef(), { tags: next }, { merge: true });
          } else {
            const next = [...quickItems];
            const [moved] = next.splice(vDragIdx, 1);
            next.splice(vDragOverIdx, 0, moved);
            setQuickItems(next);
            const serialized = next.map(q => ({ n: q.n || q.name, t: q.t || q.tag || '' }));
            await setDoc(getConfigRef(), { quick: serialized }, { merge: true });
          }
        }
        setVDragIdx(null);
        setVDragOverIdx(null);
      };
      
      const filteredItems = items.filter(item => filterTag === '全部' ? true : item.tag === filterTag);

      return (
        <div className="w-full h-full flex justify-center bg-neutral-100 font-sans text-neutral-800">
          
          {msg && (
            <div className="fixed top-10 left-1/2 -translate-x-1/2 bg-neutral-800/90 text-white px-5 py-2.5 rounded-full text-sm font-bold shadow-2xl z-[200] animate-slide-up whitespace-nowrap">
              {msg}
            </div>
          )}

          <div className="w-full max-w-md bg-white h-full flex flex-col relative shadow-2xl sm:border-x border-neutral-200 z-0">
            <header className="bg-emerald-700 text-white shrink-0 shadow-lg z-20 pt-[max(env(safe-area-inset-top),0px)]">
              <div className="px-3 py-3 sm:py-4 flex justify-between items-center h-[64px] sm:h-[72px]">
                <div className="flex items-center gap-2 font-bold">
                  <Icons.Cart />
                  <h1 className="text-xl sm:text-2xl tracking-tight font-serif-tc">智能採買</h1>
                  <button onClick={() => setModalState({ type: 'about' })} className="p-1.5 bg-emerald-600/60 rounded-full text-emerald-100 hover:bg-emerald-500 hover:text-white active:scale-90 transition-all ml-1 shadow-inner border border-emerald-500/50">
                    <Icons.Info size={16} />
                  </button>
                </div>
                <div className="flex gap-2">
                  {roomPath && <button onClick={copyShareLink} className="p-2 bg-white/20 rounded-lg active:scale-90 transition-all"><Icons.Share size={18} /></button>}
                  <button onClick={() => {
                    setModalInput(''); setIsEditingBaseId(false); setBaseIdEditValue(personalBaseId); setModalState({ type: 'room' });
                  }} className={`px-2.5 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition-all active:scale-95 shadow-sm ${roomPath ? 'bg-amber-400 text-amber-900' : 'bg-emerald-600 text-white border border-emerald-500'}`}>
                    {headerRoomTitle}
                  </button>
                </div>
              </div>
            </header>

            <div className={`transition-all duration-300 origin-top overflow-hidden bg-emerald-50 shrink-0 shadow-sm ${isShoppingMode ? 'max-h-0 opacity-0' : 'max-h-[450px] opacity-100 border-b border-emerald-100'}`}>
              <div className="p-3 space-y-3">
                <form onSubmit={handleAdd} className="flex gap-2 items-center">
                  <input type="text" value={inputValue} onChange={e => setInputValue(e.target.value)} placeholder="例如：雞蛋" className="flex-1 min-w-0 p-3 rounded-xl border-none shadow-inner focus:ring-2 focus:ring-emerald-600 outline-none text-lg bg-white font-bold" />
                  <input type="text" value={qtyValue} onChange={e => setQtyValue(e.target.value)} placeholder="數量" className="w-14 sm:w-16 p-3 rounded-xl border-none shadow-inner text-center outline-none text-base bg-white font-bold" />
                  <button type="submit" className="bg-emerald-700 text-white p-3 rounded-xl shadow-lg active:scale-95 shrink-0"><Icons.Plus /></button>
                </form>
                <div className="flex items-center gap-2 pb-1 relative overflow-x-auto scrollbar-hide">
                  <div className="sticky left-0 z-10 bg-emerald-50 pr-2 py-0.5">
                    <button type="button" onClick={() => setModalState({ type: 'manageQuick' })} className="shrink-0 text-emerald-600 flex items-center justify-center p-1.5 bg-emerald-100 rounded-full active:scale-95 shadow-sm"><Icons.Settings size={18} /></button>
                  </div>
                  {quickItems.map((qa, i) => (
                    <button key={i} data-h-quick-index={i} onTouchStart={(e) => onTouchStartHQuick(e, i)} onTouchMove={onTouchMoveHQuick} onTouchEnd={onTouchEndHQuick} onTouchCancel={onTouchEndHQuick} onClick={(e) => {
                      if (dragDidHappenQuick.current || isScrollingQuick.current) { e.preventDefault(); return; }
                      handleQuickSelect(qa);
                    }} className={`shrink-0 whitespace-nowrap px-3 py-1.5 rounded-full text-xs font-bold transition-all shadow-sm select-none ${hDragIdx === i && hDragType === 'quick' ? 'scale-110 opacity-80 bg-amber-500 text-white z-50' : hDragOverIdx === i && hDragType === 'quick' ? 'border-2 border-dashed border-amber-500' : 'bg-amber-50 border border-amber-200 text-amber-700 active:scale-95'}`}>
                      + {qa.n || qa.name}
                    </button>
                  ))}
                  <button type="button" onClick={() => { setModalInput(''); setModalState({ type: 'addQuick' }); }} className="shrink-0 px-3 py-1.5 rounded-full text-xs font-bold text-amber-600 bg-amber-50 border border-amber-200 border-dashed flex items-center justify-center active:scale-95"><Icons.Plus size={14} /></button>
                </div>
                <div className="flex items-center gap-2 pt-2 border-t border-emerald-100/50 mt-1 relative overflow-x-auto scrollbar-hide">
                  <div className="sticky left-0 z-10 bg-emerald-50 pr-2 py-0.5">
                    <button type="button" onClick={() => setModalState({ type: 'manageTag' })} className="shrink-0 text-emerald-600 flex items-center justify-center p-1.5 bg-emerald-100 rounded-full active:scale-95 shadow-sm"><Icons.Settings size={18} /></button>
                  </div>
                  {customTags.map((t, idx) => (
                    <button key={t} data-h-tag-index={idx} onTouchStart={(e) => onTouchStartHTag(e, idx)} onTouchMove={onTouchMoveHTag} onTouchEnd={onTouchEndHTag} onTouchCancel={onTouchEndHTag} onClick={(e) => {
                      if (dragDidHappenTag.current || isScrollingTag.current) { e.preventDefault(); return; }
                      setActiveTag(activeTag === t ? '' : t);
                    }} className={`shrink-0 px-3 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-all shadow-sm select-none ${hDragIdx === idx && hDragType === 'tag' ? 'scale-110 opacity-80 bg-emerald-500 text-white z-50' : hDragOverIdx === idx && hDragType === 'tag' ? 'border-2 border-dashed border-emerald-500' : activeTag === t ? 'bg-emerald-700 text-white scale-105' : 'bg-white text-emerald-700 border border-emerald-200 active:scale-95'}`}>
                      {t}
                    </button>
                  ))}
                  <button type="button" onClick={() => { setModalInput(''); setModalState({ type: 'addTag' }); }} className="shrink-0 px-3 py-1.5 rounded-full text-xs font-bold text-emerald-600 bg-emerald-50 border border-emerald-200 border-dashed flex items-center justify-center active:scale-95"><Icons.Plus size={14} /></button>
                </div>
              </div>
            </div>

            <button onClick={() => setIsShoppingMode(!isShoppingMode)} className={`shrink-0 w-full py-3 flex items-center justify-center gap-2 text-sm font-bold border-b transition-colors ${isShoppingMode ? 'bg-emerald-100 text-emerald-700 border-emerald-200' : 'bg-neutral-50 text-neutral-500'}`}>
              {isShoppingMode ? <><Icons.ChevronDown size={18} /> ➕ 展開備戰區</> : <><Icons.Cart size={18} /> 🛒 收起並開始採買</>}
            </button>

            {dynamicFilterTags.length > 1 && (
              <div className="bg-white border-b border-neutral-100 flex overflow-x-auto scrollbar-hide shrink-0 shadow-sm z-10">
                {dynamicFilterTags.map(tag => (
                  <button key={`filter-${tag}`} onClick={() => setFilterTag(tag)} className={`flex-1 min-w-[70px] py-3 text-sm font-bold transition-colors relative whitespace-nowrap px-2 ${filterTag === tag ? 'text-emerald-700 font-bold' : 'text-neutral-400 bg-neutral-50/20'}`}>
                    {tag}{filterTag === tag && <div className="absolute bottom-0 left-0 right-0 h-0.5 bg-emerald-700" />}
                  </button>
                ))}
              </div>
            )}

            <main className="p-3 space-y-3 bg-neutral-50/50 flex-1 overflow-y-auto pb-24">
              {filteredItems.map(item => (
                <div key={item.id} className={`flex items-start gap-3 p-3 rounded-2xl border transition-all ${item.completed ? 'bg-neutral-100 border-neutral-200 opacity-60' : item.postponed ? 'bg-amber-50/50 border-amber-200 shadow-inner' : 'bg-white border-emerald-100 shadow-sm'}`}>
                  <div className="flex flex-col items-center gap-2 shrink-0 mt-0.5">
                    <div onClick={() => handleComplete(item)} className={`w-8 h-8 rounded-full border-2 flex items-center justify-center transition-colors cursor-pointer active:scale-90 ${item.completed ? 'bg-emerald-600 border-emerald-600 text-white shadow-inner' : 'border-neutral-300 bg-white'}`}>
                      {item.completed && <Icons.Check size={18} />}
                    </div>
                    {!item.completed && (
                      <button onClick={(e) => handlePostpone(e, item)} className={`p-1.5 rounded-lg transition-colors active:scale-75 ${item.postponed ? 'text-amber-500 bg-amber-100' : 'text-neutral-400 bg-neutral-50'}`}>
                        <Icons.Clock size={18} />
                      </button>
                    )}
                  </div>
                  <div className="flex flex-col min-w-0 flex-1 gap-2 w-full py-0.5">
                    <div className="flex items-center justify-between gap-2 w-full">
                      <div className="flex items-center gap-2 min-w-0 flex-1">
                        <span onClick={() => handleComplete(item)} className={`text-lg font-bold truncate cursor-pointer ${item.completed ? 'line-through text-neutral-400' : item.postponed ? 'text-amber-800' : 'text-neutral-800'}`}>
                          {item.name}
                        </span>
                        {item.qty ? (
                          <button onClick={(e) => { e.stopPropagation(); setModalInput(item.qty); setModalState({ type: 'editQty', data: item }); }} disabled={item.completed} className={`text-[10px] px-1.5 py-0.5 rounded font-bold whitespace-nowrap shrink-0 ${item.completed ? 'text-neutral-400' : 'bg-neutral-100 text-neutral-600 shadow-sm'}`}>
                            {item.qty}
                          </button>
                        ) : (!item.completed && (
                          <button onClick={(e) => { e.stopPropagation(); setModalInput(''); setModalState({ type: 'editQty', data: item }); }} className="text-[10px] px-1.5 py-0.5 rounded border border-dashed border-neutral-300 text-neutral-400 font-bold whitespace-nowrap active:scale-90">
                            +數量
                          </button>
                        ))}
                      </div>
                      {!item.completed && (
                        <button onClick={(e) => { e.stopPropagation(); setModalInput(item.currentPrice || ''); setModalState({ type: 'recordingPrice', data: item }); }} className={`px-2.5 py-1 rounded-lg text-xs font-bold active:scale-90 shrink-0 whitespace-nowrap shadow-sm ${item.currentPrice ? 'bg-emerald-100 text-emerald-700 border border-emerald-200' : 'bg-amber-100 text-amber-700'}`}>
                          {item.currentPrice ? `現價 $${item.currentPrice}` : '記 $'}
                        </button>
                      )}
                    </div>
                    <div className="flex items-center justify-between gap-2 mt-1 w-full">
                      <div className="flex items-center gap-2 min-w-0 flex-1">
                        <button onClick={(e) => { e.stopPropagation(); setModalState({ type: 'editingTag', data: item }); }} className={`shrink-0 text-[10px] px-2 py-0.5 rounded font-bold active:scale-95 transition-transform flex items-center gap-1 ${item.completed ? 'bg-neutral-200 text-neutral-400' : item.tag && item.tag !== '無' ? 'bg-[#e6f4ea] text-[#1e8e3e] border border-emerald-100' : 'bg-neutral-100 text-neutral-400 border border-dashed border-neutral-300'}`}>
                          {item.tag && item.tag !== '無' ? item.tag : '+地點'}
                        </button>
                        {history[item.name] && !item.completed && (
                          <span className="text-[10px] text-amber-600 font-bold truncate text-right whitespace-nowrap">
                            上次買：${history[item.name].price} ({history[item.name].tag || '無'})
                          </span>
                        )}
                      </div>
                      <button onClick={() => deleteDoc(getItemRef(item.id))} className="p-1.5 text-neutral-300 hover:text-red-500 active:scale-75 shrink-0">
                        <Icons.Trash size={18} />
                      </button>
                    </div>
                  </div>
                </div>
              ))}
              {items.some(i => i.completed) && (
                <div className="pt-6 flex justify-center w-full">
                  <button onClick={clearCompleted} className="flex items-center gap-1.5 px-6 py-3 text-red-500 bg-white border border-red-100 rounded-full font-bold active:scale-95 shadow-sm text-sm">
                    <Icons.Trash size={18} /> 清除畫面中已買
                  </button>
                </div>
              )}
            </main>

            {modalState.type && (
              <div className="fixed inset-0 bg-black/60 z-[120] flex items-end sm:items-center justify-center backdrop-blur-sm" onClick={() => { setModalState({ type: null, data: null }); setExpandedSection(''); }}>
                <div className="bg-white w-full max-w-md rounded-t-[32px] sm:rounded-3xl p-6 pb-10 shadow-2xl animate-slide-up flex flex-col max-h-[85vh] overflow-hidden" onClick={e => e.stopPropagation()}>
                  <div className="flex justify-between items-center mb-4 border-b border-neutral-100 pb-2 shrink-0">
                    <h3 className="text-lg font-bold text-emerald-700 font-serif-tc">
                      {modalState.type === 'editingTag' ? '更換地點' : modalState.type === 'recordingPrice' ? '紀錄現價' : modalState.type === 'editQty' ? '修改數量' : modalState.type === 'room' ? '通訊頻道管理' : modalState.type === 'about' ? '關於與設定' : modalState.type === 'donate' ? '請朵朵喝咖啡' : modalState.type === 'addTag' || modalState.type === 'manageTag' ? '地點設定中心' : '品項設定中心'}
                    </h3>
                    <button onClick={() => { setModalState({ type: null, data: null }); setExpandedSection(''); }} className="p-1 hover:bg-neutral-100 rounded-full transition-colors">
                      <Icons.X />
                    </button>
                  </div>
                  {/* 內部留出 pb-24 滑動空間，讓最下方的按鈕能完全浮上來 */}
                  <div className="overflow-y-auto pr-1 flex-1 scrollbar-hide pb-24">
                    
                    {/* ====== 找回的裝備 1：單點新增標籤 ====== */}
                    {modalState.type === 'addTag' && (
                      <div className="space-y-4 py-2">
                        {/* 拆除 autoFocus 避免蘋果系統強制彈出鍵盤撞到動態島 */}
                        <input type="text" value={modalInput} onChange={e => setModalInput(e.target.value)} placeholder="輸入新地點名稱..." className="w-full p-4 rounded-xl border-2 border-emerald-100 outline-none text-xl font-bold text-center" />
                        <button onClick={() => handleAddNewTag(modalInput, true)} className="w-full bg-emerald-700 text-white py-4 rounded-xl font-bold text-lg shadow-lg active:scale-95 transition-transform">確認新增</button>
                      </div>
                    )}

                    {/* ====== 找回的裝備 2：單點新增快速品項 ====== */}
                    {modalState.type === 'addQuick' && (
                      <div className="space-y-4 py-2">
                        <input type="text" value={modalInput} onChange={e => setModalInput(e.target.value)} placeholder="輸入品項名稱 (如: 衛生紙)..." className="w-full p-4 rounded-xl border-2 border-amber-100 outline-none text-xl font-bold text-center" />
                        <select value={modalSelect} onChange={e => setModalSelect(e.target.value)} className="w-full p-3 bg-neutral-50 rounded-xl border border-neutral-200 font-bold text-neutral-700 outline-none">
                          <option value="">無預設地點</option>
                          {customTags.map(t => <option key={t} value={t}>{t}</option>)}
                        </select>
                        <button onClick={() => handleAddNewQuick(modalInput, modalSelect, true)} className="w-full bg-amber-600 text-white py-4 rounded-xl font-bold text-lg shadow-lg active:scale-95 transition-transform">確認新增</button>
                      </div>
                    )}

                    {/* ====== 找回的裝備 3：修改數量 ====== */}
                    {modalState.type === 'editQty' && modalState.data && (
                      <div className="space-y-4 py-2">
                        <div className="text-center mb-1">
                          <span className="text-base font-bold text-emerald-800 bg-emerald-100 px-4 py-1.5 rounded-full tracking-wide shadow-sm">
                            📝 {modalState.data.name}
                          </span>
                        </div>
                        <input type="text" value={modalInput} onChange={e => setModalInput(e.target.value)} placeholder="輸入數量與單位..." className="w-full p-4 rounded-xl border-2 border-emerald-100 outline-none text-xl font-bold text-center" />
                        <div className="flex gap-2">
                          <button onClick={async () => { await updateDoc(getItemRef(modalState.data.id), { qty: '' }); setModalState({ type: null }); }} className="flex-1 bg-neutral-100 text-neutral-500 py-3 rounded-xl font-bold active:scale-95 transition-transform">
                            清除
                          </button>
                          <button onClick={async () => { await updateDoc(getItemRef(modalState.data.id), { qty: modalInput }); setModalState({ type: null }); }} className="flex-[2] bg-emerald-600 text-white py-3 rounded-xl font-bold text-lg shadow-lg active:scale-95 transition-transform">
                            確定更新
                          </button>
                        </div>
                      </div>
                    )}

                    {/* ====== 找回的裝備 4：紀錄現價 ====== */}
                    {modalState.type === 'recordingPrice' && modalState.data && (
                      <div className="space-y-4 py-2">
                        <div className="text-center mb-1">
                          <span className="text-base font-bold text-amber-900 bg-[#FFDD00] px-4 py-1.5 rounded-full tracking-wide shadow-sm">
                            💰 {modalState.data.name}
                          </span>
                        </div>
                        <div className="text-xs text-amber-600 font-bold bg-amber-50 p-2 rounded-lg italic text-center">
                          {history[modalState.data.name] ? `上次買：$${history[modalState.data.name].price}` : '目前尚無比價紀錄'}
                        </div>
                        <input type="number" value={modalInput} onChange={e => setModalInput(e.target.value)} placeholder="輸入購買金額..." className="w-full p-4 rounded-xl border-2 border-emerald-100 outline-none text-xl font-bold text-center" />
                        <button onClick={async () => { await savePrice(modalState.data.name, modalInput, modalState.data.tag, modalState.data.id); setModalState({ type: null }); }} className="w-full bg-emerald-700 text-white py-4 rounded-xl font-bold shadow-lg active:scale-95 transition-transform">
                          確定紀錄
                        </button>
                      </div>
                    )}

                    {modalState.type === 'about' && (
                      <div className="space-y-4 py-2">
                        <div className="bg-emerald-50 p-4 rounded-2xl border border-emerald-100 text-center relative">
                          <h4 className="font-bold text-emerald-800 text-lg tracking-widest font-serif-tc">智能採買</h4>
                          <p className="text-xs text-emerald-600 mt-1 font-bold">版本 v1.0.0 (旗艦版)</p>
                          <p className="text-[10px] text-emerald-500/70 mt-2 font-bold">Developed with ❤️ by 朵朵</p>
                          <button onClick={handleForceUpdate} className="mt-4 bg-emerald-200/50 hover:bg-emerald-200 text-emerald-700 text-[10px] px-3 py-1.5 rounded-full font-bold flex items-center justify-center gap-1 mx-auto active:scale-95 transition-all border border-emerald-300/50">
                            <Icons.Refresh size={12} /> 檢查並載入新版本
                          </button>
                        </div>
                        <button onClick={copyAppUrl} className="w-full bg-white border-2 border-emerald-500 text-emerald-700 py-3 rounded-xl font-bold active:scale-95 transition-all flex items-center justify-center gap-2 shadow-sm">
                          <Icons.Share size={18} /> 分享此 APP
                        </button>
                        <div className="bg-white border-2 border-neutral-100 rounded-xl overflow-hidden">
                          <button onClick={() => setExpandedSection(expandedSection === 'install' ? '' : 'install')} className="w-full px-4 py-3 flex justify-between items-center font-bold text-neutral-700 active:bg-neutral-50">
                            <span className="flex items-center gap-2"><Icons.Smartphone size={18} className="text-blue-500" /> 加入手機主畫面</span>
                            <Icons.ChevronDown size={16} className={`transition-transform ${expandedSection === 'install' ? 'rotate-180' : ''}`} />
                          </button>
                          {expandedSection === 'install' && (
                            <div className="px-4 pb-4 pt-2 text-sm text-neutral-600 space-y-3 border-t border-neutral-50 bg-neutral-50/30">
                              <p className="leading-relaxed"><strong>🍎 Apple (iOS)：</strong><br />1. 用 Safari 瀏覽器打開本網頁。<br />2. 點擊下方工具列的「分享 📤」按鈕。<br />3. 選擇「加入主畫面 ➕」。</p>
                              <div className="w-full h-px bg-neutral-200"></div>
                              <p className="leading-relaxed"><strong>🤖 Android (安卓)：</strong><br />1. 用 Chrome 瀏覽器打開本網頁。<br />2. 點擊右上角的「選單 ⋮」。<br />3. 選擇「加到主畫面」或「安裝應用程式」。</p>
                            </div>
                          )}
                        </div>
                        <div className="bg-white border-2 border-neutral-100 rounded-xl overflow-hidden">
                          <button onClick={() => setExpandedSection(expandedSection === 'manual' ? '' : 'manual')} className="w-full px-4 py-3 flex justify-between items-center font-bold text-neutral-700 active:bg-neutral-50">
                            <span className="flex items-center gap-2"><Icons.BookOpen size={18} className="text-amber-500" /> 使用說明書</span>
                            <Icons.ChevronDown size={16} className={`transition-transform ${expandedSection === 'manual' ? 'rotate-180' : ''}`} />
                          </button>
                          {expandedSection === 'manual' && (
                            <div className="px-4 pb-4 pt-2 text-sm text-neutral-600 space-y-4 border-t border-neutral-50 bg-neutral-50/30 leading-relaxed">
                              <div>
                                <p className="font-bold text-emerald-700 mb-1 flex items-center gap-1">🛒 基礎採買操作</p>
                                <p>上方輸入框打字，按「+」或鍵盤的 Enter 即可新增。點擊清單項目可打勾完成；點擊「時鐘」可延後下次再買。</p>
                              </div>
                              <div className="w-full h-px bg-neutral-200/60"></div>
                              <div>
                                <p className="font-bold text-emerald-700 mb-1 flex items-center gap-1">🪪 基地 ID (你的專屬門號)</p>
                                <p>進入「頻道設定」，會看到一組英文亂碼，這是系統發給你的臨時身分。<strong>強烈建議點擊修改，改成你好記的專屬代碼(如 family 01)！</strong></p>
                                <p className="text-xs text-neutral-500 mt-1.5 bg-neutral-100 p-2 rounded-lg">💡 <strong>防走失好處：</strong>未來換手機或不小心清除網頁紀錄時，只要把 ID 改回 family 01，你所有的頻道、標籤、清單就會瞬間「連線回歸」，資料絕對安全！</p>
                              </div>
                            </div>
                          )}
                        </div>

                        {/* 留言板 */}
                        <button onClick={() => window.open('https://forms.gle/UVFSXsidHYMMtZwR9', '_blank')} className="w-full bg-white border-2 border-blue-200 text-blue-700 py-3 rounded-xl font-bold active:scale-95 transition-all flex items-center justify-center gap-2 shadow-sm mt-4">
                          💬 想跟朵朵說些什麼？
                        </button>

                        <button onClick={() => { setModalState({ type: 'donate' }); }} className="w-full bg-[#FFDD00] text-amber-900 py-2.5 px-4 rounded-xl active:scale-95 transition-all flex flex-col items-center justify-center gap-0.5 shadow-sm mt-4 mb-2">
                          <div className="flex items-center gap-2 font-bold text-base">
                            <Icons.Coffee size={18} /><span>喜歡這 APP 嗎？</span>
                          </div>
                          <span className="text-sm font-bold opacity-80">歡迎請我喝杯咖啡</span>
                        </button>
                      </div>
                    )}
                    {modalState.type === 'donate' && (
                      <div className="space-y-4 py-2 text-center">
                        <div className="bg-amber-50 p-4 rounded-2xl border border-amber-100">
                          <p className="text-sm text-amber-800 font-bold mb-2 leading-relaxed">
                            謝謝你的心意！能幫上忙是我最大的榮幸 🥰<br />
                          </p>
                          <div className="inline-block bg-amber-500 text-white text-xs px-3 py-1 rounded-full font-bold mb-2 shadow-sm">
                            ☕ 一杯咖啡 $50(杯數隨喜)
                          </div>
                          <p className="text-[10px] text-amber-600 font-bold mb-3">
                            支援各家銀行 APP、全支付、街口等掃碼
                          </p>
                          <div className="bg-white p-2 rounded-xl shadow-sm inline-block border border-amber-200">
                            <img src="donate-qr.JPG" alt="贊助條碼" className="w-36 h-36 object-contain rounded-lg" onError={(e) => { e.target.onerror = null; e.target.src = 'https://placehold.co/200x200?text=Donate+QR'; }} />
                          </div>
                        </div>
                        <div className="bg-neutral-50 p-3 rounded-xl border border-neutral-100 space-y-2">
                          <p className="text-xs font-bold text-neutral-500">手機不便掃碼？也可複製帳號轉帳</p>
                          <p className="text-sm font-bold text-neutral-700 tracking-wider">永豐銀行 (807)<br />204-018-0025253-1</p>
                          <button onClick={() => {
                            const temp = document.createElement('input');
                            temp.value = '20401800252531';
                            document.body.appendChild(temp);
                            temp.select();
                            document.execCommand('copy');
                            document.body.removeChild(temp);
                            setMsg('帳號已複製！');
                            setTimeout(() => setMsg(''), 2000);
                          }} className="w-full mt-2 bg-white border border-neutral-200 text-neutral-600 py-3 rounded-lg text-xs font-bold active:scale-95 transition-all shadow-sm flex justify-center items-center gap-1 mb-2">
                            📋 一鍵複製帳號
                          </button>
                        </div>
                      </div>
                    )}
                    {modalState.type === 'room' && (
                      <div className="space-y-6 py-2">
                        <div className="bg-emerald-50 p-4 rounded-2xl border border-emerald-100">
                          <div className="flex justify-between items-center mb-1">
                            <p className="text-xs text-emerald-700 font-bold tracking-tight">基地識別碼 (我的ID)</p>
                            <button onClick={() => { setIsEditingBaseId(!isEditingBaseId); setBaseIdEditValue(personalBaseId); }} className="text-emerald-500 flex items-center gap-1 text-[10px] bg-white px-2 py-0.5 rounded shadow-sm font-bold active:scale-95">
                              <Icons.Edit size={10} />修改
                            </button>
                          </div>
                          {isEditingBaseId ? (
                            <div className="flex flex-col gap-2 mt-2">
                              <input type="text" value={baseIdEditValue} onChange={e => setBaseIdEditValue(e.target.value)} className="w-full p-3 bg-white rounded-xl border-2 border-emerald-200 outline-none font-bold text-center tracking-widest text-emerald-800" />
                              <button onClick={() => { handleUpdateBaseId(baseIdEditValue); setIsEditingBaseId(false); }} className="w-full bg-emerald-600 text-white py-3 rounded-xl shadow-md active:scale-95 flex items-center justify-center gap-1 text-sm font-bold">
                                <Icons.CheckCircle size={16} /> 確定修改並鎖定
                              </button>
                            </div>
                          ) : (
                            <p className="text-xl font-bold tracking-[0.2em] text-emerald-800 break-all">{personalBaseId}</p>
                          )}
                        </div>
                        {savedRooms.length > 0 && (
                          <div>
                            <h3 className="text-xs font-bold text-neutral-500 mb-3 flex items-center gap-1.5">
                              <Icons.History size={14} /> 歷史通訊頻道
                            </h3>
                            <div className="space-y-2">
                              {savedRooms.map((room, idx) => (
                                <div key={idx} onClick={() => handleTuneRoom(room.code, room.note)} className={`flex justify-between items-center p-3 rounded-xl border cursor-pointer transition-all active:scale-95 ${roomPath === room.code ? 'bg-amber-50 border-amber-300 shadow-sm' : 'bg-white border-neutral-200'}`}>
                                  <div className="flex flex-col">
                                    <span className={`font-bold ${roomPath === room.code ? 'text-amber-700' : 'text-neutral-700'}`}>{room.note || '未命名'}</span>
                                    <span className="text-[10px] text-neutral-400 font-mono italic">{room.code}</span>
                                  </div>
                                  <button onClick={(e) => { e.stopPropagation(); const n = savedRooms.filter(r => r.code !== room.code); setSavedRooms(n); localStorage.setItem('smart_buy_saved_rooms', JSON.stringify(n)); if (roomPath === room.code) { setRoomPath(''); localStorage.removeItem('smart_buy_room'); } }} className="p-3 text-neutral-300 hover:text-red-500 active:scale-75 bg-neutral-50 rounded-xl border border-neutral-100">
                                    <Icons.Trash size={18} />
                                  </button>
                                </div>
                              ))}
                            </div>
                          </div>
                        )}
                        <div className="pt-4 border-t border-dashed border-neutral-200">
                          <h3 className="text-xs font-bold text-neutral-500 mb-3">
                            <Icons.Plus size={14} /> 輸入新頻道與備註
                          </h3>
                          <div className="space-y-3">
                            <input type="text" id="mRoomCode" placeholder="代號 (如 888)" className="w-full p-3 bg-neutral-100 rounded-xl border-2 border-emerald-100 text-xl text-center font-bold tracking-widest text-emerald-800" />
                            <input type="text" id="mRoomNote" placeholder="加個備註 (如：家人用)" className="w-full p-3 bg-neutral-100 rounded-xl border-2 border-emerald-100 text-sm font-bold" />
                            <button onClick={() => { handleTuneRoom(document.getElementById('mRoomCode').value, document.getElementById('mRoomNote').value); }} className="w-full bg-emerald-700 text-white py-3 rounded-xl font-bold active:scale-95 shadow-lg">
                              對頻連線
                            </button>
                          </div>
                        </div>
                      </div>
                    )}
                    {modalState.type === 'editingTag' && modalState.data && (
                      <div className="flex flex-col gap-3 py-2">
                        <div className="text-center mb-1">
                          <span className="text-base font-bold text-emerald-800 bg-emerald-100 px-4 py-1.5 rounded-full tracking-wide shadow-sm">
                            📍 {modalState.data.name}
                          </span>
                        </div>
                        <div className="grid grid-cols-2 gap-2">
                          {customTags.map(t => (
                            <button key={t} onClick={async () => { await updateDoc(getItemRef(modalState.data.id), { tag: t }); setModalState({ type: null }); }} className={`py-3 rounded-xl font-bold text-sm border ${modalState.data.tag === t ? 'bg-emerald-600 text-white shadow-md' : 'bg-neutral-50 text-neutral-600'}`}>
                              {t}
                            </button>
                          ))}
                        </div>
                      </div>
                    )}
                    {(modalState.type === 'manageTag' || modalState.type === 'manageQuick') && (
                      <div className="flex flex-col h-full">
                        
                        {/* ====== 找回的裝備 5：齒輪內的連發新增框 ====== */}
                        {modalState.type === 'manageTag' ? (
                          <div className="flex flex-col gap-3 mb-4 shrink-0 bg-emerald-50 p-3 rounded-xl border border-emerald-100">
                            <p className="text-xs font-bold text-emerald-700">快速新增地點</p>
                            <div className="flex gap-2">
                              <input type="text" id="mAddTag" placeholder="地點名稱 (如: 好市多)..." className="flex-1 p-3 rounded-lg border border-emerald-200 outline-none text-base font-bold bg-white min-w-0" />
                              <button onClick={() => { const v = document.getElementById('mAddTag').value; if (v) { handleAddNewTag(v, false); document.getElementById('mAddTag').value = ''; } }} className="shrink-0 bg-emerald-600 text-white px-5 rounded-lg font-bold active:scale-95 shadow-md flex items-center gap-1 transition-transform">
                                <Icons.Plus size={16} />新增
                              </button>
                            </div>
                          </div>
                        ) : (
                          <div className="flex flex-col gap-3 mb-4 shrink-0 bg-amber-50 p-3 rounded-xl border border-amber-100">
                            <p className="text-xs font-bold text-amber-700">快速新增品項</p>
                            <input type="text" id="mAddQuick" placeholder="品項名稱 (如: 衛生紙)..." className="w-full p-3 rounded-lg border border-amber-200 outline-none text-base font-bold bg-white" />
                            <div className="flex gap-2">
                              <select id="mAddQuickTag" className="flex-1 min-w-0 p-3 bg-white rounded-lg border border-amber-200 font-bold text-base outline-none text-neutral-700">
                                <option value="">無預設地點</option>
                                {customTags.map(t => <option key={t} value={t}>{t}</option>)}
                              </select>
                              <button onClick={() => { const n = document.getElementById('mAddQuick').value; const t = document.getElementById('mAddQuickTag').value; if (n) { handleAddNewQuick(n, t, false); document.getElementById('mAddQuick').value = ''; } }} className="shrink-0 bg-amber-600 text-white px-5 rounded-lg font-bold active:scale-95 shadow-md flex items-center gap-1 transition-transform">
                                <Icons.Plus size={16} />新增
                              </button>
                            </div>
                          </div>
                        )}

                        <div className="overflow-y-auto space-y-2 py-2 flex-1 scrollbar-hide" onTouchMove={(e) => onVMove(e, modalState.type === 'manageTag' ? 'data-v-tag-index' : 'data-v-quick-index')}>
                          {(modalState.type === 'manageTag' ? customTags : quickItems).map((item, idx) => {
                            const name = modalState.type === 'manageTag' ? item : (item.n || item.name);
                            return (
                              <div key={idx} data-v-tag-index={modalState.type === 'manageTag' ? idx : undefined} data-v-quick-index={modalState.type === 'manageQuick' ? idx : undefined} className={`flex justify-between items-center bg-neutral-50 p-2 rounded-xl border transition-all ${vDragIdx === idx ? 'opacity-40 border-emerald-500 scale-95 shadow-inner' : 'border-neutral-100'}`}>
                                <div className="flex items-center gap-2 flex-1">
                                  <div className="p-3 text-neutral-400 drag-handle" onTouchStart={() => onVStart(idx)} onTouchEnd={() => onVEnd(modalState.type === 'manageTag' ? 'tag' : 'quick')} onTouchCancel={() => onVEnd(modalState.type === 'manageTag' ? 'tag' : 'quick')}>
                                    <Icons.GripVertical />
                                  </div>
                                  <span className="font-bold text-neutral-700">{name}</span>
                                </div>
                                <button onClick={() => modalState.type === 'manageTag' ? delTag(item) : delQuick(idx)} className="text-red-400 p-3 active:scale-75">
                                  <Icons.Trash size={18} />
                                </button>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    };
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
