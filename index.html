  <script type="text/babel" data-type="module">

    const { useState, useEffect, useRef, useMemo } = React;

    const firebaseConfig = {

    const app = initializeApp(firebaseConfig);

    const PRESET_COLORS = [
      { bg: '#ecfdf5', text: '#065f46', border: '#10b981' }, // 翠綠
      { bg: '#eff6ff', text: '#1e40af', border: '#3b82f6' }, // 寶藍

    const generateId = (len = 4) => {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let res = '';
      for (let i = 0; i < len; i++) res += chars.charAt(Math.floor(Math.random() * chars.length));
      return res;
    };

    const Icons = {

      Share: ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8m-4-6-4-4-4 4m4-4v13"/></svg>,
      Settings: ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor"><path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73-1.69-.98l-.38-2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/></svg>,

      Smartphone: ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><path d="M12 18h.01"/></svg>,
      BookOpen: ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>,
      Coffee: ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" y1="2" x2="6" y2="4"/><line x1="10" y1="2" x2="10" y2="4"/><line x1="14" y1="2" x2="14" y2="4"/></svg>,
      Refresh: ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
    };

    const DEFAULT_TAGS = [
      { n: '全聯', c: 1 },
      { n: '郵局', c: 0 },
      { n: '菜市場', c: 2 },
      { n: '其它', c: 6 }
    ];
    const DEFAULT_QUICK = [{ n: '雞蛋', t: '全聯' }];

    const App = () => {
      const [user, setUser] = useState(null);
      const [items, setItems] = useState([]);
      const [history, setHistory] = useState({});
      const [customTags, setCustomTags] = useState(DEFAULT_TAGS);
      const [quickItems, setQuickItems] = useState(DEFAULT_QUICK);
      const [personalBaseId, setPersonalBaseId] = useState(() => localStorage.getItem('smart_buy_base_id') || generateId());
      const [inputValue, setInputValue] = useState('');
      const [qtyValue, setQtyValue] = useState('');
      const [activeTag, setActiveTag] = useState('');
      const [filterTag, setFilterTag] = useState('全部');
      const [isShoppingMode, setIsShoppingMode] = useState(false);
      const [roomPath, setRoomPath] = useState(() => localStorage.getItem('smart_buy_room') || '');
      const [modalState, setModalState] = useState({ type: null, data: null });
      const [msg, setMsg] = useState('');
      const [isLoading, setIsLoading] = useState(true);
      const [expandedSection, setExpandedSection] = useState('');
      const [modalInput, setModalInput] = useState('');
      const [modalSelect, setModalSelect] = useState('');
      const [modalColorIdx, setModalColorIdx] = useState(0);
      const [baseIdEditValue, setBaseIdEditValue] = useState(personalBaseId);
      const [isEditingBaseId, setIsEditingBaseId] = useState(false);
      const [vDragIdx, setVDragIdx] = useState(null);
      const [vDragOverIdx, setVDragOverIdx] = useState(null);
      const [hDragType, setHDragType] = useState(null);
      const [hDragIdx, setHDragIdx] = useState(null);
      const [hDragOverIdx, setHDragOverIdx] = useState(null);
      
      const getTagConfig = (tagName) => {
        const found = customTags.find(t => t.n === tagName);
        if (found && found.c !== undefined) return PRESET_COLORS[found.c] || PRESET_COLORS[0];
        return null;
      };

      const getTagInlineStyles = (tagName, opacity = 1) => {
        const cfg = getTagConfig(tagName);
        if (!cfg) return {};
        return { backgroundColor: opacity < 1 ? `${cfg.bg}aa` : cfg.bg, color: cfg.text, borderColor: cfg.border };
      };
      
      const dragDidHappenTag = useRef(false);
      const touchTimerTag = useRef(null);
      const touchStartTag = useRef({ x: 0, y: 0 });
      const isScrollingTag = useRef(false);
      const dragDidHappenQuick = useRef(false);
      const touchTimerQuick = useRef(null);
      const touchStartQuick = useRef({ x: 0, y: 0 });
      const isScrollingQuick = useRef(false);
      
      const [savedRooms, setSavedRooms] = useState(() => {
        const raw = localStorage.getItem('smart_buy_saved_rooms');
        if (!raw) return [];
        try {
          const parsed = JSON.parse(raw);
          return parsed.map(r => (typeof r === 'string' ? { code: r, note: '' } : r)).filter(r => r && r.code);
        } catch (e) { return []; }
      });
      
      const headerRoomTitle = useMemo(() => {
        if (!roomPath) return '進入頻道';
        const saved = savedRooms.find(r => r.code === roomPath);
        if (saved && saved.note) return saved.note;
        const parts = roomPath.split('-');
        return parts.length > 1 ? parts[1] : roomPath;
      }, [roomPath, savedRooms]);
      
      const dynamicFilterTags = useMemo(() => {
        const tagsInUse = Array.from(new Set(items.map(item => item.tag))).filter(t => t && t !== '');
        return ['全部', ...customTags.filter(tag => tagsInUse.includes(tag.n)).map(t => t.n)];
      }, [items, customTags]);
      
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const urlRoom = params.get('room');
        const syncDataRaw = params.get('sync');
        if (syncDataRaw) {
          try {
            const decoded = JSON.parse(decodeURIComponent(atob(syncDataRaw)));
            setModalState({ type: 'syncDevice', data: decoded });
          } catch (e) {}
          window.history.replaceState({}, document.title, window.location.pathname);
        } else if (urlRoom) {
          setRoomPath(urlRoom);
          localStorage.setItem('smart_buy_room', urlRoom);
          setSavedRooms(prev => {
            if (prev.find(r => r && r.code === urlRoom)) return prev;
            const next = [{ code: urlRoom, note: '分享進入' }, ...prev];
            localStorage.setItem('smart_buy_saved_rooms', JSON.stringify(next));
            return next;
          });
          window.history.replaceState({}, document.title, window.location.pathname);
        }
        onAuthStateChanged(auth, u => {
          if (u) setUser(u);
          else signInAnonymously(auth).catch(console.error);
        });
        localStorage.setItem('smart_buy_base_id', personalBaseId);
      }, [personalBaseId]);
      
      useEffect(() => {
        const url = new URL(window.location);
        if (roomPath) url.searchParams.set('room', roomPath);
        else url.searchParams.delete('room');
        window.history.replaceState({}, '', url);
      }, [roomPath]);

      useEffect(() => {
        if (!user) return;
        setIsLoading(true);
        const prefix = roomPath ? `room_${roomPath}` : `user_${user.uid}`;
        const unsubItems = onSnapshot(query(collection(db, 'artifacts', APP_ID_PATH, 'public', 'data', `list_${prefix}`), orderBy('createdAt', 'desc')), snap => {
          setItems(snap.docs.map(d => ({ id: d.id, ...d.data() })));
          setIsLoading(false);
        }, (err) => setIsLoading(false));
        const unsubHist = onSnapshot(collection(db, 'artifacts', APP_ID_PATH, 'public', 'data', `hist_${prefix}`), snap => {
          const h = {};
          snap.docs.forEach(d => { const data = d.data(); h[data.name] = data; });
          setHistory(h);
        });
        const unsubConfig = onSnapshot(doc(db, 'artifacts', APP_ID_PATH, 'public', 'data', `config_${prefix}`, 'settings'), snap => {
          if (snap.exists()) {
            const data = snap.data();
            if (data.tags) {
              const fixedTags = data.tags.map(t => typeof t === 'string' ? { n: t, c: 0 } : t);
              setCustomTags(fixedTags);
            }
            if (data.quick) setQuickItems(data.quick.filter(q => q && (q.n || q.name)));
          } else {
            setDoc(snap.ref, { tags: DEFAULT_TAGS, quick: DEFAULT_QUICK });
          }
        });
        return () => { unsubItems(); unsubHist(); unsubConfig(); };
      }, [user, roomPath]);
      
      const getConfigRef = () => doc(db, 'artifacts', APP_ID_PATH, 'public', 'data', `config_${roomPath ? `room_${roomPath}` : `user_${user.uid}`}`, 'settings');
      const getItemRef = (id) => doc(db, 'artifacts', APP_ID_PATH, 'public', 'data', `list_${roomPath ? `room_${roomPath}` : `user_${user.uid}`}`, id);
      const handleAdd = async (e) => {
        if (e) e.preventDefault();
        if (!inputValue.trim() || !user) return;
        await addDoc(collection(db, 'artifacts', APP_ID_PATH, 'public', 'data', `list_${roomPath ? `room_${roomPath}` : `user_${user.uid}`}`), { name: inputValue.trim(), qty: qtyValue.trim(), tag: activeTag || '', completed: false, postponed: false, createdAt: Date.now() });
        setInputValue(''); setQtyValue('');
      };
      const handleQuickSelect = (qa) => { setInputValue(qa.n || qa.name || ''); setActiveTag(qa.t || qa.tag || ''); };
      const handleComplete = async (item) => { await updateDoc(getItemRef(item.id), { completed: !item.completed, postponed: false }); };
      const handlePostpone = async (e, item) => { e.stopPropagation(); await updateDoc(getItemRef(item.id), { postponed: !item.postponed, completed: false }); };
      const savePrice = async (itemName, price, itemTag, itemId) => {
        const prefix = roomPath ? `room_${roomPath}` : `user_${user.uid}`;
        await setDoc(doc(db, 'artifacts', APP_ID_PATH, 'public', 'data', `hist_${prefix}`, itemName), { name: itemName, price: price || '', tag: itemTag || '', updatedAt: Date.now() });
        if (itemId) await updateDoc(getItemRef(itemId), { currentPrice: price || '' });
      };
      const handleAddNewTag = async (tagName, colorIdx, shouldClose = false) => {
        const name = tagName.trim(); if (!name) return;
        if (customTags.some(t => t.n === name)) { setMsg('地點已存在！'); setTimeout(() => setMsg(''), 1000); return; }
        const next = [...customTags, { n: name, c: colorIdx }]; await setDoc(getConfigRef(), { tags: next }, { merge: true });
        if (shouldClose) setModalState({ type: null });
        setMsg('新增成功'); setTimeout(() => setMsg(''), 1000);
      };
      const delTag = async (tagName) => { const next = customTags.filter(tag => tag.n !== tagName); await setDoc(getConfigRef(), { tags: next }, { merge: true }); };
      const handleUpdateBaseId = (newVal) => {
        const val = newVal.trim(); if (!val) return;
        setPersonalBaseId(val); setBaseIdEditValue(val); localStorage.setItem('smart_buy_base_id', val);
        setMsg('ID 已固定'); setTimeout(() => setMsg(''), 1000);
      };
      const clearCompleted = async () => {
        if (!user) return; const toDelete = items.filter(i => i.completed);
        for (const item of toDelete) await deleteDoc(getItemRef(item.id));
        setMsg('已清除完成項目'); setTimeout(() => setMsg(''), 1000);
      };
      const resetAllTagsColor = async () => {
        const next = customTags.map(t => ({ ...t, c: 0 }));
        setCustomTags(next);
        await setDoc(getConfigRef(), { tags: next }, { merge: true });
        setMsg('已還原預設色'); setTimeout(() => setMsg(''), 1000);
      };
      const copyAppUrl = async () => {
        const url = `${window.location.origin}${window.location.pathname}`;
        if (navigator.share) { try { await navigator.share({ title: '智能採買', text: '推薦給妳這個超好用的清單 APP！', url: url }); return; } catch (err) {} }
        const tempIn = document.createElement('input'); tempIn.value = url; document.body.appendChild(tempIn); tempIn.select(); document.execCommand('copy'); document.body.removeChild(tempIn);
        setMsg('網址已複製！'); setTimeout(() => setMsg(''), 2000);
      };
      const copySyncLink = async () => {
        const syncData = { base: personalBaseId, rooms: savedRooms };
        const encoded = btoa(encodeURIComponent(JSON.stringify(syncData)));
        const url = `${window.location.origin}${window.location.pathname}?sync=${encoded}`;
        if (navigator.share) { try { await navigator.share({ title: '智能採買 - 裝備同步', text: '點擊此連結，將妳的 ID 與紀錄同步到新手機！', url: url }); return; } catch (err) {} }
        const tempIn = document.createElement('input'); tempIn.value = url; document.body.appendChild(tempIn); tempIn.select(); document.execCommand('copy'); document.body.removeChild(tempIn);
        setMsg('同步連結已複製！'); setTimeout(() => setMsg(''), 2000);
      };
      const handleForceUpdate = () => {
        setMsg('正在重整載入最新版本...');
        if ('serviceWorker' in navigator) { navigator.serviceWorker.getRegistrations().then(r => { for (let rg of r) rg.unregister(); }); }
        setTimeout(() => { window.location.reload(true); }, 1500);
      };

      const onTouchStartHTag = (e, idx) => {
        touchStartTag.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; isScrollingTag.current = false; dragDidHappenTag.current = false;
        touchTimerTag.current = setTimeout(() => { if (!isScrollingTag.current) { setHDragIdx(idx); setHDragType('tag'); dragDidHappenTag.current = true; if (navigator.vibrate) navigator.vibrate(50); } }, 350);
      };
      const onTouchMoveHTag = (e) => {
        const dx = Math.abs(e.touches[0].clientX - touchStartTag.current.x); const dy = Math.abs(e.touches[0].clientY - touchStartTag.current.y);
        if (hDragIdx === null || hDragType !== 'tag') { if (dx > 10 || dy > 10) { isScrollingTag.current = true; clearTimeout(touchTimerTag.current); } return; }
        e.preventDefault(); const target = document.elementFromPoint(e.touches[0].clientX, e.touches[0].clientY); const dropElem = target?.closest('[data-h-tag-index]');
        if (dropElem) { const overIdx = parseInt(dropElem.getAttribute('data-h-tag-index'), 10); if (overIdx !== hDragOverIdx && overIdx !== hDragIdx) setHDragOverIdx(overIdx); }
      };
      const onTouchEndHTag = async () => {
        clearTimeout(touchTimerTag.current);
        if (hDragIdx !== null && hDragType === 'tag') {

        e.preventDefault(); const target = document.elementFromPoint(e.touches[0].clientX, e.touches[0].clientY); const dropElem = target?.closest('[data-h-quick-index]');

                          <button onClick={copyAppUrl} className="w-full bg-white border-2 border-emerald-500 text-emerald-700 py-3 rounded-xl font-bold active:scale-95 transition-all flex items-center justify-center gap-2 shadow-sm">分享此 APP 給親友</button>
                          <button onClick={() => window.open('https://forms.gle/UVFSXsidHYMMtZwR9', '_blank')} className="w-full bg-white border-2 border-blue-200 text-blue-700 py-3 rounded-xl font-bold active:scale-95 transition-all flex items-center justify-center gap-2 shadow-sm">💬 想跟朵朵說些什麼？</button>
                          <button onClick={() => { setModalState({ type: 'donate' }); }} className="w-full bg-[#FFDD00] text-amber-900 py-2.5 px-4 rounded-xl active:scale-95 transition-all flex flex-col items-center justify-center gap-0.5 shadow-sm mb-2"><div className="flex items-center gap-2 font-bold text-base"><Icons.Coffee size={18} /><span>喜歡這 APP 嗎？</span></div><span className="text-sm font-bold opacity-80">歡迎請我喝杯咖啡</span></button>
                          <button onClick={() => setExpandedSection('')} className="w-full py-2 text-neutral-400 text-[10px] font-bold">收起所有說明 ↑</button>
                        </div>
                      </div>
                    )}

                    {modalState.type === 'room' && (
                      <div className="space-y-6 py-2">
                        {roomPath && (
                          <div className="bg-amber-50 p-4 rounded-2xl border-2 border-amber-200 shadow-md">
                            <p className="text-xs text-amber-700 font-bold mb-3 flex items-center gap-1.5"><Icons.Refresh size={14} className="animate-spin" /> 目前正在連線頻道：</p>
                            <div className="bg-yellow-100 p-4 rounded-xl border-2 border-yellow-400 shadow-inner flex flex-col gap-3">
                              <span className="font-mono font-bold text-amber-900 break-all text-2xl text-center tracking-widest">{roomPath}</span>
                              <button onClick={() => { 
                                const temp = document.createElement('input'); 
                                temp.value = roomPath; 
                                document.body.appendChild(temp); 
                                temp.select(); 
                                document.execCommand('copy'); 
                                document.body.removeChild(temp); 
                                setMsg('代號已複製！'); 
                                setTimeout(() => setMsg(''), 2000); 
                              }} className="w-full bg-amber-500 text-white py-3 rounded-lg text-base font-bold active:scale-95 transition-transform shadow-md border-b-4 border-amber-700 flex items-center justify-center gap-2">📋 複製代號發給親友</button>
                            </div>
                          </div>
                        )}

                        <div className="bg-emerald-50 p-4 rounded-2xl border border-emerald-100">
                          <div className="flex justify-between items-center mb-1"><p className="text-xs text-emerald-700 font-bold tracking-tight">我的個人專屬 ID (基地台代號)</p><button onClick={() => { setIsEditingBaseId(!isEditingBaseId); setBaseIdEditValue(personalBaseId); }} className="text-emerald-500 flex items-center gap-1 text-[10px] bg-white px-2 py-0.5 rounded shadow-sm font-bold active:scale-95"><Icons.Edit size={10} />修改</button></div>
                          {isEditingBaseId ? (
                            <div className="flex flex-col gap-2 mt-2"><input type="text" value={baseIdEditValue} onChange={e => setBaseIdEditValue(e.target.value)} className="w-full p-3 bg-white rounded-xl border-2 border-emerald-200 outline-none font-bold text-center tracking-widest text-emerald-800" /><button onClick={() => { handleUpdateBaseId(baseIdEditValue); setIsEditingBaseId(false); }} className="w-full bg-emerald-600 text-white py-3 rounded-xl shadow-md active:scale-95 flex items-center justify-center gap-1 text-sm font-bold"><Icons.CheckCircle size={16} /> 確定修改並鎖定</button></div>
                          ) : (
                            <><p className="text-xl font-bold tracking-[0.2em] text-emerald-800 break-all">{personalBaseId}</p><button onClick={copySyncLink} className="w-full mt-3 bg-white border border-emerald-200 text-emerald-600 py-2 rounded-lg text-xs font-bold active:scale-95 transition-all shadow-sm flex justify-center items-center gap-1">產出跨機同步連結</button></>
                          )}
                        </div>

                        <div className="pt-4 border-t border-dashed border-neutral-200">
                          <h3 className="text-xs font-bold text-neutral-500 mb-3">輸入新頻道與備註</h3>
                          <div className="space-y-3">
                            <input type="text" id="mRoomCode" placeholder="頻道代號" className="w-full p-3 bg-neutral-100 rounded-xl border-2 border-emerald-100 text-xl text-center font-bold tracking-widest text-emerald-800" />
                            <input type="text" id="mRoomNote" placeholder="備註 (如：個人、公婆、公司)" className="w-full p-3 bg-neutral-100 rounded-xl border-2 border-emerald-100 text-sm font-bold" />
                            <div className="flex gap-2">
                              <button onClick={async () => { try { const text = await navigator.clipboard.readText(); if (text) { document.getElementById('mRoomCode').value = text.trim(); setMsg('已貼上代號！'); setTimeout(() => setMsg(''), 2000); } } catch (err) { setMsg('請手動貼上'); setTimeout(() => setMsg(''), 2000); } }} className="w-1/3 bg-emerald-50 text-emerald-700 py-3 rounded-xl font-bold border border-emerald-200 active:scale-95 shadow-sm flex justify-center items-center gap-1">貼上</button>
                              <button onClick={() => { handleTuneRoom(document.getElementById('mRoomCode').value, document.getElementById('mRoomNote').value); }} className="w-2/3 bg-emerald-700 text-white py-3 rounded-xl font-bold active:scale-95 shadow-lg">連線頻道</button>
                            </div>
                          </div>
                        </div>

                        <div className="bg-blue-50 p-5 rounded-2xl border border-blue-200 mt-2">
                          <p className="text-sm font-bold text-blue-800 mb-3 flex items-center gap-2">📡 實戰應用與連線祕訣</p>
                          <div className="text-[11px] text-blue-700 font-bold space-y-3 leading-relaxed">
                            <p>(1) 如何連線：點選上方「黃色複製代號」傳給親友，對方在下方貼上代號並按「連線」，兩台手機就會像對講機一樣自動同步清單。</p>
                            <div className="w-full h-px bg-blue-100"></div>
                            <p>(2) 烤肉採購：大家分頭去超市，有人買了木炭打勾，其他人手機上的木炭會同步消失，絕不重複買，更省下打電話確認的時間！</p>
                            <p>(3) 切換頻道：一個人可以同時存下 family01、work01 等代號，隨時從下方的歷史紀錄一鍵切換，管理不同領域的瑣事。</p>
                          </div>
                        </div>

                        {savedRooms.length > 0 && (
                          <div className="pt-4">
                            <h3 className="text-xs font-bold text-neutral-500 mb-3 flex items-center gap-1.5"><Icons.History size={14} /> 歷史紀錄 (點選切換)</h3>
                            <div className="space-y-2">{savedRooms.map((room, idx) => ( <div key={idx} onClick={() => handleTuneRoom(room.code, room.note)} className={`flex justify-between items-center p-3 rounded-xl border cursor-pointer transition-all active:scale-95 ${roomPath === room.code ? 'bg-amber-50 border-amber-300 shadow-sm' : 'bg-white border-neutral-200'}`}><div className="flex flex-col"><span className={`font-bold ${roomPath === room.code ? 'text-amber-700' : 'text-neutral-700'}`}>{room.note || '未命名'}</span><span className="text-[10px] text-neutral-400 font-mono italic">{room.code}</span></div><button onClick={(e) => { e.stopPropagation(); const n = savedRooms.filter(r => r.code !== room.code); setSavedRooms(n); localStorage.setItem('smart_buy_saved_rooms', JSON.stringify(n)); if (roomPath === room.code) { setRoomPath(''); localStorage.removeItem('smart_buy_room'); } }} className="p-3 text-neutral-300 hover:text-red-500 active:scale-75 bg-neutral-50 rounded-xl border border-neutral-100"><Icons.Trash size={18} /></button></div> ))}</div>
                          </div>
                        )}
                      </div>
                    )}

                    {modalState.type === 'manageTag' && (
                      <div className="flex flex-col h-full">
                        <div className="flex flex-col gap-3 mb-4 shrink-0 bg-emerald-50 p-4 rounded-2xl border border-emerald-100">
                          <div className="flex justify-between items-center mb-1">
                            <p className="text-xs font-bold text-emerald-700">快速新增地點與顏色</p>
                            <button onClick={resetAllTagsColor} className="text-[10px] bg-white px-2 py-1 rounded border border-emerald-200 text-emerald-600 font-bold active:scale-90 shadow-sm">一鍵還原翠綠色</button>
                          </div>
                          <input type="text" id="mAddTag" placeholder="地點名稱..." className="w-full p-3 rounded-lg border border-emerald-200 outline-none text-base font-bold bg-white" />
                          <div className="flex gap-2 items-center overflow-x-auto scrollbar-hide py-1">
                            {PRESET_COLORS.map((color, i) => (
                              <button key={i} onClick={() => setModalColorIdx(i)} className={`shrink-0 w-8 h-8 rounded-full border-2 transition-transform ${modalColorIdx === i ? 'border-neutral-800 scale-125 shadow-md' : 'border-transparent'}`} style={{ backgroundColor: color.bg }}></button>
                            ))}
                          </div>
                          <button onClick={() => { const v = document.getElementById('mAddTag').value; if (v) { handleAddNewTag(v, modalColorIdx, false); document.getElementById('mAddTag').value = ''; } }} className="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold active:scale-95 shadow-md">新增地點</button>
                        </div>
                        <div className="overflow-y-auto space-y-2 py-2 flex-1 scrollbar-hide" onTouchMove={(e) => onVMove(e, 'data-v-tag-index')}>
                          {customTags.map((item, idx) => (
                            <div key={idx} data-v-tag-index={idx} className={`flex justify-between items-center p-2 rounded-xl border transition-all ${vDragIdx === idx ? 'opacity-40 scale-95 shadow-inner' : ''}`} style={getTagInlineStyles(item.n)}>
                              <div className="flex items-center gap-2 flex-1">
                                <div className="p-3 text-neutral-400 drag-handle" onTouchStart={() => onVStart(idx)} onTouchEnd={() => onVEnd('tag')} onTouchCancel={() => onVEnd('tag')}><Icons.GripVertical /></div>
                                <div className="flex flex-col">
                                  <span className="font-bold text-sm">{item.n}</span>
                                  <div className="flex gap-1 mt-1">
                                    {PRESET_COLORS.map((c, ci) => (
                                      <div key={ci} onClick={async () => { const next = [...customTags]; next[idx].c = ci; setCustomTags(next); await setDoc(getConfigRef(), { tags: next }, { merge: true }); }} className={`w-3.5 h-3.5 rounded-full border border-black/5 ${item.c === ci ? 'ring-1 ring-black' : ''}`} style={{ backgroundColor: c.bg }} />
                                    ))}
                                  </div>
                                </div>
                              </div>
                              <button onClick={() => delTag(item.n)} className="p-3 active:scale-75 opacity-50 hover:opacity-100"><Icons.Trash size={18} /></button>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                    
                    {modalState.type === 'manageQuick' && (
                      <div className="flex flex-col h-full">
                        <div className="flex flex-col gap-3 mb-4 shrink-0 bg-amber-50 p-4 rounded-2xl border border-amber-100">
                          <p className="text-xs font-bold text-amber-700">快速新增常用品項</p>
                          <input type="text" id="mAddQuick" placeholder="物品名稱..." className="w-full p-3 rounded-lg border border-amber-200 outline-none text-base font-bold bg-white" />
                          <div className="flex gap-2">
                            <select id="mAddQuickTag" className="flex-1 min-w-0 p-3 bg-white rounded-lg border border-amber-200 font-bold text-base outline-none text-neutral-700">
                              <option value="">無預設地點</option>
                              {customTags.map(t => <option key={t.n} value={t.n}>{t.n}</option>)}
                            </select>
                            <button onClick={() => { const n = document.getElementById('mAddQuick').value; const t = document.getElementById('mAddQuickTag').value; if (n) { handleAddNewQuick(n, t, false); document.getElementById('mAddQuick').value = ''; } }} className="shrink-0 bg-amber-600 text-white px-5 rounded-lg font-bold active:scale-95 shadow-md">新增</button>
                          </div>
                        </div>
                        <div className="overflow-y-auto space-y-2 py-2 flex-1 scrollbar-hide" onTouchMove={(e) => onVMove(e, 'data-v-quick-index')}>
                          {quickItems.map((item, idx) => (
                            <div key={idx} data-v-quick-index={idx} className={`flex justify-between items-center p-2 rounded-xl border transition-all ${vDragIdx === idx ? 'opacity-40 scale-95 shadow-inner' : 'border-neutral-100 bg-neutral-50'}`}>
                              <div className="flex items-center gap-2 flex-1">
                                <div className="p-3 text-neutral-400 drag-handle" onTouchStart={() => onVStart(idx)} onTouchEnd={() => onVEnd('quick')} onTouchCancel={() => onVEnd('quick')}><Icons.GripVertical /></div>
                                <span className="font-bold text-sm">{item.n || item.name}</span>
                              </div>
                              <button onClick={() => delQuick(idx)} className="p-3 active:scale-75 opacity-40 hover:opacity-100"><Icons.Trash size={18} /></button>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                    
                    {modalState.type === 'editQty' && modalState.data && (
                      <div className="space-y-4 py-2">
                        <div className="text-center mb-1"><span className="text-base font-bold text-emerald-800 bg-emerald-100 px-4 py-1.5 rounded-full tracking-wide shadow-sm">📝 {modalState.data.name}</span></div>
                        <input type="text" value={modalInput} onChange={e => setModalInput(e.target.value)} placeholder="輸入數量與單位..." className="w-full p-4 rounded-xl border-2 border-emerald-100 outline-none text-xl font-bold text-center" />
                        <div className="flex gap-2">
                          <button onClick={async () => { await updateDoc(getItemRef(modalState.data.id), { qty: '' }); setModalState({ type: null }); }} className="flex-1 bg-neutral-100 text-neutral-500 py-3 rounded-xl font-bold active:scale-95 transition-transform">清除</button>
                          <button onClick={async () => { await updateDoc(getItemRef(modalState.data.id), { qty: modalInput }); setModalState({ type: null }); }} className="flex-[2] bg-emerald-600 text-white py-3 rounded-xl font-bold text-lg shadow-lg active:scale-95 transition-transform">確定更新</button>
                        </div>
                      </div>
                    )}
                    {modalState.type === 'recordingPrice' && modalState.data && (
                      <div className="space-y-4 py-2">
                        <div className="text-center mb-1"><span className="text-base font-bold text-amber-900 bg-[#FFDD00] px-4 py-1.5 rounded-full shadow-sm">💰 {modalState.data.name}</span></div>
                        <input type="number" value={modalInput} onChange={e => setModalInput(e.target.value)} placeholder="輸入購買金額..." className="w-full p-4 rounded-xl border-2 border-emerald-100 outline-none text-xl font-bold text-center" />
                        <button onClick={async () => { await savePrice(modalState.data.name, modalInput, modalState.data.tag, modalState.data.id); setModalState({ type: null }); }} className="w-full bg-emerald-700 text-white py-4 rounded-xl font-bold shadow-lg active:scale-95 transition-transform">確定紀錄</button>
                      </div>
                    )}
                    {modalState.type === 'editingTag' && modalState.data && (
                      <div className="flex flex-col gap-3 py-2">
                        <div className="text-center mb-1"><span className="text-base font-bold text-emerald-800 bg-emerald-100 px-4 py-1.5 rounded-full tracking-wide shadow-sm">📍 {modalState.data.name}</span></div>
                        <div className="grid grid-cols-2 gap-2">
                          {customTags.map(t => ( 
                            <button key={t.n} onClick={async () => { await updateDoc(getItemRef(modalState.data.id), { tag: t.n }); setModalState({ type: null }); }} className={`py-3 rounded-xl font-bold text-sm border shadow-sm ${modalState.data.tag === t.n ? 'brightness-90 scale-95 border-black/20' : ''}`} style={getTagInlineStyles(t.n)}>{t.n}</button> 
                          ))}
                          <button onClick={async () => { await updateDoc(getItemRef(modalState.data.id), { tag: '' }); setModalState({ type: null }); }} className="py-3 rounded-xl font-bold text-sm border bg-neutral-100 text-neutral-400">無地點</button>
                        </div>
                      </div>
                    )}
                    {modalState.type === 'donate' && (
                      <div className="space-y-4 py-2 text-center">
                        <div className="bg-amber-50 p-4 rounded-2xl border border-amber-100">
                          <p className="text-sm text-amber-800 font-bold mb-2 leading-relaxed">謝謝妳的心意！ 🥰<br /></p>
                          <div className="inline-block bg-amber-500 text-white text-xs px-3 py-1 rounded-full font-bold mb-2 shadow-sm">☕ 一杯咖啡 $50(杯數隨喜)</div>
                        </div>
                        <div className="bg-neutral-50 p-4 rounded-xl border border-neutral-100 space-y-3">
                          <p className="text-sm font-bold text-neutral-700 tracking-wider">永豐銀行 (807)<br />204-018-0025253-1</p>
                          <button onClick={() => { const temp = document.createElement('input'); temp.value = '20401800252531'; document.body.appendChild(temp); temp.select(); document.execCommand('copy'); document.body.removeChild(temp); setMsg('帳號已複製！'); setTimeout(() => setMsg(''), 2000); }} className="w-full bg-amber-500 text-white py-4 rounded-xl text-base font-bold active:scale-95 transition-all shadow-lg flex justify-center items-center gap-2">📋 一鍵複製帳號</button>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    };
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
