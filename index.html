<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <!-- 智能採買 v1.1.21 (視力友善與穩定強化版) by 朵朵 -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
  <title>智能採買</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="智能採買">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&display=swap');
    .scrollbar-hide::-webkit-scrollbar{display:none;}
    .scrollbar-hide{-ms-overflow-style:none;scrollbar-width:none;}
    @keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
    .animate-slide-up{animation:slideUp 0.3s ease-out;}
    @keyframes pulse-slow{0%,100%{opacity:1;}50%{opacity:0.5;}}
    .animate-pulse-slow{animation:pulse-slow 2s cubic-bezier(0.4,0,0.6,1) infinite;}
    @keyframes subtle-bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-2px);}}
    .animate-subtle-bounce{animation:subtle-bounce 2s ease-in-out infinite;}
    input:focus{font-size:16px!important;}
    .font-serif-tc{font-family:'Noto Serif TC',serif;}
    html,body{position:fixed;inset:0;width:100vw;height:100dvh;overflow:hidden;overscroll-behavior:none;background-color:#047857;-webkit-tap-highlight-color:transparent;}
    #root{width:100%;height:100%;background-color:#f5f5f5;display:flex;justify-content:center;}
    
    /* 拖曳強化：絕對禁止選取文字與系統選單 */
    .drag-handle{cursor:move;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
    .draggable-pill{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
    
    .tag-neutral { background-color: #f9fafb; color: #374151; border-color: #d1d5db; }
    
    .btn-capsule-tactical {
      background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
      color: #065f46;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      border: 1.5px solid #10b981;
      -webkit-user-select:none;user-select:none;
    }
    .btn-capsule-tactical:active {
      transform: scale(0.96);
      background: #bbf7d0;
    }

    /* 顏色圓圈：移除黑框，改用白色內環標示選取 */
    .color-ring-active {
      transform: scale(1.1);
      box-shadow: inset 0 0 0 4px #fff, 0 0 0 3px currentColor;
    }
  </style>
</head>
<body class="antialiased font-sans">
  <div id="root">
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;width:100%;background:#f5f5f5;color:#047857;font-family:sans-serif;">
      <div style="width:40px;height:40px;border:4px solid #ecfdf5;border-top:4px solid #047857;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px;"></div>
      <p style="font-weight:bold;letter-spacing:2px;font-size:16px;">智能採買 啟動中...</p>
      <style>@keyframes spin{to{transform:rotate(360deg);}}</style>
    </div>
  </div>

  <script type="text/babel" data-type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, setDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    const { useState, useEffect, useRef, useMemo } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyC36SqZOaZR3iYfMMDg5NQlADKdwEaZ5bk",
      authDomain: "smart-buy-dbaae.firebaseapp.com",
      projectId: "smart-buy-dbaae",
      storageBucket: "smart-buy-dbaae.firebasestorage.app",
      messagingSenderId: "176643347488",
      appId: "1:176643347488:web:182ef57838ae4358e4d845",
      measurementId: "G-7E04LF7E9P"
    };
    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const APP_ID_PATH = "smart-buy-final";
    
    // 擴充顏色選項至 12 種
    const PRESET_COLORS = [
      { bg: '#ecfdf5', text: '#065f46', border: '#10b981' }, // 0: 翠綠
      { bg: '#eff6ff', text: '#1e40af', border: '#3b82f6' }, // 1: 寶藍
      { bg: '#f5f3ff', text: '#5b21b6', border: '#8b5cf6' }, // 2: 紫色
      { bg: '#fffbeb', text: '#92400e', border: '#f59e0b' }, // 3: 琥珀
      { bg: '#fff1f2', text: '#9f1239', border: '#f43f5e' }, // 4: 玫瑰
      { bg: '#ecfeff', text: '#155e75', border: '#06b6d4' }, // 5: 靛藍
      { bg: '#fdf2f8', text: '#9d174d', border: '#ec4899' }, // 6: 粉紅
      { bg: '#f0fdf4', text: '#166534', border: '#22c55e' }, // 7: 亮綠
      { bg: '#faf5ff', text: '#6b21a8', border: '#a855f7' }, // 8: 紫紅
      { bg: '#fff7ed', text: '#9a3412', border: '#f97316' }, // 9: 橘色
      { bg: '#f8fafc', text: '#334155', border: '#64748b' }, // 10: 灰藍
      { bg: '#fdf4ff', text: '#86198f', border: '#d946ef' }, // 11: 霓虹紫
    ];

    const DEFAULT_TAGS = [
      { n: '全聯', c: 1 },
      { n: '郵局', c: 0 },
      { n: '菜市場', c: 2 },
      { n: '其它', c: 6 }
    ];
    const DEFAULT_QUICK = [{ n: '雞蛋', t: '全聯' }];

    const generateId = (len = 4) => {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let res = '';
      for (let i = 0; i < len; i++) res += chars.charAt(Math.floor(Math.random() * chars.length));
      return res;
    };

    // 完整的圖示物件，修復遺漏導致的當機
    const Icons = {
      Cart: ({size=22}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>,
      Plus: ({size=20}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
      Trash: ({size=20}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>,
      Check: ({size=20}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><polyline points="20 6 9 17 4 12"/></svg>,
      Clock: ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
      Copy: ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>,
      Share: ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8m-4-6-4-4-4 4m4-4v13"/></svg>,
      Settings: ({size=18}) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor" style={{ display: 'block' }}><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12c0,0.33,0.02,0.64,0.07,0.94l-2.03,1.58c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
      ),
      X: ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
      ChevronDown: ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="m6 9 6 6 6-6"/></svg>,
      ChevronUp: ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="m18 15-6-6-6 6"/></svg>,
      GripVertical: ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><circle cx="9" cy="12" r="1.5"></circle><circle cx="9" cy="6" r="1.5"></circle><circle cx="9" cy="18" r="1.5"></circle><circle cx="15" cy="12" r="1.5"></circle><circle cx="15" cy="6" r="1.5"></circle><circle cx="15" cy="18" r="1.5"></circle></svg>,
      Info: ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>,
      Edit: ({size=16}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
      CheckCircle: ({size=16}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"/></svg>,
      Smartphone: ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><path d="M12 18h.01"/></svg>,
      Coffee: ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" y1="2" x2="6" y2="4"/><line x1="10" y1="2" x2="10" y2="4"/><line x1="14" y1="2" x2="14" y2="4"/></svg>,
      BookOpen: ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>,
      Refresh: ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
    };

    const App = () => {
      const [user, setUser] = useState(null);
      const [items, setItems] = useState([]);
      const [history, setHistory] = useState({});
      const [customTags, setCustomTags] = useState(DEFAULT_TAGS);
      const [quickItems, setQuickItems] = useState(DEFAULT_QUICK);
      const [personalBaseId, setPersonalBaseId] = useState(() => {
        try { return localStorage.getItem('smart_buy_base_id') || generateId(); }
        catch(e) { return generateId(); }
      });
      const [inputValue, setInputValue] = useState('');
      const [qtyValue, setQtyValue] = useState('');
      const [activeTag, setActiveTag] = useState('');
      const [filterTag, setFilterTag] = useState('全部');
      const [isShoppingMode, setIsShoppingMode] = useState(false);
      const [roomPath, setRoomPath] = useState(() => {
        try { return localStorage.getItem('smart_buy_room') || ''; }
        catch(e) { return ''; }
      });
      const [modalState, setModalState] = useState({ type: null, data: null });
      const [msg, setMsg] = useState('');
      const [isLoading, setIsLoading] = useState(true);
      const [expandedSection, setExpandedSection] = useState('');
      const [modalInput, setModalInput] = useState('');
      const [modalColorIdx, setModalColorIdx] = useState(0);
      const [baseIdEditValue, setBaseIdEditValue] = useState(personalBaseId);
      const [isEditingBaseId, setIsEditingBaseId] = useState(false);
      const [roomPrefix, setRoomPrefix] = useState(personalBaseId);
      const [roomSuffix, setRoomSuffix] = useState('');
      
      const [vDragIdx, setVDragIdx] = useState(null);
      const [vDragOverIdx, setVDragOverIdx] = useState(null);
      const [hDragType, setHDragType] = useState(null);
      const [hDragIdx, setHDragIdx] = useState(null);
      const [hDragOverIdx, setHDragOverIdx] = useState(null);
      
      const dragDidHappen = useRef(false);
      const touchTimer = useRef(null);
      const touchStartPos = useRef({ x: 0, y: 0 });
      const isScrolling = useRef(false);

      const getTagConfig = (tagName) => {
        const found = customTags.find(t => t.n === tagName);
        if (found && found.c !== undefined) return PRESET_COLORS[found.c] || PRESET_COLORS[0];
        return null;
      };

      const getTagInlineStyles = (tagName, opacity = 1) => {
        const cfg = getTagConfig(tagName);
        if (!cfg) return {};
        return { backgroundColor: opacity < 1 ? `${cfg.bg}cc` : cfg.bg, color: cfg.text, borderColor: cfg.border };
      };
      
      const [savedRooms, setSavedRooms] = useState(() => {
        try {
          const raw = localStorage.getItem('smart_buy_saved_rooms');
          if (!raw) return [];
          const parsed = JSON.parse(raw);
          return parsed.map(r => (typeof r === 'string' ? { code: r, note: '' } : r)).filter(r => r && r.code);
        } catch (e) { return []; }
      });
      
      const headerRoomTitle = useMemo(() => {
        if (!roomPath) return '進入頻道';
        const saved = savedRooms.find(r => r.code === roomPath);
        if (saved && saved.note) return saved.note;
        const parts = roomPath.split('-');
        return parts.length > 1 ? parts[1] : roomPath;
      }, [roomPath, savedRooms]);
      
      const dynamicFilterTags = useMemo(() => {
        const tagsInUse = Array.from(new Set(items.map(item => item.tag))).filter(t => t && t !== '');
        return ['全部', ...customTags.filter(tag => tagsInUse.includes(tag.n)).map(t => t.n)];
      }, [items, customTags]);

      useEffect(() => {
        onAuthStateChanged(auth, u => {
          if (u) setUser(u);
          else signInAnonymously(auth).catch(console.error);
        });
        try { localStorage.setItem('smart_buy_base_id', personalBaseId); } catch(e){}
      }, [personalBaseId]);

      useEffect(() => {
        if (!user) return;
        setIsLoading(true);
        const prefix = roomPath ? `room_${roomPath}` : `user_${user.uid}`;
        const unsubItems = onSnapshot(query(collection(db, 'artifacts', APP_ID_PATH, 'public', 'data', `list_${prefix}`), orderBy('createdAt', 'desc')), snap => {
          setItems(snap.docs.map(d => ({ id: d.id, ...d.data() })));
          setIsLoading(false);
        }, (err) => setIsLoading(false));
        const unsubHist = onSnapshot(collection(db, 'artifacts', APP_ID_PATH, 'public', 'data', `hist_${prefix}`), snap => {
          const h = {};
          snap.docs.forEach(d => { const data = d.data(); h[data.name] = data; });
          setHistory(h);
        });
        const unsubConfig = onSnapshot(doc(db, 'artifacts', APP_ID_PATH, 'public', 'data', `config_${prefix}`, 'settings'), snap => {
          if (snap.exists()) {
            const data = snap.data();
            if (data.tags) {
              const fixedTags = data.tags.map(t => typeof t === 'string' ? { n: t, c: 0 } : t);
              setCustomTags(fixedTags);
            }
            if (data.quick) setQuickItems(data.quick.filter(q => q && (q.n || q.name)));
          } else {
            setDoc(snap.ref, { tags: DEFAULT_TAGS, quick: DEFAULT_QUICK });
          }
        });
        return () => { unsubItems(); unsubHist(); unsubConfig(); };
      }, [user, roomPath]);
      
      const getConfigRef = () => doc(db, 'artifacts', APP_ID_PATH, 'public', 'data', `config_${roomPath ? `room_${roomPath}` : `user_${user.uid}`}`, 'settings');
      const getItemRef = (id) => doc(db, 'artifacts', APP_ID_PATH, 'public', 'data', `list_${roomPath ? `room_${roomPath}` : `user_${user.uid}`}`, id);
      
      const handleAdd = async (e) => {
        if (e) e.preventDefault();
        if (!inputValue.trim() || !user) return;
        await addDoc(collection(db, 'artifacts', APP_ID_PATH, 'public', 'data', `list_${roomPath ? `room_${roomPath}` : `user_${user.uid}`}`), { name: inputValue.trim(), qty: qtyValue.trim(), tag: activeTag || '', completed: false, postponed: false, createdAt: Date.now() });
        setInputValue(''); setQtyValue('');
      };
      const handleQuickSelect = (qa) => { setInputValue(qa.n || qa.name || ''); setActiveTag(qa.t || qa.tag || ''); };
      const handleComplete = async (item) => { await updateDoc(getItemRef(item.id), { completed: !item.completed, postponed: false }); };
      const handlePostpone = async (e, item) => { e.stopPropagation(); await updateDoc(getItemRef(item.id), { postponed: !item.postponed, completed: false }); };
      
      const savePrice = async (itemName, price, itemTag, itemId) => {
        const prefix = roomPath ? `room_${roomPath}` : `user_${user.uid}`;
        await setDoc(doc(db, 'artifacts', APP_ID_PATH, 'public', 'data', `hist_${prefix}`, itemName), { name: itemName, price: price || '', tag: itemTag || '', updatedAt: Date.now() });
        if (itemId) await updateDoc(getItemRef(itemId), { currentPrice: price || '' });
      };

      const handleAddNewTag = async (tagName, colorIdx, shouldClose = false) => {
        const name = tagName.trim(); if (!name) return;
        if (customTags.some(t => t.n === name)) { setMsg('地點已存在！'); setTimeout(() => setMsg(''), 1000); return; }
        const next = [...customTags, { n: name, c: colorIdx }]; await setDoc(getConfigRef(), { tags: next }, { merge: true });
        if (shouldClose) setModalState({ type: null });
        setMsg('新增成功'); setTimeout(() => setMsg(''), 1000);
      };
      const delTag = async (tagName) => { const next = customTags.filter(tag => tag.n !== tagName); await setDoc(getConfigRef(), { tags: next }, { merge: true }); };
      
      const handleTuneRoomAttempt = async (prefix, suffix, note = '') => {
        try {
          const p = prefix.trim();
          const s = suffix.trim();
          if (!p && !s) { handleTuneRoom('', ''); return; }
          const finalPath = (p && s) ? `${p}-${s}` : (p || s);
          const listRef = collection(db, 'artifacts', APP_ID_PATH, 'public', 'data', `list_room_${finalPath}`);
          const snap = await getDocs(listRef);
          if (!snap.empty && !savedRooms.some(r => r.code === finalPath)) {
            setModalState({ type: 'channelConflict', data: { code: finalPath, note, count: snap.size } });
          } else {
            handleTuneRoom(finalPath, note);
          }
        } catch(e) {
          setMsg('連線發生錯誤'); setTimeout(() => setMsg(''), 2000);
        }
      };

      const handleTuneRoom = (code, note = '') => {
        const c = code.trim(); if (!c) { setRoomPath(''); try{localStorage.removeItem('smart_buy_room');}catch(e){} setModalState({ type: null }); return; }
        setRoomPath(c); try{localStorage.setItem('smart_buy_room', c);}catch(e){}
        setSavedRooms(prev => {
          const next = [{ code: c, note: note || '' }, ...prev.filter(r => r.code !== c)];

      const resetAllTagsColor = async () => {

        setMsg('重整中...');

        setTimeout(() => { window.location.reload(true); }, 1500);

      const onTouchStartH = (e, idx, type) => {
        touchStartPos.current = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        isScrolling.current = false; dragDidHappen.current = false;
        touchTimer.current = setTimeout(() => {
          if (!isScrolling.current) {
            setHDragIdx(idx); setHDragType(type); dragDidHappen.current = true;
            if (navigator.vibrate) navigator.vibrate(40);
          }
        }, 400);
      };
      const onTouchMoveH = (e, attr) => {
        const dx = Math.abs(e.touches[0].clientX - touchStartPos.current.x);
        const dy = Math.abs(e.touches[0].clientY - touchStartPos.current.y);
        if (hDragIdx === null) { if (dx > 8 || dy > 8) { isScrolling.current = true; clearTimeout(touchTimer.current); } return; }
        e.preventDefault();
        const target = document.elementFromPoint(e.touches[0].clientX, e.touches[0].clientY);
        const dropElem = target?.closest(`[${attr}]`);
        if (dropElem) {
          const overIdx = parseInt(dropElem.getAttribute(attr), 10);
          if (overIdx !== hDragOverIdx) setHDragOverIdx(overIdx);
        }
      };
      const onTouchEndH = async (type) => {
        clearTimeout(touchTimer.current);
        if (hDragIdx !== null && hDragOverIdx !== null && hDragIdx !== hDragOverIdx) {
          if (type === 'tag') {
            const next = [...customTags]; const [moved] = next.splice(hDragIdx, 1); next.splice(hDragOverIdx, 0, moved);

            const next = [...quickItems]; const [moved] = next.splice(hDragIdx, 1); next.splice(hDragOverIdx, 0, moved);

          }
        }
        setHDragIdx(null); setHDragOverIdx(null); setHDragType(null);
      };

      const onVMove = (e, attr) => {

        const dropElem = target?.closest(`[${attr}]`);

      };

                          <button onClick={copyAppUrl} className="w-full bg-white border-2 border-emerald-500 text-emerald-700 py-4 rounded-2xl font-bold active:scale-95 text-base flex items-center justify-center gap-2 shadow-sm">分享 APP 給親友</button>
                          <button onClick={() => window.open('https://forms.gle/UVFSXsidHYMMtZwR9', '_blank')} className="w-full bg-white border-2 border-blue-200 text-blue-700 py-4 rounded-2xl font-bold active:scale-95 text-base shadow-sm">💬 給朵朵建議</button>
                          <button onClick={() => setModalState({ type: 'donate' })} className="w-full bg-[#FFDD00] text-amber-900 py-4 px-4 rounded-2xl active:scale-95 shadow-md font-bold text-lg flex flex-col items-center"><div>喜歡這 APP 嗎？ 歡迎請我喝咖啡</div></button>
                        </div>
                      </div>
                    )}

                    {modalState.type === 'room' && (
                      <div className="space-y-6 py-2 px-1">
                        {savedRooms.length > 0 && (
                          <div className="space-y-3 font-bold">
                            <h3 className="text-lg font-bold text-neutral-600 flex items-center gap-2 px-1"><Icons.History size={20}/> 頻道列表 (點選切換)</h3>
                            <div className="space-y-2.5">
                              {savedRooms.map((room, idx) => (
                                <div key={idx} onClick={() => handleTuneRoom(room.code, room.note)} className={`flex items-center gap-3 p-4 rounded-2xl border-2 transition-all active:scale-95 ${roomPath === room.code ? 'bg-amber-50 border-amber-400 shadow-md' : 'bg-white border-neutral-200 shadow-sm'}`}>
                                  <div className="flex flex-col flex-1 min-w-0">
                                    <span className={`font-bold text-lg truncate ${roomPath === room.code ? 'text-amber-800' : 'text-neutral-800'}`}>{room.note || '未命名'}</span>
                                    <span className="text-[10px] text-neutral-400 font-mono italic truncate">{room.code}</span>
                                  </div>
                                  <button onClick={(e) => {
                                    e.stopPropagation();
                                    const temp = document.createElement('input'); temp.value = room.code; document.body.appendChild(temp); temp.select(); document.execCommand('copy'); document.body.removeChild(temp);
                                    setMsg('代號已複製！'); setTimeout(() => setMsg(''), 2000);
                                  }} className="bg-[#FFDD00] text-amber-900 p-2.5 rounded-lg active:scale-90 shadow-sm border border-amber-400" title="複製代號"><Icons.Copy size={22}/></button>
                                  <button onClick={(e) => {
                                    e.stopPropagation();
                                    const n = savedRooms.filter(r => r.code !== room.code); setSavedRooms(n); try{localStorage.setItem('smart_buy_saved_rooms', JSON.stringify(n));}catch(e){}
                                    if (roomPath === room.code) { setRoomPath(''); try{localStorage.removeItem('smart_buy_room');}catch(e){} }
                                  }} className="p-2.5 text-neutral-300 active:scale-90 bg-neutral-50 rounded-lg border border-neutral-100"><Icons.Trash size={22}/></button>
                                </div>
                              ))}
                            </div>
                          </div>
                        )}

                        <div className="bg-emerald-50 p-5 rounded-2xl border-2 border-emerald-100 shadow-inner text-center">
                          <div className="flex justify-between items-center mb-2 font-bold"><p className="text-sm font-bold text-emerald-800">🪪 個人 ID (基地台號碼)</p><button onClick={() => { setIsEditingBaseId(!isEditingBaseId); setBaseIdEditValue(personalBaseId); }} className="text-emerald-600 flex items-center gap-1 text-xs bg-white px-3 py-1 rounded shadow-sm font-bold active:scale-95"><Icons.Edit size={14}/>修改</button></div>
                          {isEditingBaseId ? (
                            <div className="flex flex-col gap-2"><input type="text" value={baseIdEditValue} onChange={e => setBaseIdEditValue(e.target.value)} className="w-full p-3 bg-white rounded-xl border-2 border-emerald-300 text-xl text-center font-bold outline-none" /><button onClick={() => { handleUpdateBaseId(baseIdEditValue); setIsEditingBaseId(false); }} className="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold shadow-md text-xl active:scale-95"><Icons.CheckCircle size={20} className="inline mr-1" /> 確定並鎖定</button></div>
                          ) : (
                            <p className="text-3xl font-bold tracking-[0.2em] text-emerald-900 break-all">{personalBaseId}</p>
                          )}
                        </div>

                        <div className="pt-6 border-t border-dashed border-neutral-300">
                          <h3 className="text-xl font-bold text-neutral-700 mb-3 px-1 font-serif-tc">連線新頻道</h3>
                          <div className="space-y-4">
                            <div className="flex items-center gap-2">
                               <input type="text" value={roomPrefix} onChange={e => setRoomPrefix(e.target.value)} className="w-2/5 p-4 bg-neutral-100 rounded-xl border-2 border-emerald-100 text-lg text-center font-bold tracking-wider text-emerald-900 outline-none shadow-inner" placeholder="ID" />
                               <span className="text-emerald-300 font-bold text-xl">-</span>
                               <input type="text" value={roomSuffix} onChange={e => setRoomSuffix(e.target.value)} className="flex-1 p-4 bg-white rounded-xl border-2 border-emerald-200 text-lg text-center font-bold tracking-wider text-emerald-900 outline-none shadow-sm" placeholder="名稱" />
                            </div>
                            <input type="text" id="mRoomNote" placeholder="頻道備註 (如：全家用、公司)" className="w-full p-4 bg-neutral-100 rounded-xl border-2 border-emerald-100 text-base font-bold outline-none" />
                            <div className="flex gap-2">
                              <button onClick={async () => { 
                                try { const text = await navigator.clipboard.readText(); if (text) { if (text.includes('-')) { const [p, s] = text.split('-'); setRoomPrefix(p); setRoomSuffix(s); } else { setRoomSuffix(text); } } } 
                                catch (err) { setMsg('請手動輸入'); setTimeout(() => setMsg(''), 2000); } 
                              }} className="w-1/3 bg-emerald-50 text-emerald-800 py-4 rounded-xl font-bold border border-emerald-200 active:scale-95 text-lg">貼上</button>
                              <button onClick={() => handleTuneRoomAttempt(roomPrefix, roomSuffix, document.getElementById('mRoomNote').value)} className="w-2/3 bg-emerald-700 text-white py-4 rounded-xl font-bold active:scale-95 text-lg shadow-lg">連線頻道</button>
                            </div>
                          </div>
                        </div>

                        <div className="bg-blue-50 p-5 rounded-2xl border-2 border-blue-200 mt-2 font-bold leading-relaxed shadow-sm">
                          <p className="text-lg font-bold text-blue-900 mb-3">📡 快速連線步驟：</p>
                          <div className="text-sm text-blue-800 space-y-3 font-bold leading-relaxed">
                            <p>1. 點選頻道列表的黃色 <Icons.Copy size={16} className="inline"/> 按鈕複製代號。</p>
                            <p>2. 把代號傳給家人 (例如用 LINE 傳送)。</p>
                            <p>3. 家人連線代號後，全家就能同步採買。</p>
                            <div className="pt-4 border-t border-blue-100">
                              <button onClick={copyAppUrl} className="w-full bg-blue-600 text-white py-3.5 rounded-xl flex items-center justify-center gap-2 active:scale-95 shadow-md text-base">
                                <Icons.Share size={20}/> 分享 APP 連結給親友
                              </button>
                            </div>
                          </div>
                        </div>
                      </div>
                    )}

                    {modalState.type === 'manageTag' && (
                      <div className="flex flex-col h-full gap-4 px-1 font-bold">
                        <div className="flex flex-col gap-3 mb-4 shrink-0 bg-emerald-50 p-4 rounded-2xl border-2 border-emerald-100 shadow-sm relative">
                          <div className="flex justify-between items-center mb-1">
                            <p className="text-lg font-bold text-emerald-900">新增地點與顏色</p>
                            <button onClick={resetAllTagsColor} className="text-xs bg-white px-2 py-1 rounded-lg border border-emerald-300 text-emerald-700 font-bold active:scale-90">一鍵還原</button>
                          </div>
                          <input type="text" id="mAddTag" placeholder="地點名稱..." className="w-full p-4 rounded-xl border-2 border-emerald-200 outline-none text-xl font-bold bg-white" />
                          <div className="flex gap-3 items-center overflow-x-auto scrollbar-hide py-1 px-1">
                            {PRESET_COLORS.map((color, i) => (
                              <button key={i} onClick={() => setModalColorIdx(i)} className={`shrink-0 w-11 h-11 rounded-full border-2 transition-all ${modalColorIdx === i ? 'color-ring-active' : 'border-black/5'}`} style={{ backgroundColor: color.bg, color: color.border }}></button>
                            ))}
                          </div>
                          <button onClick={() => { const v = document.getElementById('mAddTag').value; if (v) { handleAddNewTag(v, modalColorIdx, false); document.getElementById('mAddTag').value = ''; } }} className="w-full bg-emerald-700 text-white py-4 rounded-xl font-bold text-xl active:scale-95 shadow-md">新增地點</button>
                        </div>
                        <div className="space-y-3 pb-10 px-1 font-bold" onTouchMove={(e) => onVMove(e, 'data-v-tag-idx')}>
                          <p className="text-sm font-bold text-neutral-500 px-1">已存地點 (長按圖示拖曳)：</p>
                          {customTags.map((item, idx) => (
                            <div key={idx} data-v-tag-idx={idx} className={`flex justify-between items-center p-3 rounded-2xl border-2 shadow-sm transition-all ${vDragIdx === idx ? 'opacity-40 scale-95' : ''}`} style={getTagInlineStyles(item.n)}>
                              <div className="flex items-center gap-3 flex-1 min-w-0">
                                <div className="p-3 text-neutral-500 drag-handle" onTouchStart={(e) => onVStart(idx)} onTouchEnd={() => onVEnd('tag')} onTouchCancel={() => onVEnd('tag')}><Icons.GripVertical size={20}/></div>
                                <div className="flex flex-col flex-1 min-w-0">
                                  <span className="font-bold text-2xl truncate" onClick={() => { setModalColorIdx(item.c); document.getElementById('mAddTag').value = item.n; }}>{item.n}</span>
                                  <div className="flex gap-2.5 mt-2 overflow-x-auto scrollbar-hide py-1 px-1">
                                    {PRESET_COLORS.map((c, ci) => (
                                      <div key={ci} onClick={async () => { const next = [...customTags]; next[idx].c = ci; setCustomTags(next); await setDoc(getConfigRef(), { tags: next }, { merge: true }); }} className={`w-8 h-8 shrink-0 rounded-full border-2 transition-all ${item.c === ci ? 'scale-110 shadow-sm border-white' : 'border-black/5'}`} style={{ backgroundColor: c.bg }} />
                                    ))}
                                  </div>
                                </div>
                              </div>
                              <button onClick={() => delTag(item.n)} className="p-3 active:scale-75 opacity-60"><Icons.Trash size={24} /></button>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                    
                    {modalState.type === 'manageQuick' && (
                      <div className="flex flex-col h-full gap-4 px-1 font-bold">
                        <div className="flex flex-col gap-3 mb-4 shrink-0 bg-amber-50 p-4 rounded-2xl border-2 border-amber-100 shadow-sm relative">
                          <p className="text-lg font-bold text-amber-900">快速新增常用品項</p>
                          <input type="text" id="mAddQuick" placeholder="物品名稱..." className="w-full p-4 rounded-xl border-2 border-amber-200 outline-none text-xl font-bold bg-white shadow-inner" />
                          <div className="flex gap-3">
                            <select id="mAddQuickTag" className="flex-1 min-w-0 p-4 bg-white rounded-xl border-2 border-amber-200 font-bold text-lg outline-none">
                              <option value="">無地點</option>
                              {customTags.map(t => <option key={t.n} value={t.n}>{t.n}</option>)}
                            </select>
                            <button onClick={() => { const n = document.getElementById('mAddQuick').value; const t = document.getElementById('mAddQuickTag').value; if (n) { handleAddNewQuick(n, t, false); document.getElementById('mAddQuick').value = ''; } }} className="shrink-0 bg-amber-600 text-white px-8 rounded-xl font-bold text-xl active:scale-95 shadow-md">新增</button>
                          </div>
                        </div>
                        <div className="space-y-2 pb-10 px-1 font-bold" onTouchMove={(e) => onVMove(e, 'data-v-quick-idx')}>
                           <p className="text-sm font-bold text-neutral-500 px-1">已存品項 (長按圖示拖曳)：</p>
                          {quickItems.map((item, idx) => (
                            <div key={idx} data-v-quick-idx={idx} className={`flex justify-between items-center p-3 rounded-2xl border-2 bg-neutral-50 shadow-sm border-neutral-100 ${vDragIdx === idx ? 'opacity-40 scale-95' : ''}`}>
                              <div className="flex items-center gap-3 flex-1">
                                <div className="p-3 text-neutral-400 drag-handle" onTouchStart={(e) => onVStart(idx)} onTouchEnd={() => onVEnd('quick')} onTouchCancel={() => onVEnd('quick')}><Icons.GripVertical size={20}/></div>
                                <span className="font-bold text-2xl">{item.n || item.name}</span>
                              </div>
                              <button onClick={() => delQuick(idx)} className="p-3 active:scale-75 opacity-50"><Icons.Trash size={24} /></button>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}

                    {modalState.type === 'recordingPrice' && modalState.data && (
                      <div className="space-y-6 py-4 text-center font-bold px-1">
                        <div className="mb-2"><span className="text-xl font-bold text-amber-900 bg-[#FFDD00] px-8 py-3 rounded-full shadow-lg tracking-widest font-serif-tc">💰 {modalState.data.name}</span></div>
                        <p className="text-lg text-neutral-600 font-bold px-4 leading-relaxed underline underline-offset-4 decoration-amber-300 decoration-2">錄入本次價格，系統自動記憶。下次再買同樣東西，會告訴你上次買多少，讓你買得更聰明。</p>
                        <input type="number" value={modalInput} onChange={e => setModalInput(e.target.value)} placeholder="輸入金額..." className="w-full p-6 rounded-2xl border-4 border-amber-200 outline-none text-4xl text-center bg-amber-50/30 shadow-inner font-bold text-amber-900" />
                        <button onClick={async () => { await savePrice(modalState.data.name, modalInput, modalState.data.tag, modalState.data.id); setModalState({ type: null }); }} className="w-full bg-amber-600 text-white py-5 rounded-2xl font-bold text-xl shadow-lg active:scale-95 transition-all">確定錄入</button>
                      </div>
                    )}
                    
                    {modalState.type === 'addTag' && (
                      <div className="space-y-6 py-4 px-1 font-bold">
                        <input type="text" value={modalInput} onChange={e => setModalInput(e.target.value)} placeholder="輸入地點名稱..." className="w-full p-5 rounded-2xl border-2 border-emerald-200 outline-none text-2xl font-bold text-center bg-emerald-50/30 shadow-inner" />
                        <div className="space-y-4">
                          <p className="text-lg font-bold text-neutral-600 px-1">挑選顏色：</p>
                          <div className="grid grid-cols-4 gap-4 px-1">
                            {PRESET_COLORS.map((color, i) => (
                              <button key={i} onClick={() => setModalColorIdx(i)} className={`h-14 rounded-2xl border-2 transition-all ${modalColorIdx === i ? 'color-ring-active' : 'border-black/5'}`} style={{ backgroundColor: color.bg, color: color.border }}></button>
                            ))}
                          </div>
                        </div>
                        <button onClick={() => handleAddNewTag(modalInput, modalColorIdx, true)} className="w-full bg-emerald-700 text-white py-5 rounded-2xl font-bold text-xl shadow-lg active:scale-95">確認新增</button>
                      </div>
                    )}
                    
                    {modalState.type === 'editingTag' && modalState.data && (
                      <div className="flex flex-col gap-4 py-4 px-1 font-bold">
                        <div className="text-center mb-2"><span className="text-xl font-bold text-emerald-900 bg-emerald-100 px-10 py-4 rounded-full shadow-md font-serif-tc">📍 {modalState.data.name}</span></div>
                        <div className="grid grid-cols-2 gap-3 font-bold">
                          {customTags.map(t => ( 
                            <button key={t.n} onClick={async () => { await updateDoc(getItemRef(modalState.data.id), { tag: t.n }); setModalState({ type: null }); }} className="py-5 rounded-2xl font-bold text-xl border-2 shadow-sm active:scale-95" style={getTagInlineStyles(t.n)}>{t.n}</button> 
                          ))}
                          <button onClick={async () => { await updateDoc(getItemRef(modalState.data.id), { tag: '' }); setModalState({ type: null }); }} className="py-5 rounded-2xl font-bold text-xl border-2 bg-neutral-100 text-neutral-400 border-neutral-200">無地點</button>
                        </div>
                      </div>
                    )}

                    {modalState.type === 'donate' && (
                      <div className="space-y-8 py-6 text-center font-bold px-1">
                        <div className="bg-amber-50 p-6 rounded-2xl border-2 border-amber-200 shadow-inner">
                          <p className="text-xl text-amber-900 font-bold mb-2">謝謝姊姊與妹妹的心意！ 🥰</p>
                          <div className="inline-block bg-amber-500 text-white text-xs px-6 py-1.5 rounded-full font-bold shadow-md shadow-amber-200">一杯咖啡隨喜</div>
                        </div>
                        <div className="bg-neutral-50 p-6 rounded-2xl border-2 border-neutral-100 space-y-4">
                          <p className="text-xl font-bold text-neutral-800 tracking-wider font-mono">永豐銀行 (807)<br />204-018-0025253-1</p>
                          <button onClick={() => { const temp = document.createElement('input'); temp.value = '20401800252531'; document.body.appendChild(temp); temp.select(); document.execCommand('copy'); document.body.removeChild(temp); setMsg('帳號已複製！'); setTimeout(() => setMsg(''), 2000); }} className="w-full bg-amber-500 text-white py-5 rounded-2xl text-xl font-bold active:scale-95 shadow-xl flex justify-center items-center gap-2">📋 一鍵複製帳號</button>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    };
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
