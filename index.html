          const parsed = JSON.parse(raw);
          return parsed.map(r => (typeof r === 'string' ? { code: r, note: '' } : r)).filter(r => r && r.code);

        if (!roomPath) return '進入頻道';

        return () => unsubscribe();
      }, []);

      useEffect(() => {
        try { localStorage.setItem('smart_buy_base_id', personalBaseId); } catch(e){}
      }, [personalBaseId]);

      useEffect(() => {
        if (user && !user.isAnonymous) {
          const syncRoomsRef = doc(db, 'artifacts', APP_ID_PATH, 'users', user.uid, 'private_data', 'settings');
          const unsubSync = onSnapshot(syncRoomsRef, (snap) => {
            if (snap.exists()) {
              const data = snap.data();
              if (data.savedRooms && Array.isArray(data.savedRooms)) {
                setSavedRooms(data.savedRooms);
                try { localStorage.setItem('smart_buy_saved_rooms', JSON.stringify(data.savedRooms)); } catch(e){}
              }
              if (data.customBuyId) {
                setPersonalBaseId(data.customBuyId);
                setRoomPrefix(data.customBuyId);
              } else {
                setDoc(syncRoomsRef, { customBuyId: personalBaseId }, { merge: true });
              }
            } else {
              setDoc(syncRoomsRef, { customBuyId: personalBaseId, savedRooms: savedRooms }, { merge: true });
            }
          }, err => console.warn('雲端同步延遲:', err));
          return () => unsubSync();
        }
      }, [user]);

      useEffect(() => {
        if (user && !user.isAnonymous && savedRooms.length > 0) {
          const syncRoomsRef = doc(db, 'artifacts', APP_ID_PATH, 'users', user.uid, 'private_data', 'settings');
          setDoc(syncRoomsRef, { savedRooms: savedRooms }, { merge: true }).catch(console.error);
        }
      }, [savedRooms, user]);

      const handleGoogleLogin = async () => {
        try {
          setMsg('正在連接 Google 總部...');
          const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
          
          if (isMobile) {
            await signInWithRedirect(auth, googleProvider);
          } else {
            await signInWithPopup(auth, googleProvider);
            setMsg(`歡迎指揮官！資料已綁定。`);
          }
        } catch (error) {
          console.error("Google 登入失敗", error);
          if (error.code === 'auth/popup-blocked') {
            setMsg('視窗被阻擋，改用轉址登入...');
            await signInWithRedirect(auth, googleProvider);
          } else {
            setMsg('登入失敗，請檢查網路或稍後再試。');
          }
        }
      };

      const handleLogout = async () => {
        try {
          await signOut(auth);
          const newId = generateId();
          setPersonalBaseId(newId); setBaseIdEditValue(newId); setRoomPrefix(newId);
          try { localStorage.setItem('smart_buy_base_id', newId); } catch(e){}
          setMsg('已解除登入。');
        } catch (error) { console.error("登出失敗", error); }
      };

      const handleUpdateBaseId = async (newVal) => {
        const val = newVal.trim(); if (!val) return;
        setPersonalBaseId(val); setBaseIdEditValue(val); setRoomPrefix(val);
        try{localStorage.setItem('smart_buy_base_id', val);}catch(e){}
        if (user && !user.isAnonymous) {
          const syncRoomsRef = doc(db, 'artifacts', APP_ID_PATH, 'users', user.uid, 'private_data', 'settings');
          await setDoc(syncRoomsRef, { customBuyId: val }, { merge: true }).catch(console.error);
        }
        setMsg('Buy ID 已更新並永久記憶！');
      };

      const handleRenameRoom = async () => {
        const newNote = modalInput.trim();
        const codeToEdit = modalState.data.code;
        const newSavedRooms = savedRooms.map(r => r.code === codeToEdit ? { ...r, note: newNote } : r);
        setSavedRooms(newSavedRooms);
        try { localStorage.setItem('smart_buy_saved_rooms', JSON.stringify(newSavedRooms)); } catch(e){}
        if (user && !user.isAnonymous) {
          const syncRoomsRef = doc(db, 'artifacts', APP_ID_PATH, 'users', user.uid, 'private_data', 'settings');
          await setDoc(syncRoomsRef, { savedRooms: newSavedRooms }, { merge: true }).catch(console.error);
        }
        setModalState({ type: 'room' });
        setMsg('頻道名稱已更新！');
      };

      useEffect(() => {
        if (!user) return;
        setIsLoading(true);
        const prefix = roomPath ? `room_${roomPath}` : `user_${user.uid}`;
        
        const unsubItems = onSnapshot(query(collection(db, 'artifacts', APP_ID_PATH, 'public', 'data', `list_${prefix}`), orderBy('createdAt', 'desc')), snap => {
          setItems(snap.docs.map(d => ({ id: d.id, ...d.data() })));
          setIsLoading(false);
        }, err => { console.warn('資料讀取中:', err); setIsLoading(false); });
        
        const unsubHist = onSnapshot(collection(db, 'artifacts', APP_ID_PATH, 'public', 'data', `hist_${prefix}`), snap => {
          const h = {};
          snap.docs.forEach(d => { const data = d.data(); h[data.name] = data; });
          setHistory(h);
        }, err => console.warn('歷史紀錄讀取中:', err));
        
        const unsubConfig = onSnapshot(doc(db, 'artifacts', APP_ID_PATH, 'public', 'data', `config_${prefix}`, 'settings'), snap => {
          if (snap.exists()) {
            const data = snap.data();
            if (data.tags) {
              const fixedTags = data.tags.map(t => (typeof t === 'string' ? { n: t, c: 0 } : t)).filter(t => t && t.n);
              setCustomTags(fixedTags);
            }
            if (data.quick) {
              const fixedQuick = data.quick.map(q => (typeof q === 'string' ? { n: q, t: '' } : q)).filter(q => q && (q.n || q.name));
              setQuickItems(fixedQuick);
            }
          } else {
            setDoc(snap.ref, { tags: DEFAULT_TAGS, quick: DEFAULT_QUICK }).catch(console.warn);
          }
        }, err => console.warn('設定讀取中:', err));
        
        return () => { unsubItems(); unsubHist(); unsubConfig(); };
      }, [user, roomPath]);
      
      const getConfigRef = () => doc(db, 'artifacts', APP_ID_PATH, 'public', 'data', `config_${roomPath ? `room_${roomPath}` : `user_${user.uid}`}`, 'settings');
      const getItemRef = (id) => doc(db, 'artifacts', APP_ID_PATH, 'public', 'data', `list_${roomPath ? `room_${roomPath}` : `user_${user.uid}`}`, id);
      
      const handleAdd = async (e) => {
        if (e) e.preventDefault();
        if (!inputValue.trim() || !user) return;
        await addDoc(collection(db, 'artifacts', APP_ID_PATH, 'public', 'data', `list_${roomPath ? `room_${roomPath}` : `user_${user.uid}`}`), { name: inputValue.trim(), qty: qtyValue.trim(), tag: activeTag || '', completed: false, postponed: false, createdAt: Date.now() });
        setInputValue(''); setQtyValue('');
      };
      const handleQuickSelect = (qa) => { setInputValue(qa.n || qa.name || ''); setActiveTag(qa.t || qa.tag || ''); };
      const handleComplete = async (item) => { await updateDoc(getItemRef(item.id), { completed: !item.completed, postponed: false }); };
      const handlePostpone = async (e, item) => { e.stopPropagation(); await updateDoc(getItemRef(item.id), { postponed: !item.postponed, completed: false }); };
      const savePrice = async (itemName, price, itemTag, itemId) => {
        const prefix = roomPath ? `room_${roomPath}` : `user_${user.uid}`;
        await setDoc(doc(db, 'artifacts', APP_ID_PATH, 'public', 'data', `hist_${prefix}`, itemName), { name: itemName, price: price || '', tag: itemTag || '', updatedAt: Date.now() });
        if (itemId) await updateDoc(getItemRef(itemId), { currentPrice: price || '' });
      };
      const handleAddNewTag = async (tagName, colorIdx, shouldClose = false) => {
        const name = tagName.trim(); if (!name) return;
        if ((customTags || []).some(t => t && t.n === name)) { setMsg('地點已存在！'); return; }
        const next = [...(customTags || []), { n: name, c: colorIdx }]; await setDoc(getConfigRef(), { tags: next }, { merge: true });
        if (shouldClose) setModalState({ type: null });
        setMsg('新增成功');
      };
      const delTag = async (tagName) => { const next = (customTags || []).filter(tag => tag && tag.n !== tagName); await setDoc(getConfigRef(), { tags: next }, { merge: true }); };
      const handleAddNewQuick = async (name, tag, shouldClose = false) => {
        const qName = name.trim(); if (!qName) return;
        const next = [...(quickItems || []).filter(q => q).map(q => ({ n: q.n || q.name, t: q.t || q.tag || '' })), { n: qName, t: tag || '' }];
        await setDoc(getConfigRef(), { quick: next }, { merge: true });
        if (shouldClose) setModalState({ type: null });
        setMsg('新增成功');
      };
      const delQuick = async (idx) => { const next = (quickItems || []).filter((_, i) => i !== idx).map(q => ({ n: q?.n || q?.name, t: q?.t || q?.tag || '' })); await setDoc(getConfigRef(), { quick: next }, { merge: true }); };
      const openAlarmModal = (e, item) => {
        e.stopPropagation();
        const now = new Date(); now.setHours(now.getHours() + 1); 
        const tzoffset = now.getTimezoneOffset() * 60000;
        const localISOTime = new Date(now - tzoffset).toISOString().slice(0, 16);
        setModalInput(localISOTime); setModalState({ type: 'setAlarm', data: item });
      };
      const generateICS = (item, dateStr) => {
        const date = new Date(dateStr); if (isNaN(date.getTime())) return;
        const pad = (n) => n < 10 ? '0' + n : n;
        const toICSDate = (d) => d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) + 'T' + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + pad(d.getUTCSeconds()) + 'Z';
        const start = toICSDate(date); const end = toICSDate(new Date(date.getTime() + 60*60*1000));
        const icsContent = `BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//SmartBuy//TW\nCALSCALE:GREGORIAN\nBEGIN:VEVENT\nDTSTART:${start}\nDTEND:${end}\nSUMMARY:🛒 採買：${item.name} ${item.tag && item.tag !== '無' ? `(${item.tag})` : ''}\nDESCRIPTION:地點：${item.tag || '無'}\\n(由智能採買 APP 自動建立)\nBEGIN:VALARM\nTRIGGER:-PT0M\nACTION:DISPLAY\nDESCRIPTION:Reminder\nEND:VALARM\nEND:VEVENT\nEND:VCALENDAR`;
        const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = `採買提醒_${item.name}.ics`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
      };
      const handleTuneRoomAttempt = async (prefix, suffix, note = '') => {
        try {
          const finalPath = (prefix.trim() && suffix.trim()) ? `${prefix.trim()}-${suffix.trim()}` : (prefix.trim() || suffix.trim());
          const snap = await getDocs(collection(db, 'artifacts', APP_ID_PATH, 'public', 'data', `list_room_${finalPath}`));
          if (!snap.empty) setModalState({ type: 'channelConflict', data: { code: finalPath, note, count: snap.size } });
          else handleTuneRoom(finalPath, note);
        } catch(e) { setMsg('連線錯誤'); }
      };
      const handleTuneRoom = (code, note = '') => {
        const c = code.trim(); if (!c) { setRoomPath(''); try{localStorage.removeItem('smart_buy_room');}catch(e){} setModalState({ type: null }); return; }
        setRoomPath(c); try{localStorage.setItem('smart_buy_room', c);}catch(e){}
        setSavedRooms(prev => {
          const next = [{ code: c, note: note || '' }, ...prev.filter(r => r.code !== c)];
          try{localStorage.setItem('smart_buy_saved_rooms', JSON.stringify(next));}catch(e){}
          return next;
        });
        setModalState({ type: null }); setMsg(`連線成功`);
      };
      const handleClearChannelData = async (code) => {
        const snap = await getDocs(collection(db, 'artifacts', APP_ID_PATH, 'public', 'data', `list_room_${code}`));
        for (const d of snap.docs) await deleteDoc(d.ref);
        setMsg('頻道已淨空'); handleTuneRoom(code, modalState.data.note);
      };

      const clearCompleted = async () => {
        const toDelete = items.filter(i => i.completed);
        for (const item of toDelete) await deleteDoc(getItemRef(item.id));
        setMsg('已清除完成項目');
      };
      const resetAllTagsColor = async () => {
        const next = (customTags || []).map(t => ({ ...t, c: 0 }));
        setCustomTags(next); await setDoc(getConfigRef(), { tags: next }, { merge: true });
        setMsg('已還原預設色');
      };

      const handleShareApp = async () => {
        const shareText = `推薦給你這個超好用的智能採買 APP！\n\n${window.location.href.split('?')[0]}`;
        if (navigator.share) try { await navigator.share({ title: '智能採買', text: shareText }); } catch(err) {}
        else { const tempIn = document.createElement('textarea'); tempIn.value = shareText; tempIn.style.position = 'fixed'; document.body.appendChild(tempIn); tempIn.select(); document.execCommand('copy'); document.body.removeChild(tempIn); setMsg('推薦文字與連結已複製！'); }
      };

      const handleShareRoom = async (e, roomCode) => {
        e.stopPropagation();
        const url = window.location.href.split('?')[0];
        const shareText = `邀請你加入我的採買頻道！\n\n🗝️ 專屬鑰匙：${roomCode}\n\n請在「智能採買」設定中貼上此鑰匙即可連線同步！\n👉 ${url}`;
        if (navigator.share) {
          try { await navigator.share({ title: '智能採買頻道邀請', text: shareText }); } catch(err) {}
        } else {
          const tempIn = document.createElement('textarea'); tempIn.value = shareText; tempIn.style.position = 'fixed'; document.body.appendChild(tempIn); tempIn.select(); document.execCommand('copy'); document.body.removeChild(tempIn); setMsg('頻道邀請文字已複製！');
        }
      };

      const handleForceUpdate = () => {
        setMsg('重整中...'); if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(r => { for (let rg of r) rg.unregister(); });
        setTimeout(() => { window.location.reload(true); }, 1500);
      };
      const onTouchStartH = (e, idx, type) => {
        touchStartPos.current = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        isScrolling.current = false; dragDidHappen.current = false;
        touchTimer.current = setTimeout(() => { if (!isScrolling.current) { setHDragIdx(idx); setHDragType(type); dragDidHappen.current = true; } }, 400);
      };
      const onTouchMoveH = (e, attr) => {
        const dx = Math.abs(e.touches[0].clientX - touchStartPos.current.x);
        const dy = Math.abs(e.touches[0].clientY - touchStartPos.current.y);
        if (hDragIdx === null) { if (dx > 8 || dy > 8) { isScrolling.current = true; clearTimeout(touchTimer.current); } return; }
        e.preventDefault(); const target = document.elementFromPoint(e.touches[0].clientX, e.touches[0].clientY);
        const dropElem = target?.closest(`[${attr}]`); if (dropElem) { const overIdx = parseInt(dropElem.getAttribute(attr), 10); if (overIdx !== hDragOverIdx) setHDragOverIdx(overIdx); }
      };
      const onTouchEndH = async (type) => {
        clearTimeout(touchTimer.current);
        if (hDragIdx !== null && hDragOverIdx !== null && hDragIdx !== hDragOverIdx) {
          if (type === 'tag') {
            const next = [...customTags]; const [moved] = next.splice(hDragIdx, 1); next.splice(hDragOverIdx, 0, moved);
            setCustomTags(next); await setDoc(getConfigRef(), { tags: next }, { merge: true });
          } else {
            const next = [...quickItems]; const [moved] = next.splice(hDragIdx, 1); next.splice(hDragOverIdx, 0, moved);
            setQuickItems(next); await setDoc(getConfigRef(), { quick: next }, { merge: true });
          }
        }
        setHDragIdx(null); setHDragOverIdx(null); setHDragType(null);
      };
      const onVStart = (idx) => setVDragIdx(idx);
      const onVMove = (e, attr) => {
        if (vDragIdx === null) return; e.preventDefault(); const touch = e.touches[0];
        const target = document.elementFromPoint(touch.clientX, touch.clientY);
        const dropElem = target?.closest(`[${attr}]`); if (dropElem) { const hoverIdx = parseInt(dropElem.getAttribute(attr), 10); if (hoverIdx !== vDragOverIdx) setVDragOverIdx(hoverIdx); }
      };
      const onVEnd = async (type) => {
        if (vDragIdx !== null && vDragOverIdx !== null && vDragIdx !== vDragOverIdx) {
          if (type === 'tag') {
            const next = [...customTags]; const [moved] = next.splice(vDragIdx, 1); next.splice(vDragOverIdx, 0, moved);
            setCustomTags(next); await setDoc(getConfigRef(), { tags: next }, { merge: true });
          } else if (type === 'quick') {
            const next = [...quickItems]; const [moved] = next.splice(vDragIdx, 1); next.splice(vDragOverIdx, 0, moved);
            setQuickItems(next); await setDoc(getConfigRef(), { quick: next }, { merge: true });
          } else if (type === 'room') {
            const next = [...savedRooms]; const [moved] = next.splice(vDragIdx, 1); next.splice(vDragOverIdx, 0, moved);
            setSavedRooms(next); try{localStorage.setItem('smart_buy_saved_rooms', JSON.stringify(next));}catch(e){}
          }
        }
        setVDragIdx(null); setVDragOverIdx(null);
      };
      const filteredItems = items.filter(item => filterTag === '全部' ? true : item.tag === filterTag);
      const scrollContainerClass = (type) => (hDragIdx !== null && hDragType === type) ? 'lock-scroll' : 'overflow-x-auto scrollbar-hide';

      return (
        <div className="w-full h-full flex justify-center bg-neutral-100 font-sans text-neutral-800">
          {msg && (
            <div className="fixed top-10 left-1/2 -translate-x-1/2 bg-neutral-800/90 text-white px-6 py-2.5 rounded-full text-base sm:text-lg font-bold shadow-2xl z-[200] animate-slide-up whitespace-nowrap font-serif-tc">
              {msg}
            </div>
          )}

          <div className="w-full max-w-md bg-white h-full flex flex-col relative shadow-2xl sm:border-x border-neutral-200 z-0 overflow-hidden">
            <header className="bg-emerald-700 text-white shrink-0 shadow-lg z-20 safe-pt">
              <div className="px-3 py-2 sm:py-3 flex justify-between items-center gap-2 h-auto min-h-[56px]">
                <div className="flex items-center gap-2 font-bold min-w-0">
                  <Icons.Cart size={22} className="shrink-0" />
                  <h1 className="text-xl sm:text-2xl tracking-tight font-serif-tc shrink-0">智能採買</h1>
                  <button onClick={() => setModalState({ type: 'about' })} className="p-1.5 sm:p-2 bg-blue-500 text-white rounded-full shadow-md ml-1 active:scale-90 transition-all shrink-0">
                    <Icons.Info size={18} />
                  </button>
                </div>
                <div className="flex shrink-0 min-w-0">
                  <button onClick={() => { 
                    setModalInput(''); setIsEditingBaseId(false); setBaseIdEditValue(personalBaseId); setRoomPrefix(personalBaseId); setRoomSuffix('');
                    setModalState({ type: 'room' }); 
                  }} className={`px-3 py-1.5 rounded-full text-sm font-bold transition-all active:scale-95 shadow-sm truncate max-w-[120px] sm:max-w-[150px] ${roomPath ? 'bg-amber-400 text-amber-900' : 'bg-emerald-600 text-white border border-emerald-500'}`}>
                    {headerRoomTitle}
                  </button>
                </div>
              </div>
              {user && user.isAnonymous && !roomPath && (
                <div className="bg-emerald-800/50 px-4 py-2 flex justify-between items-center text-xs">
                  <span className="text-emerald-100">未綁定帳號，換手機資料將遺失。</span>
                  <button onClick={handleGoogleLogin} className="bg-white text-emerald-800 px-3 py-1 rounded-full font-bold shadow-sm active:scale-95 flex items-center gap-1">
                    <Icons.Google size={14} /> 綁定 Google
                  </button>
                </div>
              )}
            </header>

            {!isShoppingMode && (
              <div className="bg-white px-3 pt-2 pb-1.5 shadow-sm relative z-10 shrink-0 border-b border-emerald-100">
                <form onSubmit={handleAdd} className="flex gap-2 items-center mb-1">
                  <input type="text" value={inputValue} onChange={e => setInputValue(e.target.value)} placeholder="要買或要做什麼？" className="flex-1 min-w-0 p-3.5 rounded-2xl border border-neutral-200 shadow-sm outline-none text-lg sm:text-xl font-bold bg-white focus:border-emerald-500 text-neutral-700 placeholder-neutral-400" />
                  <input type="text" value={qtyValue} onChange={e => setQtyValue(e.target.value)} placeholder="數量" className="w-16 sm:w-20 p-3.5 rounded-2xl border border-neutral-200 shadow-sm text-center outline-none text-lg font-bold bg-white focus:border-emerald-500 text-neutral-700 placeholder-neutral-400" />
                </form>
                <div className={`flex items-center gap-2 relative ${scrollContainerClass('quick')} py-0.5 mt-0.5`}>
                  <div className="sticky left-0 bg-white pr-1 z-10 flex items-center justify-center">
                    <button type="button" onClick={() => setModalState({ type: 'manageQuick' })} className="shrink-0 text-emerald-700 w-8 h-8 flex items-center justify-center bg-white rounded-full shadow-sm border border-neutral-100 active:scale-95"><Icons.Settings size={20} /></button>
                  </div>
                  {quickItems && quickItems.map((qa, i) => (
                    <button key={i} data-h-quick-idx={i} onTouchStart={(e) => onTouchStartH(e, i, 'quick')} onTouchMove={(e) => onTouchMoveH(e, 'data-h-quick-idx')} onTouchEnd={() => onTouchEndH('quick')} onTouchCancel={() => onTouchEndH('quick')} onClick={() => { if(!dragDidHappen.current) handleQuickSelect(qa); }} className={`shrink-0 draggable-pill whitespace-nowrap px-4 py-1.5 rounded-full text-base font-bold transition-all shadow-sm bg-orange-50 border border-orange-200 text-orange-600 active:scale-95 ${hDragIdx === i && hDragType === 'quick' ? 'scale-110 opacity-60 z-50 shadow-md' : ''} ${hDragOverIdx === i && hDragType === 'quick' ? 'border-2 border-dashed border-orange-500' : ''}`}>+ {qa.n || qa.name}</button>
                  ))}
                  <button type="button" onClick={() => { setModalInput(''); setModalState({ type: 'addQuick' }); }} className="shrink-0 px-4 py-1.5 rounded-full text-base font-bold text-orange-500 bg-white border border-dashed border-orange-300 active:scale-95 whitespace-nowrap">+ 自訂</button>
                </div>
                <div className={`flex items-center gap-2 relative ${scrollContainerClass('tag')} py-0.5 mt-0.5`}>
                  <div className="sticky left-0 bg-white pr-1 z-10 flex items-center justify-center">
                    <button type="button" onClick={() => setModalState({ type: 'manageTag' })} className="shrink-0 text-emerald-700 w-8 h-8 flex items-center justify-center bg-white rounded-full shadow-sm border border-neutral-100 active:scale-95"><Icons.Settings size={20} /></button>
                  </div>
                  {customTags && customTags.map((t, idx) => {
                    if(!t || !t.n) return null;
                    const isSelected = activeTag === t.n;
                    return (
                      <button key={t.n} data-h-tag-idx={idx} onTouchStart={(e) => onTouchStartH(e, idx, 'tag')} onTouchMove={(e) => onTouchMoveH(e, 'data-h-tag-idx')} onTouchEnd={() => onTouchEndH('tag')} onTouchCancel={() => onTouchEndH('tag')} onClick={() => { if(!dragDidHappen.current) setActiveTag(isSelected ? '' : t.n); }} className={`shrink-0 draggable-pill px-4 py-1.5 rounded-full text-base font-bold whitespace-nowrap transition-all border-2 active:scale-95 shadow-sm flex items-center gap-1 ${isSelected ? 'scale-105 shadow-inner' : 'opacity-80'} ${hDragIdx === idx && hDragType === 'tag' ? 'scale-110 opacity-60 z-50 shadow-md' : ''} ${hDragOverIdx === idx && hDragType === 'tag' ? 'border-dashed' : ''}`} style={getTagStyle(t.n, isSelected)}>
                        {isSelected && <Icons.Check size={18} />} {t.n}
                      </button>
