<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智能採買</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="智能採買">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&display=swap');
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .animate-slide-up { animation: slideUp 0.3s ease-out; }
    input:focus { font-size: 16px !important; }
    .font-serif-tc { font-family: 'Noto Serif TC', serif; }
  </style>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(console.error);
      });
    }
  </script>
</head>
<body class="bg-neutral-100 text-neutral-800 antialiased font-sans min-h-screen flex justify-center">
  <div id="root" class="w-full flex justify-center"></div>

  <script type="text/babel" data-type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, setDoc, query, orderBy, writeBatch, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    const { useState, useEffect, useRef } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyC36SqZOaZR3iYfMMDg5NQlADKdwEaZ5bk",
      authDomain: "smart-buy-dbaae.firebaseapp.com",
      projectId: "smart-buy-dbaae",
      storageBucket: "smart-buy-dbaae.firebasestorage.app",
      messagingSenderId: "176643347488",
      appId: "1:176643347488:web:182ef57838ae4358e4d845",
      measurementId: "G-7E04LF7E9P"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = "smart-buy-final";

    const Icons = {
      Cart: () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>,
      Plus: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
      Trash: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>,
      Check: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><polyline points="20 6 9 17 4 12"/></svg>,
      Clock: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
      ChevronUp: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="m18 15-6-6-6 6"/></svg>,
      ChevronDown: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="m6 9 6 6 6-6"/></svg>,
      History: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8m0-5v5h5"/><polyline points="12 7 12 12 16 14"/></svg>,
      Dollar: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>,
      Share: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8m-4-6-4-4-4 4m4-4v13"/></svg>,
      User: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
      Zap: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" fill="currentColor"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>,
      Settings: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
      Tag: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>,
      X: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
      ShoppingBag: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>,
      Refresh: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>
    };

    const DEFAULT_TAGS = ['無', '全聯', '菜市場', '好市多', '五金行', '烘焙'];
    const DEFAULT_QUICK = [{n:'雞蛋',t:'全聯'}, {n:'鮮乳',t:'全聯'}, {n:'青菜',t:'菜市場'}];

    const App = () => {
      const [user, setUser] = useState(null);
      const [items, setItems] = useState([]);
      const [history, setHistory] = useState({});
      const [customTags, setCustomTags] = useState(DEFAULT_TAGS);
      const [quickItems, setQuickItems] = useState(DEFAULT_QUICK);
      
      const [inputValue, setInputValue] = useState('');
      const [qtyValue, setQtyValue] = useState('');
      const [activeTag, setActiveTag] = useState('無');
      const [filterTag, setFilterTag] = useState('全部');
      const [isShoppingMode, setIsShoppingMode] = useState(false);
      const [roomCode, setRoomCode] = useState('');
      
      const [isRoomOpen, setIsRoomOpen] = useState(false);
      const [isTagOpen, setIsTagOpen] = useState(false);
      const [isQuickOpen, setIsQuickOpen] = useState(false);
      
      const [editingLocationItem, setEditingLocationItem] = useState(null);
      const [recordingPriceItem, setRecordingPriceItem] = useState(null);

      const [msg, setMsg] = useState('');
      const [newTagName, setNewTagName] = useState('');
      const [newQuickName, setNewQuickName] = useState('');
      const [newQuickTag, setNewQuickTag] = useState('無');

      const [confirmModal, setConfirmModal] = useState({ isOpen: false, title: '', message: '', onConfirm: null });

      // 多頻道記憶
      const [savedRooms, setSavedRooms] = useState(() => {
        const saved = localStorage.getItem('smart_buy_saved_rooms');
        if (!saved) return [];
        const parsed = JSON.parse(saved);
        return parsed.map(r => typeof r === 'string' ? { code: r, note: '' } : r);
      });

      // 永久頻道黑名單 (用於檢查是否曾連線過)
      const [allTimeRooms, setAllTimeRooms] = useState(() => {
        const history = localStorage.getItem('smart_buy_room_history');
        return history ? JSON.parse(history) : [];
      });

      const inputRef = useRef(null);

      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const urlRoom = params.get('room');
        const savedRoom = localStorage.getItem('smart_buy_room') || '';
        const finalRoom = urlRoom || savedRoom;
        
        if (finalRoom) {
          setRoomCode(finalRoom);
          localStorage.setItem('smart_buy_room', finalRoom);
          if (urlRoom) window.history.replaceState({}, document.title, window.location.pathname);
        }

        onAuthStateChanged(auth, u => {
          if (u) setUser(u);
          else signInAnonymously(auth).catch(console.error);
        });
      }, []);

      useEffect(() => {
        if (!user) return;
        const pathPrefix = roomCode ? `room_${roomCode}` : `user_${user.uid}`;
        const itemsCol = collection(db, 'artifacts', appId, 'public', 'data', `list_${pathPrefix}`);
        const histCol = collection(db, 'artifacts', appId, 'public', 'data', `hist_${pathPrefix}`);
        const configDoc = doc(db, 'artifacts', appId, 'public', 'data', `config_${pathPrefix}`, 'settings');

        const unsubItems = onSnapshot(query(itemsCol, orderBy('createdAt', 'desc')), snap => {
          setItems(snap.docs.map(d => ({ id: d.id, ...d.data() })));
        });

        const unsubHist = onSnapshot(histCol, snap => {
          const h = {}; snap.docs.forEach(d => h[d.data().name] = d.data()); setHistory(h);
        });

        const unsubConfig = onSnapshot(configDoc, (docSnap) => {
          if (docSnap.exists()) {
            const data = docSnap.data();
            if (data.tags) setCustomTags(data.tags);
            if (data.quick) setQuickItems(data.quick.filter(q => q && (q.n || q.name)));
          } else {
            setDoc(configDoc, { tags: DEFAULT_TAGS, quick: DEFAULT_QUICK });
          }
        });

        return () => { unsubItems(); unsubHist(); unsubConfig(); };
      }, [user, roomCode]);

      const getConfigRef = () => {
        const pathPrefix = roomCode ? `room_${roomCode}` : `user_${user.uid}`;
        return doc(db, 'artifacts', appId, 'public', 'data', `config_${pathPrefix}`, 'settings');
      };

      const getItemRef = (id) => {
        const pathPrefix = roomCode ? `room_${roomCode}` : `user_${user.uid}`;
        return doc(db, 'artifacts', appId, 'public', 'data', `list_${pathPrefix}`, id);
      };

      const handleAdd = async (e) => {
        if (e) e.preventDefault();
        if (!inputValue.trim() || !user) return;
        const pathPrefix = roomCode ? `room_${roomCode}` : `user_${user.uid}`;
        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', `list_${pathPrefix}`), {
          name: inputValue.trim(), qty: qtyValue.trim(), tag: activeTag, completed: false, postponed: false, createdAt: Date.now()
        });
        setInputValue(''); setQtyValue('');
      };

      const handleQuickSelect = (qa) => {
        setInputValue(qa.n || qa.name);
        setActiveTag(qa.t || qa.tag);
        inputRef.current?.focus();
      };

      const handleComplete = async (item) => {
        await updateDoc(getItemRef(item.id), { completed: !item.completed, postponed: false });
      };

      const handlePostpone = async (e, item) => {
        e.stopPropagation();
        await updateDoc(getItemRef(item.id), { postponed: !item.postponed, completed: false });
      };

      const savePrice = async (itemName, price, itemTag) => {
        if (!price) return;
        const pathPrefix = roomCode ? `room_${roomCode}` : `user_${user.uid}`;
        const histDoc = doc(db, 'artifacts', appId, 'public', 'data', `hist_${pathPrefix}`, itemName);
        await setDoc(histDoc, { name: itemName, price, tag: itemTag, updatedAt: Date.now() });
      };

      const clearCompleted = async () => {
        if (!user) return;
        const toDelete = items.filter(i => i.completed);
        for (const item of toDelete) {
          await deleteDoc(getItemRef(item.id));
        }
      };

      const resetAllItems = async () => {
        if (!user) return;
        setConfirmModal({
          isOpen: true,
          title: '陣地重整',
          message: '這將清空目前清單中「所有」物品（包括尚未購買的），確定要執行嗎？',
          onConfirm: async () => {
            const pathPrefix = roomCode ? `room_${roomCode}` : `user_${user.uid}`;
            const itemsCol = collection(db, 'artifacts', appId, 'public', 'data', `list_${pathPrefix}`);
            const qSnap = await getDocs(itemsCol);
            const batch = writeBatch(db);
            qSnap.docs.forEach(d => batch.delete(d.ref));
            await batch.commit();
            setConfirmModal({ isOpen: false, title: '', message: '', onConfirm: null });
            setMsg('清單已全面重整');
            setTimeout(() => setMsg(''), 1500);
          }
        });
      };

      const copyLink = () => {
        const base = window.location.href.split('?')[0];
        const url = `${base}?room=${roomCode}`;
        const t = document.createElement("input"); t.value = url; document.body.appendChild(t); t.select(); document.execCommand("copy"); document.body.removeChild(t);
        setMsg('分享網址已複製！'); setTimeout(() => setMsg(''), 2000);
      };

      const moveTag = async (idx, dir) => {
        if (idx === 0) return;
        const newTags = [...customTags];
        const target = idx + dir;
        if (target < 1 || target >= newTags.length) return;
        [newTags[idx], newTags[target]] = [newTags[target], newTags[idx]];
        await setDoc(getConfigRef(), { tags: newTags }, { merge: true });
      };

      const moveQuick = async (idx, dir) => {
        const newQ = quickItems.map(q => ({n: q.n || q.name, t: q.t || q.tag}));
        const target = idx + dir;
        if (target < 0 || target >= newQ.length) return;
        [newQ[idx], newQ[target]] = [newQ[target], newQ[idx]];
        await setDoc(getConfigRef(), { quick: newQ }, { merge: true });
      };

      const addTag = async () => {
        if (!newTagName.trim()) return;
        const newTags = [...customTags, newTagName.trim()];
        await setDoc(getConfigRef(), { tags: newTags }, { merge: true });
        setNewTagName('');
      };
      const delTag = async (t) => {
        if (t === '無') return;
        const newTags = customTags.filter(tag => tag !== t);
        await setDoc(getConfigRef(), { tags: newTags }, { merge: true });
      };

      const addQuick = async () => {
        if (!newQuickName.trim()) return;
        const newQ = [{ n: newQuickName.trim(), t: newQuickTag }, ...quickItems.map(q => ({n: q.n || q.name, t: q.t || q.tag}))];
        await setDoc(getConfigRef(), { quick: newQ }, { merge: true });
        setNewQuickName('');
      };
      const delQuick = async (idx) => {
        const newQ = quickItems.filter((_, i) => i !== idx).map(q => ({n: q.n || q.name, t: q.t || q.tag}));
        await setDoc(getConfigRef(), { quick: newQ }, { merge: true });
      };

      // 戰術調頻：加入靈魂記憶檢查
      const handleTuneRoom = (v, note = '', force = false) => {
        const code = v.trim();
        if (!code) {
          setRoomCode('');
          localStorage.setItem('smart_buy_room', '');
          setIsRoomOpen(false);
          return;
        }

        const executeJoin = () => {
          setRoomCode(code);
          localStorage.setItem('smart_buy_room', code);
          
          // 更新顯示名單
          const existingIdx = savedRooms.findIndex(r => r.code === code);
          let newSaved;
          if (existingIdx > -1) {
            newSaved = [...savedRooms];
            if (note) newSaved[existingIdx].note = note;
          } else {
            newSaved = [{ code, note }, ...savedRooms];
          }
          setSavedRooms(newSaved);
          localStorage.setItem('smart_buy_saved_rooms', JSON.stringify(newSaved));
          
          // 更新永久黑名單
          if (!allTimeRooms.includes(code)) {
            const newHistory = [...allTimeRooms, code];
            setAllTimeRooms(newHistory);
            localStorage.setItem('smart_buy_room_history', JSON.stringify(newHistory));
          }

          setIsRoomOpen(false);
          setMsg(`頻道 ${code} 已連線`);
          setTimeout(() => setMsg(''), 1500);
          setConfirmModal({ isOpen: false, title: '', message: '', onConfirm: null });
        };

        // 安全雷達檢查：如果是手動輸入且曾在這台設備出現過
        if (!force && allTimeRooms.includes(code) && code !== roomCode) {
           setConfirmModal({
             isOpen: true,
             title: '偵測到舊頻道',
             message: `代號 ${code} 之前已使用過，要切換並繼續連結雲端資料嗎？`,
             onConfirm: executeJoin
           });
        } else {
           executeJoin();
        }
      };

      const handleForgetRoom = (e, code) => {
        e.stopPropagation();
        const newSaved = savedRooms.filter(r => r.code !== code);
        setSavedRooms(newSaved);
        localStorage.setItem('smart_buy_saved_rooms', JSON.stringify(newSaved));
        if (roomCode === code) {
          setRoomCode('');
          localStorage.setItem('smart_buy_room', '');
        }
      };

      const activeTagsInList = Array.from(new Set(items.map(item => item.tag))).filter(t => t && t !== '無');
      const displayFilterTags = ['全部', ...customTags.filter(tag => activeTagsInList.includes(tag))];
      const filteredItems = items.filter(item => filterTag === '全部' ? true : item.tag === filterTag);

      return (
        <div className="min-h-screen bg-neutral-100 flex justify-center items-start pt-0 sm:pt-8 font-sans">
          <div className="w-full max-w-md bg-white h-fit min-h-[500px] flex flex-col relative shadow-2xl overflow-hidden sm:rounded-3xl mb-8">
            
            <header className="bg-emerald-700 text-white p-4 flex justify-between items-center shrink-0 shadow-lg z-20">
              <div className="flex items-center gap-2 text-white font-bold">
                <Icons.Cart />
                <h1 className="text-2xl tracking-tight font-serif-tc">智能採買</h1>
              </div>
              <div className="flex gap-2">
                {roomCode && <button onClick={copyLink} className="bg-white/20 p-2 rounded-lg active:scale-90 transition-all text-white"><Icons.Share /></button>}
                <button onClick={() => setIsRoomOpen(true)} className={`px-3 py-1.5 rounded-lg text-sm font-bold flex items-center gap-1.5 transition-all ${roomCode ? 'bg-amber-400 text-amber-900 shadow-inner' : 'bg-emerald-600 text-white border border-emerald-500'}`}>{roomCode ? `頻道 ${roomCode}` : <><Icons.User size={14}/> 進入頻道</>}</button>
              </div>
            </header>

            <div className={`transition-all duration-300 ease-in-out origin-top overflow-hidden bg-emerald-50 shrink-0 shadow-sm ${isShoppingMode ? 'max-h-0 opacity-0' : 'max-h-[350px] opacity-100 border-b border-emerald-100'}`}>
              <div className="p-4 space-y-3">
                <form onSubmit={handleAdd} className="flex gap-2">
                  <input ref={inputRef} type="text" value={inputValue} onChange={e => setInputValue(e.target.value)} placeholder="例如：雞蛋" className="flex-1 p-3 rounded-xl border-none shadow-inner focus:ring-2 focus:ring-emerald-600 outline-none text-lg bg-white" />
                  <input type="text" value={qtyValue} onChange={e => setQtyValue(e.target.value)} placeholder="數量" className="w-16 p-3 rounded-xl border-none shadow-inner text-center outline-none text-base bg-white" />
                  <button type="submit" className="bg-emerald-700 text-white px-5 rounded-xl shadow-lg active:scale-95 transition-transform shrink-0"><Icons.Plus /></button>
                </form>
                <div className="flex items-center gap-2 overflow-x-auto scrollbar-hide pb-1">
                  <button type="button" onClick={() => setIsTagOpen(true)} className="p-1.5 rounded-full bg-emerald-100 text-emerald-700 shrink-0 active:rotate-45 transition-transform"><Icons.Settings size={14}/></button>
                  {customTags.map(t => (<button key={t} type="button" onClick={() => setActiveTag(t)} className={`shrink-0 px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-all ${activeTag === t ? 'bg-emerald-700 text-white shadow-md' : 'bg-white text-emerald-700 border border-emerald-200'}`}>{t}</button>))}
                </div>
                <div className="flex items-center gap-2 overflow-x-auto scrollbar-hide pt-1 text-xs">
                  <button type="button" onClick={() => setIsQuickOpen(true)} className="p-1.5 rounded-full bg-amber-100 text-amber-700 shrink-0 active:rotate-45 transition-transform"><Icons.Settings size={14}/></button>
                  <span className="flex items-center gap-1 text-amber-600 font-bold whitespace-nowrap shrink-0"><Icons.Zap size={12}/> 一鍵補給:</span>
                  {quickItems.map((qa, i) => (<button key={i} type="button" onClick={() => handleQuickSelect(qa)} className="whitespace-nowrap px-2.5 py-1 rounded bg-amber-50 border border-amber-200 text-amber-700 font-bold active:scale-90 transition-transform">+ {qa.n || qa.name}</button>))}
                </div>
              </div>
            </div>

            <button onClick={() => setIsShoppingMode(!isShoppingMode)} className={`shrink-0 w-full py-2 flex items-center justify-center gap-2 text-sm font-bold transition-colors border-b ${isShoppingMode ? 'bg-emerald-100 text-emerald-700 border-emerald-200 shadow-sm' : 'bg-neutral-50 text-neutral-500 border-neutral-100'}`}>{isShoppingMode ? <><Icons.ChevronDown size={18} /> ➕ 展開備戰區</> : <><Icons.ShoppingBag size={18} /> 🛒 收起並開始採買</>}</button>

            {displayFilterTags.length > 1 && (
              <div className="bg-white border-b border-neutral-100 flex overflow-x-auto scrollbar-hide shrink-0 shadow-sm">
                {displayFilterTags.map(tag => (
                  <button key={`filter-${tag}`} onClick={() => setFilterTag(tag)} className={`flex-1 min-w-[70px] py-2.5 text-sm font-bold transition-colors relative whitespace-nowrap px-2 ${filterTag === tag ? 'text-emerald-700 font-bold' : 'text-neutral-400 hover:text-neutral-600'}`}>{tag}{filterTag === tag && <div className="absolute bottom-0 left-0 right-0 h-0.5 bg-emerald-700" />}</button>
                ))}
              </div>
            )}

            <main className="p-4 space-y-3 bg-neutral-50/50">
              {filteredItems.length === 0 ? (
                <div className="py-20 flex flex-col items-center justify-center opacity-20 grayscale"><Icons.Cart size={64} /><p className="mt-4 font-bold tracking-widest text-lg text-neutral-400">目前沒有採買任務</p></div>
              ) : filteredItems.map(item => (
                <div key={item.id} className={`flex items-center justify-between p-4 rounded-2xl border transition-all ${item.completed ? 'bg-neutral-100 border-neutral-200 opacity-60 scale-[0.98]' : item.postponed ? 'bg-amber-50/50 border-amber-200 shadow-inner' : 'bg-white border-emerald-100 shadow-sm'}`}>
                  <div className="flex items-start gap-4 flex-1 min-w-0">
                    <div onClick={() => handleComplete(item)} className={`w-8 h-8 rounded-full border-2 flex items-center justify-center transition-colors shrink-0 cursor-pointer mt-1 ${item.completed ? 'bg-emerald-600 border-emerald-600 text-white shadow-inner' : 'border-neutral-300 bg-white'}`}>{item.completed && <Icons.Check size={18} />}</div>
                    <div className="flex flex-col min-w-0 flex-1">
                      <div className="flex items-center gap-2 flex-wrap">
                        <span onClick={() => handleComplete(item)} className={`text-lg font-bold truncate cursor-pointer ${item.completed ? 'line-through text-neutral-400' : item.postponed ? 'text-amber-800' : 'text-neutral-800'}`}>{item.name}</span>
                        {item.qty && <span className="bg-neutral-100 text-neutral-500 text-[11px] px-1.5 py-0.5 rounded font-bold whitespace-nowrap">{item.qty}</span>}
                        {!item.completed && (
                          <button onClick={(e) => { e.stopPropagation(); setRecordingPriceItem(item); }} className="px-2 py-0.5 rounded-lg bg-amber-100 text-amber-700 text-[10px] font-bold active:scale-90 transition-transform">記 $</button>
                        )}
                      </div>
                      
                      <div className="flex flex-col gap-1 mt-1">
                        <button onClick={(e) => { e.stopPropagation(); setEditingLocationItem(item); }} className={`text-[11px] px-2 py-0.5 rounded font-bold w-fit active:scale-95 transition-transform ${item.completed ? 'bg-neutral-200 text-neutral-400' : 'bg-[#e6f4ea] text-[#1e8e3e] border border-emerald-100'}`}>{item.tag || '無'}</button>
                        {history[item.name] && !item.completed && (
                          <div className="flex items-center gap-1 text-[11px] text-amber-600 font-bold whitespace-nowrap overflow-hidden italic">
                            <Icons.History size={11} />上次買：{history[item.name].price} 元 ({history[item.name].tag})
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                  
                  <div className="flex items-center ml-2 shrink-0">
                    {!item.completed && (
                      <button onClick={(e) => handlePostpone(e, item)} className={`p-2 rounded-lg transition-colors active:scale-75 ${item.postponed ? 'text-amber-500 bg-amber-100 shadow-inner' : 'text-neutral-300 hover:text-amber-500'}`}><Icons.Clock size={20} /></button>
                    )}
                    <button onClick={() => deleteDoc(getItemRef(item.id))} className="text-neutral-300 hover:text-red-500 p-2 active:scale-75 transition-all"><Icons.Trash /></button>
                  </div>
                </div>
              ))}

              <div className="pt-4 flex flex-col gap-3 items-center">
                {filteredItems.some(item => item.completed) && (
                  <button onClick={clearCompleted} className="flex items-center gap-1.5 px-6 py-2.5 text-red-500 bg-white border border-red-100 hover:bg-red-50 rounded-full transition-all font-bold active:scale-95 shadow-sm text-sm"><Icons.Trash size={18} /> 清除畫面中已買</button>
                )}
                {items.length > 0 && (
                  <button onClick={resetAllItems} className="flex items-center gap-1.5 px-4 py-2 text-neutral-400 hover:text-red-400 rounded-full transition-all font-bold active:scale-95 text-xs opacity-60"><Icons.Refresh /> 重設清單 (全刪)</button>
                )}
              </div>
            </main>

            {msg && <div className="absolute top-24 left-1/2 -translate-x-1/2 bg-neutral-800/90 text-white px-6 py-2 rounded-full text-sm font-bold shadow-2xl z-50 backdrop-blur-sm animate-bounce">{msg}</div>}

            {confirmModal.isOpen && (
              <div className="absolute inset-0 bg-black/60 z-[100] flex items-center justify-center p-6 backdrop-blur-sm">
                <div className="bg-white w-full max-w-xs rounded-3xl p-6 shadow-2xl animate-slide-up">
                  <h3 className="text-lg font-bold mb-3 text-red-600 flex items-center gap-2">{confirmModal.title}</h3>
                  <p className="text-sm text-neutral-600 mb-6 leading-relaxed font-bold">{confirmModal.message}</p>
                  <div className="flex gap-3">
                    <button onClick={() => setConfirmModal({ ...confirmModal, isOpen: false })} className="flex-1 py-3 text-neutral-400 font-bold bg-neutral-50 rounded-xl">取消</button>
                    <button onClick={confirmModal.onConfirm} className="flex-1 py-3 bg-red-500 text-white rounded-xl font-bold shadow-lg shadow-red-500/20 active:scale-95 transition-all text-white">確定</button>
                  </div>
                </div>
              </div>
            )}

            {editingLocationItem && (
              <div className="absolute inset-0 bg-black/60 z-[60] flex items-center justify-center p-6 backdrop-blur-sm" onClick={() => setEditingLocationItem(null)}>
                <div className="bg-white w-full max-w-xs rounded-3xl p-6 shadow-2xl animate-slide-up" onClick={e => e.stopPropagation()}>
                  <div className="flex justify-between items-center mb-4 border-b border-neutral-100 pb-2">
                    <h3 className="text-lg font-bold flex items-center gap-2 text-emerald-700"><Icons.Tag size={18}/>更換採買地點</h3>
                    <button onClick={() => setEditingLocationItem(null)} className="text-neutral-300"><Icons.X /></button>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    {customTags.map(t => (
                      <button 
                        key={t} 
                        onClick={async () => { 
                          await updateDoc(getItemRef(editingLocationItem.id), { tag: t }); 
                          setEditingLocationItem(null); 
                          setMsg('地點已更新！');
                          setTimeout(() => setMsg(''), 1500);
                        }} 
                        className={`py-3 rounded-xl font-bold text-sm border transition-all active:scale-95 ${editingLocationItem.tag === t ? 'bg-emerald-600 text-white border-emerald-600 shadow-md' : 'bg-neutral-50 text-neutral-600 border-neutral-200'}`}
                      >
                        {t}
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {recordingPriceItem && (
              <div className="absolute inset-0 bg-black/60 z-[60] flex items-end sm:items-center justify-center p-4 backdrop-blur-sm" onClick={() => setRecordingPriceItem(null)}>
                <div className="bg-white w-full max-w-sm rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl animate-slide-up" onClick={e => e.stopPropagation()}>
                  <div className="flex justify-between items-center mb-4 border-b border-neutral-100 pb-2">
                    <h3 className="text-lg font-bold flex items-center gap-2 text-amber-700"><Icons.Dollar size={18}/>紀錄目前價錢</h3>
                    <button onClick={() => setRecordingPriceItem(null)} className="text-neutral-300"><Icons.X /></button>
                  </div>
                  <p className="text-sm text-neutral-800 mb-1 font-bold">品項：{recordingPriceItem.name}</p>
                  
                  <div className="text-xs text-amber-600 mb-4 font-bold bg-amber-50 p-2 rounded-lg border border-amber-100 inline-block">
                    {history[recordingPriceItem.name] 
                      ? `上次紀錄：$${history[recordingPriceItem.name].price} (${history[recordingPriceItem.name].tag})`
                      : '目前尚無歷史紀錄'}
                  </div>

                  <div className="bg-neutral-50 p-4 rounded-2xl border border-neutral-200">
                    <label className="text-xs text-neutral-400 block mb-2 font-bold">請輸入本次看到的價格：</label>
                    <div className="flex gap-2">
                      <input type="number" id="quickP" autoFocus placeholder="填寫金額..." className="flex-1 p-2.5 rounded-lg border-2 border-emerald-100 outline-none focus:border-emerald-500 text-lg font-bold" />
                      <button onClick={() => { 
                        const val = document.getElementById('quickP').value; 
                        savePrice(recordingPriceItem.name, val, recordingPriceItem.tag); 
                        setRecordingPriceItem(null); 
                        setMsg('情報已更新！'); 
                        setTimeout(() => setMsg(''), 1500); 
                      }} className="bg-emerald-600 text-white px-5 rounded-lg font-bold active:scale-95 shadow-md text-white">紀錄</button>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {isTagOpen && (
              <div className="absolute inset-0 bg-black/60 z-50 flex items-center justify-center p-6 backdrop-blur-sm">
                <div className="bg-white w-full rounded-3xl p-6 shadow-2xl flex flex-col max-h-[80vh]">
                  <div className="flex justify-between items-center mb-4 shrink-0 font-bold text-emerald-700"><h2 className="text-lg flex items-center gap-2"><Icons.Tag size={20}/>雲端地點設定</h2><button onClick={() => setIsTagOpen(false)} className="text-neutral-400 p-1"><Icons.X /></button></div>
                  <div className="flex gap-2 mb-4 bg-emerald-50 p-3 rounded-xl shrink-0"><input type="text" value={newTagName} onChange={e => setNewTagName(e.target.value)} placeholder="新地點名稱" className="flex-1 px-3 py-2 rounded-lg border focus:ring-2 focus:ring-emerald-600 text-sm outline-none bg-white font-bold" /><button onClick={addTag} disabled={!newTagName.trim()} className="bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-bold disabled:opacity-50 shrink-0">新增</button></div>
                  <div className="overflow-y-auto space-y-2 pr-1 scrollbar-hide font-bold">
                    {customTags.map((t, idx) => (
                      <div key={t} className="flex justify-between items-center bg-neutral-50 p-3 rounded-xl border border-neutral-100 group">
                        <span className="text-neutral-700">{t}</span>
                        <div className="flex items-center gap-1">
                          {t !== '無' && (
                            <>
                              <button onClick={() => moveTag(idx, -1)} disabled={idx <= 1} className="p-1 text-neutral-400 hover:text-emerald-600 disabled:opacity-10"><Icons.ChevronUp /></button>
                              <button onClick={() => moveTag(idx, 1)} disabled={idx === customTags.length - 1} className="p-1 text-neutral-400 hover:text-emerald-600 disabled:opacity-10"><Icons.ChevronDown /></button>
                              <button onClick={() => delTag(t)} className="text-red-400 hover:bg-red-50 p-1.5 rounded-lg active:scale-75 transition-all ml-1"><Icons.Trash size={18}/></button>
                            </>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {isQuickOpen && (
              <div className="absolute inset-0 bg-black/60 z-50 flex items-center justify-center p-6 backdrop-blur-sm">
                <div className="bg-white w-full rounded-3xl p-6 shadow-2xl flex flex-col max-h-[80vh]">
                  <div className="flex justify-between items-center mb-4 shrink-0 font-bold text-amber-700"><h2 className="text-lg flex items-center gap-2"><Icons.Zap size={20}/>雲端清單設定</h2><button onClick={() => setIsQuickOpen(false)} className="text-neutral-400 p-1"><Icons.X /></button></div>
                  <div className="space-y-2 mb-4 bg-amber-50 p-3 rounded-xl shrink-0">
                    <input type="text" value={newQuickName} onChange={e => setNewQuickName(e.target.value)} placeholder="品名" className="w-full px-3 py-2 rounded-lg border text-sm outline-none mb-2 bg-white font-bold" />
                    <div className="flex gap-2"><select value={newQuickTag} onChange={e => setNewQuickTag(e.target.value)} className="flex-1 bg-white border rounded-lg px-2 text-sm font-bold outline-none">{customTags.map(t => <option key={t} value={t}>{t}</option>)}</select><button onClick={addQuick} disabled={!newQuickName.trim()} className="bg-amber-600 text-white px-4 py-2 rounded-lg text-sm font-bold disabled:opacity-50">新增</button></div>
                  </div>
                  <div className="overflow-y-auto space-y-2 pr-1 scrollbar-hide font-bold">
                    {quickItems.map((q, i) => (
                      <div key={i} className="flex justify-between items-center bg-neutral-50 p-3 rounded-xl border border-neutral-100 font-bold">
                        <div><div className="font-bold text-sm text-neutral-700">{q.n || q.name}</div><div className="text-[10px] text-amber-600 font-bold">{q.t || q.tag}</div></div>
                        <div className="flex items-center gap-1">
                          <button onClick={() => moveQuick(i, -1)} disabled={i === 0} className="p-1 text-neutral-400 hover:text-amber-600 disabled:opacity-10"><Icons.ChevronUp /></button>
                          <button onClick={() => moveQuick(i, 1)} disabled={i === quickItems.length - 1} className="p-1 text-neutral-400 hover:text-amber-600 disabled:opacity-10"><Icons.ChevronDown /></button>
                          <button onClick={() => delQuick(i)} className="text-red-400 hover:bg-red-50 p-1.5 rounded-lg active:scale-75 transition-all ml-1"><Icons.Trash size={18}/></button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {isRoomOpen && (
              <div className="absolute inset-0 bg-black/60 z-50 flex items-center justify-center p-6 backdrop-blur-sm">
                <div className="bg-white w-full rounded-3xl p-6 shadow-2xl animate-slide-up flex flex-col max-h-[85vh]">
                  <div className="flex justify-between items-center mb-4 shrink-0 font-bold text-emerald-800"><h2 className="text-xl flex items-center gap-2"><Icons.User size={20}/>共享頻道管理</h2><button onClick={() => setIsRoomOpen(false)} className="text-neutral-300"><Icons.X /></button></div>
                  
                  <div className="overflow-y-auto space-y-6 pr-1 scrollbar-hide">
                    {savedRooms.length > 0 && (
                      <div>
                        <h3 className="text-xs font-bold text-neutral-400 mb-3 flex items-center gap-1.5"><Icons.History size={14}/> 快速調頻 (記憶清單)</h3>
                        <div className="space-y-2">
                          {savedRooms.map(room => (
                            <div key={room.code} onClick={() => handleTuneRoom(room.code, room.note, true)} className={`flex justify-between items-center p-3 rounded-2xl border transition-all cursor-pointer ${roomCode === room.code ? 'bg-amber-50 border-amber-300 shadow-sm scale-[1.02]' : 'bg-neutral-50 border-neutral-100 hover:border-emerald-200'}`}>
                              <div className="flex flex-col">
                                <span className={`font-bold ${roomCode === room.code ? 'text-amber-700' : 'text-neutral-600'}`}>{room.code}</span>
                                {room.note && <span className="text-[10px] text-neutral-400 font-bold">{room.note}</span>}
                              </div>
                              <button onClick={(e) => handleForgetRoom(e, room.code)} className="p-1 text-neutral-300 hover:text-red-500 active:scale-75 transition-all"><Icons.X /></button>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}

                    <div className={savedRooms.length > 0 ? "pt-4 border-t border-dashed border-neutral-200" : ""}>
                      <h3 className="text-xs font-bold text-neutral-400 mb-3 flex items-center gap-1.5"><Icons.Plus size={14}/> 輸入新頻道代號與備註</h3>
                      <div className="space-y-3 mb-4">
                        <input type="text" id="rIn" placeholder="輸入代號 (如 888)..." className="w-full p-3 bg-neutral-100 rounded-xl outline-none border-2 border-emerald-100 focus:border-emerald-600 font-bold text-xl text-center tracking-widest text-emerald-800" />
                        <div className="flex gap-2">
                          <input type="text" id="rNote" placeholder="加個備註 (如：家裡用)" className="flex-1 p-3 bg-neutral-100 rounded-xl outline-none border-2 border-neutral-100 focus:border-emerald-500 font-bold text-sm" />
                          <button onClick={() => handleTuneRoom(document.getElementById('rIn').value, document.getElementById('rNote').value)} className="bg-emerald-700 text-white px-5 rounded-xl font-bold shadow-lg active:scale-95 transition-all text-white">對頻</button>
                        </div>
                      </div>
                    </div>

                    {roomCode && (
                      <button onClick={() => handleTuneRoom('')} className="w-full py-3 text-sm text-red-400 font-bold border-t border-neutral-100 mt-2">退出目前的共享頻道</button>
                    )}
                  </div>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
