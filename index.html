<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智能採買</title>
  
  <link id="manifest-link" rel="manifest" href="">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="智能採買">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&display=swap');
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .animate-slide-up { animation: slideUp 0.3s ease-out; }
    input:focus { font-size: 16px !important; }
    .font-serif-tc { font-family: 'Noto Serif TC', serif; }
    body { overflow-x: hidden; width: 100vw; }
    /* 防止拖曳時反白文字或觸發選單 */
    .no-select { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  </style>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const manifest = {
        name: "智能採買",
        short_name: "智能採買",
        start_url: window.location.pathname,
        display: "standalone",
        background_color: "#f5f5f5",
        theme_color: "#047857",
        icons: [{ src: "apple-touch-icon.png", sizes: "192x192 512x512 any", type: "image/png", purpose: "any maskable" }]
      };
      document.getElementById('manifest-link').href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
      
      if ('serviceWorker' in navigator) {
        const swCode = "self.addEventListener('install', (e) => self.skipWaiting()); self.addEventListener('activate', (e) => self.clients.claim()); self.addEventListener('fetch', (e) => {});";
        const swBlob = new Blob([swCode], {type: 'text/javascript'});
        navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(console.error);
      }
    });
  </script>
</head>
<body class="bg-neutral-100 text-neutral-800 antialiased font-sans min-h-screen flex justify-center">
  <div id="root" class="w-full flex justify-center"></div>

  <script type="text/babel" data-type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, setDoc, query, orderBy, writeBatch, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    const { useState, useEffect, useRef } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyC36SqZOaZR3iYfMMDg5NQlADKdwEaZ5bk",
      authDomain: "smart-buy-dbaae.firebaseapp.com",
      projectId: "smart-buy-dbaae",
      storageBucket: "smart-buy-dbaae.firebasestorage.app",
      messagingSenderId: "176643347488",
      appId: "1:176643347488:web:182ef57838ae4358e4d845",
      measurementId: "G-7E04LF7E9P"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = "smart-buy-final";

    const Icons = {
      Cart: () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>,
      Plus: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
      Trash: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>,
      Check: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><polyline points="20 6 9 17 4 12"/></svg>,
      Clock: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
      ChevronUp: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="m18 15-6-6-6 6"/></svg>,
      ChevronDown: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="m6 9 6 6 6-6"/></svg>,
      History: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8m0-5v5h5"/><polyline points="12 7 12 12 16 14"/></svg>,
      Dollar: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>,
      Share: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8m-4-6-4-4-4 4m4-4v13"/></svg>,
      User: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
      Settings: ({size = 18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
      X: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
      ShoppingBag: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>,
      Refresh: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>,
      Download: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>,
      ChevronDown: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="m6 9 6 6 6-6"/></svg>,
      MapPin: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>,
      Package: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M16.5 9.4 7.5 4.21"></path><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>,
      GripVertical: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="9" cy="12" r="1"></circle><circle cx="9" cy="5" r="1"></circle><circle cx="9" cy="19" r="1"></circle><circle cx="15" cy="12" r="1"></circle><circle cx="15" cy="5" r="1"></circle><circle cx="15" cy="19" r="1"></circle></svg>
    };

    const DEFAULT_TAGS = ['全聯', '菜市場'];
    const DEFAULT_QUICK = [{n:'雞蛋',t:'全聯'}, {n:'豆漿',t:'全聯'}];

    const App = () => {
      const [user, setUser] = useState(null);
      const [items, setItems] = useState([]);
      const [history, setHistory] = useState({});
      const [customTags, setCustomTags] = useState(DEFAULT_TAGS);
      const [quickItems, setQuickItems] = useState(DEFAULT_QUICK);
      
      const [inputValue, setInputValue] = useState('');
      const [qtyValue, setQtyValue] = useState('');
      const [activeTag, setActiveTag] = useState('');
      const [filterTag, setFilterTag] = useState('全部');
      const [isShoppingMode, setIsShoppingMode] = useState(false);
      const [roomCode, setRoomCode] = useState('');
      
      const [isRoomOpen, setIsRoomOpen] = useState(false);
      
      const [isTagAddOpen, setIsTagAddOpen] = useState(false);
      const [isTagManageOpen, setIsTagManageOpen] = useState(false);
      const [isQuickAddOpen, setIsQuickAddOpen] = useState(false);
      const [isQuickManageOpen, setIsQuickManageOpen] = useState(false);
      
      const [editingLocationItem, setEditingLocationItem] = useState(null);
      const [recordingPriceItem, setRecordingPriceItem] = useState(null);
      const [editingQtyItem, setEditingQtyItem] = useState(null);

      const [msg, setMsg] = useState('');
      const [newTagName, setNewTagName] = useState('');
      const [newQuickName, setNewQuickName] = useState('');
      const [newQuickTag, setNewQuickTag] = useState('無');

      const [confirmModal, setConfirmModal] = useState({ isOpen: false, title: '', message: '', onConfirm: null });
      const [deferredPrompt, setDeferredPrompt] = useState(null);

      const dragDidHappenTag = useRef(false);
      const touchTimerTag = useRef(null);
      const [hDragTagIdx, setHDragTagIdx] = useState(null);
      const [hDragOverTagIdx, setHDragOverTagIdx] = useState(null);

      const dragDidHappenQuick = useRef(false);
      const touchTimerQuick = useRef(null);
      const [hDragQuickIdx, setHDragQuickIdx] = useState(null);
      const [hDragOverQuickIdx, setHDragOverQuickIdx] = useState(null);

      const [draggedTagIdx, setDraggedTagIdx] = useState(null);
      const [dragOverTagIdx, setDragOverTagIdx] = useState(null);
      const [draggedQuickIdx, setDraggedQuickIdx] = useState(null);
      const [dragOverQuickIdx, setDragOverQuickIdx] = useState(null);

      const [savedRooms, setSavedRooms] = useState(() => {
        const saved = localStorage.getItem('smart_buy_saved_rooms');
        if (!saved) return [];
        const parsed = JSON.parse(saved);
        return parsed.map(r => typeof r === 'string' ? { code: r, note: '' } : r);
      });

      const [allTimeRooms, setAllTimeRooms] = useState(() => {
        const history = localStorage.getItem('smart_buy_room_history');
        return history ? JSON.parse(history) : [];
      });

      const inputRef = useRef(null);

      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const urlRoom = params.get('room');
        const savedRoom = localStorage.getItem('smart_buy_room') || '';
        const finalRoom = urlRoom || savedRoom;
        
        if (finalRoom) {
          setRoomCode(finalRoom);
          localStorage.setItem('smart_buy_room', finalRoom);
          if (urlRoom) window.history.replaceState({}, document.title, window.location.pathname);
        }

        onAuthStateChanged(auth, u => {
          if (u) setUser(u);
          else signInAnonymously(auth).catch(console.error);
        });

        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          setDeferredPrompt(e);
        });
      }, []);

      useEffect(() => {
        if (!user) return;
        const pathPrefix = roomCode ? `room_${roomCode}` : `user_${user.uid}`;
        const itemsCol = collection(db, 'artifacts', appId, 'public', 'data', `list_${pathPrefix}`);
        const histCol = collection(db, 'artifacts', appId, 'public', 'data', `hist_${pathPrefix}`);
        const configDoc = doc(db, 'artifacts', appId, 'public', 'data', `config_${pathPrefix}`, 'settings');

        const unsubItems = onSnapshot(query(itemsCol, orderBy('createdAt', 'desc')), snap => {
          setItems(snap.docs.map(d => ({ id: d.id, ...d.data() })));
        });

        const unsubHist = onSnapshot(histCol, snap => {
          const h = {}; snap.docs.forEach(d => h[d.data().name] = d.data()); setHistory(h);
        });

        const unsubConfig = onSnapshot(configDoc, (docSnap) => {
          if (docSnap.exists()) {
            const data = docSnap.data();
            if (data.tags) setCustomTags(data.tags);
            if (data.quick) setQuickItems(data.quick.filter(q => q && (q.n || q.name)));
          } else {
            setDoc(configDoc, { tags: DEFAULT_TAGS, quick: DEFAULT_QUICK });
          }
        });

        return () => { unsubItems(); unsubHist(); unsubConfig(); };
      }, [user, roomCode]);

      const getConfigRef = () => {
        const pathPrefix = roomCode ? `room_${roomCode}` : `user_${user.uid}`;
        return doc(db, 'artifacts', appId, 'public', 'data', `config_${pathPrefix}`, 'settings');
      };

      const getItemRef = (id) => {
        const pathPrefix = roomCode ? `room_${roomCode}` : `user_${user.uid}`;
        return doc(db, 'artifacts', appId, 'public', 'data', `list_${pathPrefix}`, id);
      };

      const handleAdd = async (e) => {
        if (e) e.preventDefault();
        if (!inputValue.trim() || !user) return;
        const pathPrefix = roomCode ? `room_${roomCode}` : `user_${user.uid}`;
        const finalTag = activeTag || '無';
        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', `list_${pathPrefix}`), {
          name: inputValue.trim(), qty: qtyValue.trim(), tag: finalTag, completed: false, postponed: false, createdAt: Date.now()
        });
        setInputValue(''); setQtyValue('');
      };

      const handleQuickSelect = (qa) => {
        setInputValue(qa.n || qa.name);
        setActiveTag(qa.t || qa.tag || '無');
        inputRef.current?.focus();
      };

      const handleComplete = async (item) => {
        await updateDoc(getItemRef(item.id), { completed: !item.completed, postponed: false });
      };

      const handlePostpone = async (e, item) => {
        e.stopPropagation();
        await updateDoc(getItemRef(item.id), { postponed: !item.postponed, completed: false });
      };

      const savePrice = async (itemName, price, itemTag, itemId) => {
        if (!price) return;
        const pathPrefix = roomCode ? `room_${roomCode}` : `user_${user.uid}`;
        const histDoc = doc(db, 'artifacts', appId, 'public', 'data', `hist_${pathPrefix}`, itemName);
        
        await setDoc(histDoc, { name: itemName, price, tag: itemTag, updatedAt: Date.now() });
        if (itemId) {
          const itemDoc = doc(db, 'artifacts', appId, 'public', 'data', `list_${pathPrefix}`, itemId);
          await updateDoc(itemDoc, { currentPrice: price });
        }
      };

      const clearCompleted = async () => {
        if (!user) return;
        const toDelete = items.filter(i => i.completed);
        for (const item of toDelete) {
          await deleteDoc(getItemRef(item.id));
        }
      };

      const resetAllItems = async () => {
        if (!user) return;
        setConfirmModal({
          isOpen: true,
          title: '陣地重整',
          message: '這將清空目前清單中「所有」物品，確定要執行嗎？',
          onConfirm: async () => {
            const pathPrefix = roomCode ? `room_${roomCode}` : `user_${user.uid}`;
            const itemsCol = collection(db, 'artifacts', appId, 'public', 'data', `list_${pathPrefix}`);
            const qSnap = await getDocs(itemsCol);
            const batch = writeBatch(db);
            qSnap.docs.forEach(d => batch.delete(d.ref));
            await batch.commit();
            setConfirmModal({ isOpen: false, title: '', message: '', onConfirm: null });
            setMsg('清單已全面重整');
            setTimeout(() => setMsg(''), 1500);
          }
        });
      };

      const copyLink = () => {
        const base = window.location.href.split('?')[0];
        const url = `${base}?room=${roomCode}`;
        const t = document.createElement("input"); t.value = url; document.body.appendChild(t); t.select(); document.execCommand("copy"); document.body.removeChild(t);
        setMsg('分享網址已複製！'); setTimeout(() => setMsg(''), 2000);
      };

      const moveTag = async (idx, dir) => {
        const newTags = [...customTags];
        const target = idx + dir;
        if (target < 0 || target >= newTags.length) return;
        [newTags[idx], newTags[target]] = [newTags[target], newTags[idx]];
        await setDoc(getConfigRef(), { tags: newTags }, { merge: true });
      };

      const moveQuick = async (idx, dir) => {
        const newQ = quickItems.map(q => ({n: q.n || q.name, t: q.t || q.tag}));
        const target = idx + dir;
        if (target < 0 || target >= newQ.length) return;
        [newQ[idx], newQ[target]] = [newQ[target], newQ[idx]];
        await setDoc(getConfigRef(), { quick: newQ }, { merge: true });
      };

      const addTag = async () => {
        if (!newTagName.trim()) return;
        const newTags = [...customTags, newTagName.trim()];
        await setDoc(getConfigRef(), { tags: newTags }, { merge: true });
        setNewTagName('');
      };
      const delTag = async (t) => {
        if (t === '無') return;
        const newTags = customTags.filter(tag => tag !== t);
        await setDoc(getConfigRef(), { tags: newTags }, { merge: true });
      };

      const addQuick = async () => {
        if (!newQuickName.trim()) return;
        const newQ = [...quickItems.map(q => ({n: q.n || q.name, t: q.t || q.tag})), { n: newQuickName.trim(), t: newQuickTag }];
        await setDoc(getConfigRef(), { quick: newQ }, { merge: true });
        setNewQuickName('');
      };
      const delQuick = async (idx) => {
        const newQ = quickItems.filter((_, i) => i !== idx).map(q => ({n: q.n || q.name, t: q.t || q.tag}));
        await setDoc(getConfigRef(), { quick: newQ }, { merge: true });
      };

      const handleTuneRoom = (v, note = '', force = false) => {
        const code = v.trim();
        if (!code) {
          setRoomCode('');
          localStorage.setItem('smart_buy_room', '');
          setIsRoomOpen(false);
          return;
        }

        const executeJoin = () => {
          setRoomCode(code);
          localStorage.setItem('smart_buy_room', code);
          const existingIdx = savedRooms.findIndex(r => r.code === code);
          let newSaved;
          if (existingIdx > -1) {
            newSaved = [...savedRooms];
            if (note) newSaved[existingIdx].note = note;
          } else {
            newSaved = [{ code, note }, ...savedRooms];
          }
          setSavedRooms(newSaved);
          localStorage.setItem('smart_buy_saved_rooms', JSON.stringify(newSaved));
          if (!allTimeRooms.includes(code)) {
            const newHistory = [...allTimeRooms, code];
            setAllTimeRooms(newHistory);
            localStorage.setItem('smart_buy_room_history', JSON.stringify(newHistory));
          }
          setIsRoomOpen(false);
          setMsg(`頻道 ${code} 已連線`);
          setTimeout(() => setMsg(''), 1500);
          setConfirmModal({ isOpen: false, title: '', message: '', onConfirm: null });
        };

        if (!force && allTimeRooms.includes(code) && code !== roomCode) {
           setConfirmModal({
             isOpen: true,
             title: '偵測到舊頻道',
             message: `代號 ${code} 之前已使用過，要切換並繼續連線嗎？`,
             onConfirm: executeJoin
           });
        } else {
           executeJoin();
        }
      };

      const handleForgetRoom = (e, code) => {
        e.stopPropagation();
        const newSaved = savedRooms.filter(r => r.code !== code);
        setSavedRooms(newSaved);
        localStorage.setItem('smart_buy_saved_rooms', JSON.stringify(newSaved));
        if (roomCode === code) {
          setRoomCode('');
          localStorage.setItem('smart_buy_room', '');
        }
      };

      const handleInstallApp = async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') setDeferredPrompt(null);
      };

      const handleDragStartTag = (e, idx) => {
        setDraggedTagIdx(idx);
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", idx);
      };
      const handleDragOverTag = (e, idx) => {
        e.preventDefault();
        setDragOverTagIdx(idx);
      };
      const handleDragEndTag = async () => {
        if (draggedTagIdx !== null && dragOverTagIdx !== null && draggedTagIdx !== dragOverTagIdx) {
          const newTags = [...customTags];
          const [movedItem] = newTags.splice(draggedTagIdx, 1);
          newTags.splice(dragOverTagIdx, 0, movedItem);
          setCustomTags(newTags);
          await setDoc(getConfigRef(), { tags: newTags }, { merge: true });
        }
        setDraggedTagIdx(null);
        setDragOverTagIdx(null);
      };
      const handleTouchMoveTag = (e) => {
        if (draggedTagIdx === null) return;
        const touch = e.touches[0];
        const target = document.elementFromPoint(touch.clientX, touch.clientY);
        const dropElem = target?.closest('[data-v-tag-index]');
        if (dropElem) {
          const hoverIdx = parseInt(dropElem.getAttribute('data-v-tag-index'), 10);
          if (hoverIdx !== dragOverTagIdx) setDragOverTagIdx(hoverIdx);
        }
      };

      const handleDragStartQuick = (e, idx) => {
        setDraggedQuickIdx(idx);
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", idx);
      };
      const handleDragOverQuick = (e, idx) => {
        e.preventDefault();
        setDragOverQuickIdx(idx);
      };
      const handleDragEndQuick = async () => {
        if (draggedQuickIdx !== null && dragOverQuickIdx !== null && draggedQuickIdx !== dragOverQuickIdx) {
          const newQ = [...quickItems];
          const [movedItem] = newQ.splice(draggedQuickIdx, 1);
          newQ.splice(dragOverQuickIdx, 0, movedItem);
          setQuickItems(newQ);
          const serialized = newQ.map(q => ({n: q.n || q.name, t: q.t || q.tag}));
          await setDoc(getConfigRef(), { quick: serialized }, { merge: true });
        }
        setDraggedQuickIdx(null);
        setDragOverQuickIdx(null);
      };
      const handleTouchMoveQuick = (e) => {
        if (draggedQuickIdx === null) return;
        const touch = e.touches[0];
        const target = document.elementFromPoint(touch.clientX, touch.clientY);
        const dropElem = target?.closest('[data-v-quick-index]');
        if (dropElem) {
          const hoverIdx = parseInt(dropElem.getAttribute('data-v-quick-index'), 10);
          if (hoverIdx !== dragOverQuickIdx) setDragOverQuickIdx(hoverIdx);
        }
      };

      const onTouchStartHTag = (idx, e) => {
        dragDidHappenTag.current = false;
        touchTimerTag.current = setTimeout(() => {
          setHDragTagIdx(idx);
          dragDidHappenTag.current = true;
          if (navigator.vibrate) navigator.vibrate(50);
        }, 400);
      };
      const onTouchMoveHTag = (e) => {
        if (hDragTagIdx === null) {
          clearTimeout(touchTimerTag.current);
          return;
        }
        e.preventDefault();
        const touch = e.touches[0];
        const target = document.elementFromPoint(touch.clientX, touch.clientY);
        const dropElem = target?.closest('[data-h-tag-index]');
        if (dropElem) {
          const overIdx = parseInt(dropElem.getAttribute('data-h-tag-index'), 10);
          if (overIdx !== hDragOverTagIdx && overIdx !== hDragTagIdx) {
            setHDragOverTagIdx(overIdx);
          }
        }
      };
      const onTouchEndHTag = async () => {
        clearTimeout(touchTimerTag.current);
        if (hDragTagIdx !== null) {
          if (hDragOverTagIdx !== null && hDragTagIdx !== hDragOverTagIdx) {
            const newTags = [...customTags];
            const [movedItem] = newTags.splice(hDragTagIdx, 1);
            newTags.splice(hDragOverTagIdx, 0, movedItem);
            setCustomTags(newTags);
            await setDoc(getConfigRef(), { tags: newTags }, { merge: true });
          }
          setHDragTagIdx(null);
          setHDragOverTagIdx(null);
        }
      };

      const onTouchStartHQuick = (idx, e) => {
        dragDidHappenQuick.current = false;
        touchTimerQuick.current = setTimeout(() => {
          setHDragQuickIdx(idx);
          dragDidHappenQuick.current = true;
          if (navigator.vibrate) navigator.vibrate(50);
        }, 400);
      };
      const onTouchMoveHQuick = (e) => {
        if (hDragQuickIdx === null) {
          clearTimeout(touchTimerQuick.current);
          return;
        }
        e.preventDefault();
        const touch = e.touches[0];
        const target = document.elementFromPoint(touch.clientX, touch.clientY);
        const dropElem = target?.closest('[data-h-quick-index]');
        if (dropElem) {
          const overIdx = parseInt(dropElem.getAttribute('data-h-quick-index'), 10);
          if (overIdx !== hDragOverQuickIdx && overIdx !== hDragQuickIdx) {
            setHDragOverQuickIdx(overIdx);
          }
        }
      };
      const onTouchEndHQuick = async () => {
        clearTimeout(touchTimerQuick.current);
        if (hDragQuickIdx !== null) {
          if (hDragOverQuickIdx !== null && hDragQuickIdx !== hDragOverQuickIdx) {
            const newQ = [...quickItems];
            const [movedItem] = newQ.splice(hDragQuickIdx, 1);
            newQ.splice(hDragOverQuickIdx, 0, movedItem);
            setQuickItems(newQ);
            const serialized = newQ.map(q => ({n: q.n || q.name, t: q.t || q.tag}));
            await setDoc(getConfigRef(), { quick: serialized }, { merge: true });
          }
          setHDragQuickIdx(null);
          setHDragOverQuickIdx(null);
        }
      };

      const activeTagsInList = Array.from(new Set(items.map(item => item.tag))).filter(t => t);
      const displayFilterTags = ['全部', ...['無', ...customTags].filter(tag => activeTagsInList.includes(tag))];
      const filteredItems = items.filter(item => filterTag === '全部' ? true : item.tag === filterTag);

      return (
        <div className="min-h-screen bg-neutral-100 flex justify-center items-start sm:pt-8 font-sans w-full">
          <div className="w-full max-w-md bg-white h-fit min-h-[100vh] sm:min-h-[500px] flex flex-col relative shadow-2xl overflow-hidden sm:rounded-3xl mb-8">
            
            <header className="bg-emerald-700 text-white px-3 py-4 flex justify-between items-center shrink-0 shadow-lg z-20">
              <div className="flex items-center gap-2 text-white font-bold">
                <Icons.Cart />
                <h1 className="text-xl sm:text-2xl tracking-tight font-serif-tc">智能採買</h1>
                {deferredPrompt && (
                  <button onClick={handleInstallApp} className="ml-1 p-1.5 bg-white/20 rounded-full active:scale-90 animate-pulse">
                    <Icons.Download />
                  </button>
                )}
              </div>
              <div className="flex gap-2 shrink-0">
                {roomCode && <button onClick={copyLink} className="bg-white/20 p-2 rounded-lg active:scale-90 transition-all text-white"><Icons.Share /></button>}
                <button onClick={() => setIsRoomOpen(true)} className={`px-2.5 py-1.5 rounded-lg text-xs sm:text-sm font-bold flex items-center gap-1 transition-all ${roomCode ? 'bg-amber-400 text-amber-900 shadow-inner' : 'bg-emerald-600 text-white border border-emerald-500'}`}>{roomCode ? `頻道 ${roomCode}` : <><Icons.User size={14}/> 進入頻道</>}</button>
              </div>
            </header>

            <div className={`transition-all duration-300 ease-in-out origin-top overflow-hidden bg-emerald-50 shrink-0 shadow-sm ${isShoppingMode ? 'max-h-0 opacity-0' : 'max-h-[400px] opacity-100 border-b border-emerald-100'}`}>
              <div className="p-3 space-y-3">
                <form onSubmit={handleAdd} className="flex gap-2 items-center">
                  <input ref={inputRef} type="text" value={inputValue} onChange={e => setInputValue(e.target.value)} placeholder="例如：雞蛋" className="flex-1 min-w-0 p-3 rounded-xl border-none shadow-inner focus:ring-2 focus:ring-emerald-600 outline-none text-lg bg-white" />
                  <input type="text" value={qtyValue} onChange={e => setQtyValue(e.target.value)} placeholder="數量" className="w-14 sm:w-16 p-3 rounded-xl border-none shadow-inner text-center outline-none text-base bg-white" />
                  <button type="submit" className="bg-emerald-700 text-white p-3 rounded-xl shadow-lg active:scale-95 transition-transform shrink-0"><Icons.Plus /></button>
                </form>
                
                <div 
                  className="flex items-center gap-2 overflow-x-auto scrollbar-hide pb-1 relative" 
                  style={{ touchAction: hDragTagIdx !== null ? 'none' : 'pan-x pan-y' }}
                >
                  <button type="button" onClick={() => setIsTagManageOpen(true)} className="shrink-0 text-emerald-600 flex items-center justify-center p-1.5 bg-emerald-100 rounded-full hover:bg-emerald-200 transition-colors active:scale-95 shadow-sm">
                    <Icons.Settings />
                  </button>
                  {customTags.map((t, idx) => (
                    <button 
                      key={t} 
                      type="button" 
                      data-h-tag-index={idx}
                      onTouchStart={(e) => onTouchStartHTag(idx, e)}
                      onTouchMove={onTouchMoveHTag}
                      onTouchEnd={onTouchEndHTag}
                      onTouchCancel={onTouchEndHTag}
                      onClick={() => {
                        if (dragDidHappenTag.current) { dragDidHappenTag.current = false; return; }
                        setActiveTag(activeTag === t ? '' : t);
                      }}
                      className={`shrink-0 px-3 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-all no-select
                        ${hDragTagIdx === idx ? 'scale-110 opacity-80 shadow-xl bg-emerald-500 text-white z-50' : ''}
                        ${hDragOverTagIdx === idx && hDragTagIdx !== idx ? 'border-2 border-dashed border-emerald-500 scale-105' : ''}
                        ${hDragTagIdx === null && activeTag === t ? 'bg-emerald-700 text-white shadow-md' : hDragTagIdx === null ? 'bg-white text-emerald-700 border border-emerald-200' : ''}
                      `}
                    >
                      {t}
                    </button>
                  ))}
                  <button type="button" onClick={() => setIsTagAddOpen(true)} className="shrink-0 px-3 py-1.5 rounded-full text-xs font-bold text-emerald-600 bg-emerald-50 border border-emerald-200 border-dashed active:scale-95 transition-transform flex items-center justify-center">
                    <Icons.Plus size={14} />
                  </button>
                </div>
                
                <div 
                  className="flex items-center gap-2 overflow-x-auto scrollbar-hide pt-1 text-xs border-t border-emerald-100/50 pt-2 mt-1 relative"
                  style={{ touchAction: hDragQuickIdx !== null ? 'none' : 'pan-x pan-y' }}
                >
                  <button type="button" onClick={() => setIsQuickManageOpen(true)} className="shrink-0 text-amber-600 flex items-center justify-center p-1.5 bg-amber-100 rounded-full hover:bg-amber-200 transition-colors active:scale-95 shadow-sm">
                    <Icons.Settings />
                  </button>
                  {quickItems.map((qa, i) => (
                    <button 
                      key={i} 
                      type="button" 
                      data-h-quick-index={i}
                      onTouchStart={(e) => onTouchStartHQuick(i, e)}
                      onTouchMove={onTouchMoveHQuick}
                      onTouchEnd={onTouchEndHQuick}
                      onTouchCancel={onTouchEndHQuick}
                      onClick={() => {
                        if (dragDidHappenQuick.current) { dragDidHappenQuick.current = false; return; }
                        handleQuickSelect(qa);
                      }}
                      className={`whitespace-nowrap px-3 py-1.5 rounded-full font-bold active:scale-90 transition-all no-select
                        ${hDragQuickIdx === i ? 'scale-110 opacity-80 shadow-xl bg-amber-500 text-white z-50' : ''}
                        ${hDragOverQuickIdx === i && hDragQuickIdx !== i ? 'border-2 border-dashed border-amber-500 scale-105' : ''}
                        ${hDragQuickIdx === null ? 'bg-amber-50 border border-amber-200 text-amber-700' : ''}
                      `}
                    >
                      + {qa.n || qa.name}
                    </button>
                  ))}
                  <button type="button" onClick={() => setIsQuickAddOpen(true)} className="shrink-0 px-3 py-1.5 rounded-full text-xs font-bold text-amber-600 bg-amber-50 border border-amber-200 border-dashed active:scale-95 transition-transform flex items-center justify-center">
                    <Icons.Plus size={14} />
                  </button>
                </div>
              </div>
            </div>

            <button onClick={() => setIsShoppingMode(!isShoppingMode)} className={`shrink-0 w-full py-3 flex items-center justify-center gap-2 text-sm font-bold transition-colors border-b ${isShoppingMode ? 'bg-emerald-100 text-emerald-700 border-emerald-200 shadow-sm' : 'bg-neutral-50 text-neutral-500 border-neutral-100 hover:bg-neutral-100'}`}>{isShoppingMode ? <><Icons.ChevronDown size={18} /> ➕ 展開備戰區</> : <><Icons.ShoppingBag size={18} /> 🛒 收起並開始採買</>}</button>

            {displayFilterTags.length > 1 && (
              <div className="bg-white border-b border-neutral-100 flex overflow-x-auto scrollbar-hide shrink-0 shadow-sm">
                {displayFilterTags.map(tag => (
                  <button key={`filter-${tag}`} onClick={() => setFilterTag(tag)} className={`flex-1 min-w-[70px] py-3 text-sm font-bold transition-colors relative whitespace-nowrap px-2 ${filterTag === tag ? 'text-emerald-700 font-bold' : 'text-neutral-400 hover:text-neutral-600 bg-neutral-50/20'}`}>{tag}{filterTag === tag && <div className="absolute bottom-0 left-0 right-0 h-0.5 bg-emerald-700" />}</button>
                ))}
              </div>
            )}

            <main className="p-3 space-y-3 bg-neutral-50/50 flex-1">
              {filteredItems.length === 0 ? (
                <div className="py-20 flex flex-col items-center justify-center opacity-20 grayscale"><Icons.Cart size={64} /><p className="mt-4 font-bold tracking-widest text-lg text-neutral-400 font-serif-tc">目前沒有採買任務</p></div>
              ) : filteredItems.map(item => (
                <div key={item.id} className={`flex items-start gap-3 p-3 rounded-2xl border transition-all ${item.completed ? 'bg-neutral-100 border-neutral-200 opacity-60 scale-[0.98]' : item.postponed ? 'bg-amber-50/50 border-amber-200 shadow-inner' : 'bg-white border-emerald-100 shadow-sm'}`}>
                  
                  {/* 第一區塊：打勾按鈕 */}
                  <div onClick={() => handleComplete(item)} className={`w-8 h-8 rounded-full border-2 flex items-center justify-center transition-colors shrink-0 mt-0.5 cursor-pointer ${item.completed ? 'bg-emerald-600 border-emerald-600 text-white shadow-inner' : 'border-neutral-300 bg-white'}`}>{item.completed && <Icons.Check size={18} />}</div>
                  
                  {/* 第二區塊：右側所有情報與操作 (加入 flex-1 確保佔滿並擠壓內部) */}
                  <div className="flex flex-col min-w-0 flex-1 gap-2 w-full">
                    
                    {/* 第一列：品名、數量、記錢按鈕 */}
                    <div className="flex items-center justify-between gap-2 w-full">
                      {/* 加入 flex-1 確保品名能佔滿並優雅 truncate，不會消失 */}
                      <div className="flex items-center gap-2 min-w-0 flex-1">
                        <span onClick={() => handleComplete(item)} className={`text-lg font-bold truncate cursor-pointer ${item.completed ? 'line-through text-neutral-400' : item.postponed ? 'text-amber-800' : 'text-neutral-800'}`}>{item.name}</span>
                        {item.qty ? (
                          <button onClick={(e) => { e.stopPropagation(); if(!item.completed) setEditingQtyItem(item); }} disabled={item.completed} className={`text-[10px] px-1.5 py-0.5 rounded font-bold whitespace-nowrap shrink-0 transition-transform ${item.completed ? 'bg-transparent text-neutral-400' : 'bg-neutral-100 text-neutral-600 active:scale-90 hover:bg-neutral-200 shadow-sm'}`}>
                            {item.qty}
                          </button>
                        ) : (
                          !item.completed && (
                            <button onClick={(e) => { e.stopPropagation(); setEditingQtyItem(item); }} className="text-[10px] px-1.5 py-0.5 rounded border border-dashed border-neutral-300 text-neutral-400 font-bold whitespace-nowrap shrink-0 active:scale-90 transition-transform">
                              +數量
                            </button>
                          )
                        )}
                      </div>

                      {!item.completed && (
                        <button onClick={(e) => { e.stopPropagation(); setRecordingPriceItem(item); }} className={`px-2.5 py-1 rounded-lg text-xs font-bold active:scale-90 transition-transform shrink-0 whitespace-nowrap ${item.currentPrice ? 'bg-emerald-100 text-emerald-700 border border-emerald-200 shadow-sm' : 'bg-amber-100 text-amber-700 shadow-sm'}`}>
                          {item.currentPrice ? `現價 $${item.currentPrice}` : '記 $'}
                        </button>
                      )}
                    </div>
                    
                    {/* 第二列：地點標籤、上次買、右側動作按鈕 */}
                    <div className="flex items-center justify-between gap-2 w-full">
                      <div className="flex items-center gap-2 min-w-0 flex-1">
                        <button onClick={(e) => { e.stopPropagation(); setEditingLocationItem(item); }} className={`shrink-0 text-[10px] px-2 py-0.5 rounded font-bold active:scale-95 transition-transform ${item.completed ? 'bg-neutral-200 text-neutral-400' : 'bg-[#e6f4ea] text-[#1e8e3e] border border-emerald-100'}`}>
                          {item.tag || '無'}
                        </button>
                        {history[item.name] && !item.completed && (
                          <span className="text-[10px] text-amber-600 font-bold truncate text-right whitespace-nowrap">
                            上次買：${history[item.name].price} ({history[item.name].tag})
                          </span>
                        )}
                      </div>
                      <div className="flex items-center gap-1 shrink-0">
                        {!item.completed && (
                          <button onClick={(e) => handlePostpone(e, item)} className={`p-1.5 rounded-lg transition-colors active:scale-75 ${item.postponed ? 'text-amber-500 bg-amber-100 shadow-inner' : 'text-neutral-300 hover:text-amber-500'}`}><Icons.Clock size={18} /></button>
                        )}
                        <button onClick={() => deleteDoc(getItemRef(item.id))} className="p-1.5 text-neutral-300 hover:text-red-500 active:scale-75 transition-all"><Icons.Trash size={18} /></button>
                      </div>
                    </div>

                  </div>
                </div>
              ))}

              <div className="pt-6 flex flex-col gap-4 items-center mb-10">
                {filteredItems.some(item => item.completed) && (
                  <button onClick={clearCompleted} className="flex items-center gap-1.5 px-6 py-3 text-red-500 bg-white border border-red-100 hover:bg-red-50 rounded-full transition-all font-bold active:scale-95 shadow-sm text-sm"><Icons.Trash size={18} /> 清除畫面中已買</button>
                )}
                {items.length > 0 && (
                  <button onClick={resetAllItems} className="flex items-center gap-1.5 px-4 py-2 text-neutral-400 hover:text-red-400 rounded-full transition-all font-bold active:scale-95 text-xs opacity-60"><Icons.Refresh /> 重設清單 (全刪)</button>
                )}
              </div>
            </main>

            {msg && <div className="fixed top-24 left-1/2 -translate-x-1/2 bg-neutral-800/90 text-white px-6 py-2 rounded-full text-sm font-bold shadow-2xl z-[100] backdrop-blur-sm animate-bounce">{msg}</div>}

            {confirmModal.isOpen && (
              <div className="fixed inset-0 bg-black/60 z-[200] flex items-center justify-center p-6 backdrop-blur-sm">
                <div className="bg-white w-full max-w-xs rounded-3xl p-6 shadow-2xl animate-slide-up">
                  <h3 className="text-lg font-bold mb-3 text-red-600 flex items-center gap-2">{confirmModal.title}</h3>
                  <p className="text-sm text-neutral-600 mb-6 leading-relaxed font-bold">{confirmModal.message}</p>
                  <div className="flex gap-3">
                    <button onClick={() => setConfirmModal({ ...confirmModal, isOpen: false })} className="flex-1 py-3 text-neutral-400 font-bold bg-neutral-50 rounded-xl">取消</button>
                    <button onClick={confirmModal.onConfirm} className="flex-1 py-3 bg-red-500 text-white rounded-xl font-bold shadow-lg active:scale-95 transition-all text-white">確定</button>
                  </div>
                </div>
              </div>
            )}

            {/* 更換地點彈窗 */}
            {editingLocationItem && (
              <div className="fixed inset-0 bg-black/60 z-[110] flex items-center justify-center p-6 backdrop-blur-sm" onClick={() => setEditingLocationItem(null)}>
                <div className="bg-white w-full max-w-xs rounded-3xl p-6 shadow-2xl animate-slide-up" onClick={e => e.stopPropagation()}>
                  <div className="flex justify-between items-center mb-4 border-b border-neutral-100 pb-2">
                    <h3 className="text-lg font-bold flex items-center gap-2 text-emerald-700 font-serif-tc"><Icons.MapPin size={18}/>更換採買地點</h3>
                    <button onClick={() => setEditingLocationItem(null)} className="text-neutral-300"><Icons.X /></button>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    {['無', ...customTags].map(t => (
                      <button key={t} onClick={async () => { await updateDoc(getItemRef(editingLocationItem.id), { tag: t === '無' ? '' : t }); setEditingLocationItem(null); setMsg('地點已更新！'); setTimeout(() => setMsg(''), 1500); }} className={`py-3 rounded-xl font-bold text-sm border transition-all active:scale-95 ${editingLocationItem.tag === t || (t === '無' && !editingLocationItem.tag) ? 'bg-emerald-600 text-white shadow-md' : 'bg-neutral-50 text-neutral-600'}`}>
                        {t}
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* 修改數量彈窗 */}
            {editingQtyItem && (
              <div className="fixed inset-0 bg-black/60 z-[110] flex items-end sm:items-center justify-center p-4 backdrop-blur-sm" onClick={() => setEditingQtyItem(null)}>
                <div className="bg-white w-full max-w-sm rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl animate-slide-up" onClick={e => e.stopPropagation()}>
                  <div className="flex justify-between items-center mb-4 border-b border-neutral-100 pb-2">
                    <h3 className="text-lg font-bold flex items-center gap-2 text-emerald-700 font-serif-tc"><Icons.Settings size={18}/>修改裝備數量</h3>
                    <button onClick={() => setEditingQtyItem(null)} className="text-neutral-300"><Icons.X /></button>
                  </div>
                  <p className="text-sm text-neutral-800 mb-1 font-bold">品項：{editingQtyItem.name}</p>
                  <div className="bg-neutral-50 p-4 rounded-2xl border border-neutral-200 mt-4">
                    <label className="text-xs text-neutral-400 block mb-3 font-bold">請輸入新的數量 (如：2盒、3斤)：</label>
                    <div className="flex flex-col gap-3">
                      <input type="text" id="editQtyIn" defaultValue={editingQtyItem.qty} autoFocus placeholder="填寫數量..." className="w-full p-3 rounded-xl border-2 border-emerald-100 outline-none focus:border-emerald-500 text-xl font-bold text-center" />
                      <div className="flex gap-2">
                        <button onClick={() => { updateDoc(getItemRef(editingQtyItem.id), { qty: '' }); setEditingQtyItem(null); setMsg('數量已清除！'); setTimeout(() => setMsg(''), 1500); }} className="flex-1 bg-neutral-200 text-neutral-600 p-3 rounded-xl font-bold active:scale-95 shadow-md">清除</button>
                        <button onClick={() => { const val = document.getElementById('editQtyIn').value.trim(); updateDoc(getItemRef(editingQtyItem.id), { qty: val }); setEditingQtyItem(null); setMsg('數量已更新！'); setTimeout(() => setMsg(''), 1500); }} className="flex-[2] bg-emerald-600 text-white p-3 rounded-xl font-bold active:scale-95 shadow-md">確定更新</button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* 紀錄價錢彈窗 */}
            {recordingPriceItem && (
              <div className="fixed inset-0 bg-black/60 z-[110] flex items-end sm:items-center justify-center p-4 backdrop-blur-sm" onClick={() => setRecordingPriceItem(null)}>
                <div className="bg-white w-full max-w-sm rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl animate-slide-up" onClick={e => e.stopPropagation()}>
                  <div className="flex justify-between items-center mb-4 border-b border-neutral-100 pb-2">
                    <h3 className="text-lg font-bold flex items-center gap-2 text-amber-700 font-serif-tc"><Icons.Dollar size={18}/>紀錄現場價錢</h3>
                    <button onClick={() => setRecordingPriceItem(null)} className="text-neutral-300"><Icons.X /></button>
                  </div>
                  <p className="text-sm text-neutral-800 mb-1 font-bold">品項：{recordingPriceItem.name}</p>
                  <div className="text-xs text-amber-600 mb-4 font-bold bg-amber-50 p-2 rounded-lg border border-amber-100 inline-block italic">
                    {history[recordingPriceItem.name] ? `上次買：$${history[recordingPriceItem.name].price} (${history[recordingPriceItem.name].tag})` : '目前尚無歷史紀錄'}
                  </div>
                  <div className="bg-neutral-50 p-4 rounded-2xl border border-neutral-200">
                    <label className="text-xs text-neutral-400 block mb-3 font-bold">請輸入本次看到的價格：</label>
                    <div className="flex flex-col gap-3">
                      <input type="number" id="quickP" autoFocus placeholder="金額..." className="w-full p-3 rounded-xl border-2 border-emerald-100 outline-none focus:border-emerald-500 text-xl font-bold text-center" />
                      <button onClick={() => { const val = document.getElementById('quickP').value; savePrice(recordingPriceItem.name, val, recordingPriceItem.tag, recordingPriceItem.id); setRecordingPriceItem(null); setMsg('現場價格已紀錄！'); setTimeout(() => setMsg(''), 1500); }} className="w-full bg-emerald-600 text-white p-3 rounded-xl font-bold active:scale-95 shadow-md text-white">確定紀錄</button>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* 新增地點專用彈窗 (單純新增) */}
            {isTagAddOpen && (
              <div className="fixed inset-0 bg-black/60 z-[120] flex items-center justify-center p-4 backdrop-blur-sm" onClick={() => setIsTagAddOpen(false)}>
                <div className="bg-white w-full max-w-sm rounded-3xl p-5 shadow-2xl flex flex-col" onClick={e => e.stopPropagation()}>
                  <div className="flex justify-between items-center mb-4 shrink-0 font-bold text-emerald-700 font-serif-tc">
                    <h2 className="text-lg flex items-center gap-2"><Icons.Plus size={20}/>新增地點</h2>
                    <button onClick={() => setIsTagAddOpen(false)} className="text-neutral-400 p-1"><Icons.X /></button>
                  </div>
                  <div className="flex gap-2 bg-emerald-50 p-3 rounded-xl shrink-0">
                    <input type="text" value={newTagName} onChange={e => setNewTagName(e.target.value)} placeholder="輸入新地點..." className="flex-1 px-3 py-2 rounded-lg border focus:ring-2 focus:ring-emerald-600 text-sm outline-none bg-white font-bold" autoFocus />
                    <button onClick={() => { addTag(); setIsTagAddOpen(false); }} disabled={!newTagName.trim()} className="bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-bold disabled:opacity-50 shrink-0">新增</button>
                  </div>
                </div>
              </div>
            )}

            {/* 管理地點彈窗 (垂直排序與刪除) */}
            {isTagManageOpen && (
              <div className="fixed inset-0 bg-black/60 z-[120] flex items-center justify-center p-4 backdrop-blur-sm" onClick={() => setIsTagManageOpen(false)}>
                <div className="bg-white w-full max-w-sm rounded-3xl p-5 shadow-2xl flex flex-col max-h-[85vh]" onClick={e => e.stopPropagation()}>
                  <div className="flex justify-between items-center mb-4 shrink-0 font-bold text-emerald-700 font-serif-tc">
                    <h2 className="text-lg flex items-center gap-2"><Icons.Settings size={20}/>管理地點 (排序/刪除)</h2>
                    <button onClick={() => setIsTagManageOpen(false)} className="text-neutral-400 p-1"><Icons.X /></button>
                  </div>
                  <p className="text-xs text-neutral-400 mb-2 font-bold flex justify-center items-center gap-1"><Icons.GripVertical size={12} /> 拖曳左側圖示即可自由排序</p>
                  <div className="overflow-y-auto space-y-2 pr-1 scrollbar-hide font-bold relative">
                    {customTags.length === 0 && <div className="text-center text-neutral-400 py-4 text-sm">目前無自訂地點</div>}
                    {customTags.map((t, idx) => (
                      <div 
                        key={t} 
                        data-v-tag-index={idx}
                        draggable
                        onDragStart={(e) => handleDragStartTag(e, idx)}
                        onDragOver={(e) => handleDragOverTag(e, idx)}
                        onDragEnd={handleDragEndTag}
                        onTouchStart={() => setDraggedTagIdx(idx)}
                        onTouchMove={handleTouchMoveTag}
                        onTouchEnd={handleDragEndTag}
                        className={`flex justify-between items-center bg-neutral-50 p-2 rounded-xl border transition-all no-select ${dragOverTagIdx === idx ? 'border-emerald-500 bg-emerald-100 shadow-md -translate-y-1 scale-[1.02]' : 'border-neutral-100'}`}
                      >
                        <div className="flex items-center gap-2">
                          <div className="cursor-move p-2 text-neutral-400 hover:text-emerald-600 touch-none"><Icons.GripVertical /></div>
                          <span className="text-neutral-700">{t}</span>
                        </div>
                        <button onClick={() => delTag(t)} className="text-red-400 hover:bg-red-50 p-2 rounded-lg active:scale-75 transition-all"><Icons.Trash size={18}/></button>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* 新增常買品項專用彈窗 (單純新增) */}
            {isQuickAddOpen && (
              <div className="fixed inset-0 bg-black/60 z-[120] flex items-center justify-center p-4 backdrop-blur-sm" onClick={() => setIsQuickAddOpen(false)}>
                <div className="bg-white w-full max-w-sm rounded-3xl p-5 shadow-2xl flex flex-col" onClick={e => e.stopPropagation()}>
                  <div className="flex justify-between items-center mb-4 shrink-0 font-bold text-amber-700 font-serif-tc">
                    <h2 className="text-lg flex items-center gap-2"><Icons.Plus size={20}/>新增常買品項</h2>
                    <button onClick={() => setIsQuickAddOpen(false)} className="text-neutral-400 p-1"><Icons.X /></button>
                  </div>
                  <div className="space-y-2 bg-amber-50 p-3 rounded-xl shrink-0">
                    <input type="text" value={newQuickName} onChange={e => setNewQuickName(e.target.value)} placeholder="輸入品項..." className="w-full px-3 py-2 rounded-lg border text-sm outline-none mb-2 bg-white font-bold" autoFocus />
                    <div className="flex gap-2">
                      <select value={newQuickTag} onChange={e => setNewQuickTag(e.target.value)} className="flex-1 bg-white border rounded-lg px-2 text-sm font-bold outline-none">
                        <option value="無">無</option>
                        {customTags.map(t => <option key={t} value={t}>{t}</option>)}
                      </select>
                      <button onClick={() => { addQuick(); setIsQuickAddOpen(false); }} disabled={!newQuickName.trim()} className="bg-amber-600 text-white px-4 py-2 rounded-lg text-sm font-bold disabled:opacity-50">新增</button>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* 管理常買品項彈窗 (垂直排序與刪除) */}
            {isQuickManageOpen && (
              <div className="fixed inset-0 bg-black/60 z-[120] flex items-center justify-center p-4 backdrop-blur-sm" onClick={() => setIsQuickManageOpen(false)}>
                <div className="bg-white w-full max-w-sm rounded-3xl p-5 shadow-2xl flex flex-col max-h-[85vh]" onClick={e => e.stopPropagation()}>
                  <div className="flex justify-between items-center mb-4 shrink-0 font-bold text-amber-700 font-serif-tc">
                    <h2 className="text-lg flex items-center gap-2"><Icons.Settings size={20}/>管理常買品項 (排序/刪除)</h2>
                    <button onClick={() => setIsQuickManageOpen(false)} className="text-neutral-400 p-1"><Icons.X /></button>
                  </div>
                  <p className="text-xs text-neutral-400 mb-2 font-bold flex justify-center items-center gap-1"><Icons.GripVertical size={12} /> 拖曳左側圖示即可自由排序</p>
                  <div className="overflow-y-auto space-y-2 pr-1 scrollbar-hide font-bold relative">
                    {quickItems.length === 0 && <div className="text-center text-neutral-400 py-4 text-sm">目前無常買品項</div>}
                    {quickItems.map((q, i) => (
                      <div 
                        key={i} 
                        data-v-quick-index={i}
                        draggable
                        onDragStart={(e) => handleDragStartQuick(e, i)}
                        onDragOver={(e) => handleDragOverQuick(e, i)}
                        onDragEnd={handleDragEndQuick}
                        onTouchStart={() => setDraggedQuickIdx(i)}
                        onTouchMove={handleTouchMoveQuick}
                        onTouchEnd={handleDragEndQuick}
                        className={`flex justify-between items-center bg-neutral-50 p-2 rounded-xl border transition-all no-select ${dragOverQuickIdx === i ? 'border-amber-400 bg-amber-50 shadow-md -translate-y-1 scale-[1.02]' : 'border-neutral-100'}`}
                      >
                        <div className="flex items-center gap-2">
                          <div className="cursor-move p-2 text-neutral-400 hover:text-amber-600 touch-none"><Icons.GripVertical /></div>
                          <div>
                            <div className="font-bold text-sm text-neutral-700">{q.n || q.name}</div>
                            <div className="text-[10px] text-amber-600 font-bold">{q.t || q.tag}</div>
                          </div>
                        </div>
                        <button onClick={() => delQuick(i)} className="text-red-400 hover:bg-red-50 p-2 rounded-lg active:scale-75 transition-all"><Icons.Trash size={18}/></button>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {isRoomOpen && (
              <div className="fixed inset-0 bg-black/60 z-[150] flex items-center justify-center p-4 backdrop-blur-sm">
                <div className="bg-white w-full max-w-sm rounded-3xl p-5 shadow-2xl animate-slide-up flex flex-col max-h-[85vh]">
                  <div className="flex justify-between items-center mb-4 shrink-0 font-bold text-emerald-800 font-serif-tc"><h2 className="text-lg flex items-center gap-2"><Icons.User size={20}/>共享頻道管理</h2><button onClick={() => setIsRoomOpen(false)} className="text-neutral-300"><Icons.X /></button></div>
                  
                  <div className="overflow-y-auto space-y-6 pr-1 scrollbar-hide font-bold">
                    {savedRooms.length > 0 && (
                      <div>
                        <h3 className="text-xs font-bold text-neutral-400 mb-3 flex items-center gap-1.5"><Icons.History size={14}/> 快速調頻 (記憶清單)</h3>
                        <div className="space-y-2">
                          {savedRooms.map(room => (
                            <div key={room.code} onClick={() => handleTuneRoom(room.code, room.note, true)} className={`flex justify-between items-center p-3 rounded-2xl border transition-all cursor-pointer ${roomCode === room.code ? 'bg-amber-50 border-amber-300 shadow-sm scale-[1.02]' : 'bg-neutral-50 border-neutral-100'}`}>
                              <div className="flex flex-col">
                                <span className={`font-bold ${roomCode === room.code ? 'text-amber-700' : 'text-neutral-600'}`}>{room.code}</span>
                                {room.note && <span className="text-[10px] text-neutral-400 font-bold italic">{room.note}</span>}
                              </div>
                              <button onClick={(e) => handleForgetRoom(e, room.code)} className="p-1 text-neutral-300 hover:text-red-500 active:scale-75 transition-all"><Icons.X /></button>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}

                    <div className={savedRooms.length > 0 ? "pt-4 border-t border-dashed border-neutral-200" : ""}>
                      <h3 className="text-xs font-bold text-neutral-400 mb-3 flex items-center gap-1.5"><Icons.Plus size={14}/> 輸入新頻道代號與備註</h3>
                      <div className="space-y-3 mb-4">
                        <input type="text" id="rIn" placeholder="代號 (如 888)..." className="w-full p-3 bg-neutral-100 rounded-xl outline-none border-2 border-emerald-100 focus:border-emerald-600 font-bold text-xl text-center tracking-widest text-emerald-800" />
                        <div className="flex gap-2">
                          <input type="text" id="rNote" placeholder="加個備註 (如：家裡用)" className="flex-1 min-w-0 p-3 bg-neutral-100 rounded-xl outline-none border-2 border-neutral-100 focus:border-emerald-500 font-bold text-sm" />
                          <button onClick={() => handleTuneRoom(document.getElementById('rIn').value, document.getElementById('rNote').value)} className="bg-emerald-700 text-white px-5 rounded-xl font-bold shadow-lg active:scale-95 transition-all text-white shrink-0">對頻</button>
                        </div>
                      </div>
                    </div>

                    {roomCode && (
                      <button onClick={() => handleTuneRoom('')} className="w-full py-3 text-sm text-red-400 font-bold border-t border-neutral-100 mt-2">退出目前的共享頻道</button>
                    )}
                  </div>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
